# Runs the Office Script harness suites on every push/PR (HG-7, r2).
# Job 1 needs no binary fixtures — just Python + PyYAML + Node 22.
# Job 2 builds the OOXML fixtures and runs the full format suite.
name: harness

on:
  push:
  pull_request:

jobs:
  fixture-free:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review/harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install PyYAML
      - run: python3 check_related.py
      - run: python3 check_regex.py

  full-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review/harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python3 make_fixtures.py
      - run: python3 check_format.py
      - run: python3 render_sample.py
      - run: python3 check_pptx.py
