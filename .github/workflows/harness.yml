# Runs every gate under tests/ on every push/PR.
# Job 1 needs no binary fixtures — just Python + PyYAML + Node 22.
# Job 2 builds the OOXML fixtures and runs the full format suite.
# Job 3 type-checks every extract/*.ts at ES2017.
# Job 4 (main pushes only) fast-forwards the `deploy` branch once
# everything is green: the sweep machine's self-update pulls `deploy`,
# so only harness-passing code ever reaches the nightly run (r7, R3).
name: harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixture-free:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install PyYAML anthropic mkdocs-material mkdocs-glightbox mkdocs-panzoom-plugin markdown-captions
      - run: python3 test_lrsdoc.py
      - run: python3 check_related.py
      - run: python3 check_regex.py
      - run: python3 check_shapes.py
      - run: python3 check_pad_runner.py
      - run: python3 check_local_sweep.py
      - run: python3 check_testplangen.py
      - run: python3 check_caseindex.py
      - run: python3 check_figureindex.py
      - run: python3 check_slug.py
      - run: python3 check_progress.py
      - run: python3 check_storyprofile.py
      - run: python3 check_deckspec.py
      - run: python3 check_wiki.py

  full-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python3 make_fixtures.py
      - run: python3 check_format.py
      - run: python3 check_svg2pptx.py
      - run: python3 check_draft2docx.py
      - run: python3 check_draft2pptx.py
      - run: python3 check_deck2pptx.py
      - run: python3 render_sample.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/check_typecheck.py

  promote:
    # main is deployable only after every suite is green; the sweep
    # machine pulls `deploy`, never main, so a red main cannot ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fixture-free, full-format, typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/deploy
