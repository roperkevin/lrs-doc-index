<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775.5 131" width="775.5" height="131" role="img" aria-label="Slide 8 interface wireframe"><title>Slide 8 interface wireframe</title><desc>Interface screenshot redrawn as a standardized wireframe: 1 button, 11 icons, 32 text rows. 28 of 32 text rows carry text transcribed from the screenshot (OCR, approximate); the rest render as placeholder bars; positions are approximate to the source image and colours are mapped to the corpus palette.</desc><style>.plate{fill:#FFFFFF;stroke:#D7DFDF;stroke-width:1}.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.route{stroke:#16302F;stroke-width:3;stroke-dasharray:10 6;stroke-linecap:butt}.ctx{stroke:#B9C6C6;stroke-width:2.4}.event{stroke-width:8}.flat{stroke-linecap:butt}.tick{stroke:#6E8285;stroke-width:1.15}.maj{stroke:#4E6265;stroke-width:1.4}.leader{stroke:#6E8285;stroke-width:1}.split{stroke:#16302F;stroke-width:1.4;stroke-dasharray:3 2.5;opacity:.55}.splitdot{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.edge{stroke:#4E6265;stroke-width:1.8}.free{stroke-width:2.2}.freefill{stroke-width:2.2;stroke-linejoin:round}.dashed{stroke-dasharray:7 4.5}.dotted{stroke-dasharray:1.6 3.6}.node{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.t-plain{fill:#FFFFFF}.t-ink{fill:#E9EDED}.t-muted{fill:#EFF2F2}.t-cool{fill:#E5F0F5}.t-warm{fill:#F9F0E2}.t-green{fill:#E6F2EC}.t-violet{fill:#EFEAF7}.t-red{fill:#F8E9E5}.nlabel{font-size:12px;fill:#16302F;font-weight:500}.swatch{stroke-width:5}.legend{font-size:10.5px;fill:#4E6265}.s-ink{stroke:#16302F}.f-ink{fill:#16302F}.s-muted{stroke:#6E8285}.f-muted{fill:#6E8285}.s-cool{stroke:#1B6E8C}.f-cool{fill:#1B6E8C}.s-warm{stroke:#C2701A}.f-warm{fill:#9C5A12}.s-green{stroke:#2E7D5B}.f-green{fill:#2E7D5B}.s-violet{stroke:#7A5AA6}.f-violet{fill:#7A5AA6}.s-red{stroke:#B2442F}.f-red{fill:#B2442F}.event.s-cool,.swatch.s-cool{stroke:#4FA7D5}.event.s-warm,.swatch.s-warm{stroke:#E39A45}.event.s-green,.swatch.s-green{stroke:#4EB183}.event.s-violet,.swatch.s-violet{stroke:#A58BD3}.event.s-red,.swatch.s-red{stroke:#DC8168}.wf-panel{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.4}.wf-box{fill:none;stroke:#6E8285;stroke-width:1.1}.wf-field{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.1}.wf-btn{stroke-width:1.2}.wf-sep{stroke:#D7DFDF;stroke-width:1}.wf-gk{fill:#B9C6C6}.wf-gkh{fill:#4E6265}.wf-gkp{fill:#FFFFFF}.wf-ico{fill:#EFF2F2;stroke:#6E8285;stroke-width:1.1}.wf-tx{fill:#4E6265}.wf-txh{fill:#16302F;font-weight:600}.wf-txp{fill:#16302F;font-weight:500}text{font-family:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.measure{font-size:11px;fill:#6E8285;font-variant-numeric:tabular-nums}.id{font-size:12.5px;font-weight:600}.note{font-size:12px;fill:#16302F}</style><defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#16302F"/></marker><marker id="ae" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#4E6265"/></marker></defs><rect class="plate" x="1" y="1" width="773.5" height="129" rx="6"/><g transform="translate(15.7,17.2)"><rect class="wf-box" x="502.6" y="26" width="3.5" height="4.6" rx="4"/><rect class="wf-box" x="541.8" y="26" width="3.5" height="4.6" rx="4"/><rect class="wf-box" x="483.1" y="75.3" width="3" height="3.5" rx="4"/><line class="ln wf-sep" x1="170.1" y1="10" x2="198.7" y2="10"/><line class="ln wf-sep" x1="359.7" y1="27.2" x2="388.3" y2="27.2"/><line class="ln wf-sep" x1="431.3" y1="27.6" x2="485.4" y2="27.6"/><line class="ln wf-sep" x1="91.8" y1="55.7" x2="170.4" y2="55.7"/><rect class="wf-btn t-cool s-cool" x="370.1" y="86.5" width="9.1" height="3" rx="4"/><rect class="wf-ico" x="4.3" y="8.1" width="3.8" height="3.5" rx="2.5"/><rect class="wf-ico" x="32.9" y="8.1" width="6.1" height="7.1" rx="2.5"/><text class="wf-tx" x="50.6" y="10.1" font-size="8">3&quot;</text><text class="wf-tx" x="69.5" y="14.4" font-size="8">pane</text><text class="wf-tx" x="101.9" y="14.4" font-size="8">has</text><text class="wf-tx" x="128.2" y="14.4" font-size="8">components</text><text class="wf-tx" x="160.5" y="14.4" font-size="8">components</text><text class="wf-tx" x="208.3" y="14.4" font-size="8">for</text><text class="wf-tx" x="228" y="14.4" font-size="8">target</text><text class="wf-tx" x="261.9" y="14.4" font-size="8">route(s):</text><rect class="wf-ico" x="32.9" y="26.9" width="3.3" height="3" rx="2.5"/><rect class="wf-ico" x="46.9" y="24.4" width="5.7" height="8.1" rx="2.5"/><rect class="wf-ico" x="61" y="25.5" width="4" height="5.8" rx="2.5"/><text class="wf-tx" x="75.1" y="31.3" font-size="8.4">first component contains the</text><text class="wf-tx" x="211.1" y="31.3" font-size="8.4">the most important information regarding</text><text class="wf-tx" x="401.2" y="31.3" font-size="8.4">regarding the</text><text class="wf-tx" x="430" y="31.2" font-size="8">the reassigned</text><text class="wf-tx" x="497.9" y="31.3" font-size="8.4">routes: route name,</text><text class="wf-tx" x="607" y="31.2" font-size="8">from measure, and</text><text class="wf-tx" x="703.3" y="31.2" font-size="8">to</text><text class="wf-tx" x="46.9" y="43.3" font-size="8">measure.</text><rect class="wf-ico" x="61" y="52.9" width="5" height="4.3" rx="2.5"/><text class="wf-tx" x="75.1" y="57.8" font-size="8">routes are never merged in this method</text><rect class="wf-ico" x="61" y="65.8" width="5" height="4.3" rx="2.5"/><text class="wf-tx" x="75.1" y="70.7" font-size="8">By default,</text><text class="wf-tx" x="104.2" y="70.7" font-size="8">default,</text><text class="wf-tx" x="118.1" y="70.7" font-size="8">all entire routes being reassigned keep their original route name and route id; all parti…</text><text class="wf-tx" x="515.5" y="70.7" font-size="8">attached to original route name and a new</text><rect class="wf-ico" x="114" y="69.5" width="1.8" height="2.5" rx="2.5"/><rect class="wf-ico" x="415.4" y="69.5" width="1.5" height="2.5" rx="2.5"/><rect class="wf-gk" x="452" y="71.9" width="8" height="4.5" rx="2.3"/><rect class="wf-gk" x="492" y="71.9" width="8" height="4.5" rx="2.3"/><text class="wf-tx" x="75.1" y="79.9" font-size="8">route id. If the default</text><text class="wf-tx" x="149.9" y="79.9" font-size="8">default name for a partial route</text><text class="wf-tx" x="259.6" y="79.9" font-size="8">(R_reassign) is an existing name, we keep stacking</text><rect class="wf-gk" x="460.9" y="74.8" width="30.1" height="4.5" rx="2.3"/><text class="wf-tx" x="497.9" y="79.9" font-size="8">to the suffix until it is not identical with any route</text><rect class="wf-ico" x="112" y="86.2" width="1.8" height="2.5" rx="2.5"/><rect class="wf-gk" x="378.7" y="82.9" width="9.1" height="4.5" rx="2.3"/><rect class="wf-ico" x="61" y="88.5" width="5" height="4.3" rx="2.5"/><text class="wf-tx" x="75.1" y="92.2" font-size="8">All routes’</text><text class="wf-tx" x="118.1" y="92.2" font-size="8">From measure defaults</text><text class="wf-tx" x="192.1" y="92.2" font-size="8">defaults to 0 and To measure is calculated from 0</text></g></svg>