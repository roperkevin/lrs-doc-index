<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 753.2 1499.3" width="753.2" height="1499.3" role="img" aria-label="Slide 2 interface wireframe (1 of 2)"><title>Slide 2 interface wireframe (1 of 2)</title><desc>Interface screenshot redrawn as a standardized wireframe: 3 panels, 8 icons, 48 text rows. 47 of 48 text rows carry text transcribed from the screenshot (OCR, approximate); the rest render as placeholder bars; positions are approximate to the source image and colours are mapped to the corpus palette.</desc><style>.plate{fill:#FFFFFF;stroke:#D7DFDF;stroke-width:1}.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.route{stroke:#16302F;stroke-width:3;stroke-dasharray:10 6;stroke-linecap:butt}.ctx{stroke:#B9C6C6;stroke-width:2.4}.event{stroke-width:8}.flat{stroke-linecap:butt}.tick{stroke:#6E8285;stroke-width:1.15}.maj{stroke:#4E6265;stroke-width:1.4}.leader{stroke:#6E8285;stroke-width:1}.split{stroke:#16302F;stroke-width:1.4;stroke-dasharray:3 2.5;opacity:.55}.splitdot{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.edge{stroke:#4E6265;stroke-width:1.8}.free{stroke-width:2.2}.freefill{stroke-width:2.2;stroke-linejoin:round}.dashed{stroke-dasharray:7 4.5}.dotted{stroke-dasharray:1.6 3.6}.node{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.t-plain{fill:#FFFFFF}.t-ink{fill:#E9EDED}.t-muted{fill:#EFF2F2}.t-cool{fill:#E5F0F5}.t-warm{fill:#F9F0E2}.t-green{fill:#E6F2EC}.t-violet{fill:#EFEAF7}.t-red{fill:#F8E9E5}.nlabel{font-size:12px;fill:#16302F;font-weight:500}.swatch{stroke-width:5}.legend{font-size:10.5px;fill:#4E6265}.s-ink{stroke:#16302F}.f-ink{fill:#16302F}.s-muted{stroke:#6E8285}.f-muted{fill:#6E8285}.s-cool{stroke:#1B6E8C}.f-cool{fill:#1B6E8C}.s-warm{stroke:#C2701A}.f-warm{fill:#9C5A12}.s-green{stroke:#2E7D5B}.f-green{fill:#2E7D5B}.s-violet{stroke:#7A5AA6}.f-violet{fill:#7A5AA6}.s-red{stroke:#B2442F}.f-red{fill:#B2442F}.event.s-cool,.swatch.s-cool{stroke:#4FA7D5}.event.s-warm,.swatch.s-warm{stroke:#E39A45}.event.s-green,.swatch.s-green{stroke:#4EB183}.event.s-violet,.swatch.s-violet{stroke:#A58BD3}.event.s-red,.swatch.s-red{stroke:#DC8168}.wf-panel{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.4}.wf-box{fill:none;stroke:#6E8285;stroke-width:1.1}.wf-field{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.1}.wf-btn{stroke-width:1.2}.wf-sep{stroke:#D7DFDF;stroke-width:1}.wf-gk{fill:#B9C6C6}.wf-gkh{fill:#4E6265}.wf-gkp{fill:#FFFFFF}.wf-ico{fill:#EFF2F2;stroke:#6E8285;stroke-width:1.1}.wf-tx{fill:#4E6265}.wf-txh{fill:#16302F;font-weight:600}.wf-txp{fill:#16302F;font-weight:500}text{font-family:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.measure{font-size:11px;fill:#6E8285;font-variant-numeric:tabular-nums}.id{font-size:12.5px;font-weight:600}.note{font-size:12px;fill:#16302F}</style><defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#16302F"/></marker><marker id="ae" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#4E6265"/></marker></defs><rect class="plate" x="1" y="1" width="751.2" height="1497.3" rx="6"/><g transform="translate(16.1,13.7)"><rect class="wf-panel" x="3.9" y="6.3" width="713.2" height="1459.3" rx="7"/><rect class="wf-panel" x="18.8" y="1308.1" width="683.8" height="99.5" rx="7"/><rect class="wf-panel" x="18.8" y="81.2" width="604.5" height="46.4" rx="7"/><text class="wf-txh" x="18.8" y="36.2" font-size="15">Assistant (Beta)</text><text class="wf-tx" x="627.2" y="33.7" font-size="8">vax</text><rect class="wf-ico" x="659.1" y="22.6" width="11.6" height="17.4" rx="2.5"/><text class="wf-tx" x="687.1" y="36.1" font-size="14.8">vax</text><text class="wf-tx" x="677.5" y="98.6" font-size="8">S</text><text class="wf-tx" x="67.7" y="111.5" font-size="13.9">How do |</text><text class="wf-tx" x="154" y="111.2" font-size="13">create a route in LRS?</text><text class="wf-tx" x="426.2" y="111.8" font-size="14.8">12/8/2025 9:39AM</text><rect class="wf-gk" x="606" y="104.2" width="11.6" height="4.6" rx="2.3"/><rect class="wf-ico" x="636.9" y="94.4" width="27.1" height="25.1" rx="2.5"/><text class="wf-tx" x="677.5" y="110.9" font-size="12.2">S</text><text class="wf-tx" x="203.9" y="181.6" font-size="13.9">How do |</text><text class="wf-tx" x="287" y="181.3" font-size="13">create a route in LRS?</text><text class="wf-txh" x="35.8" y="266.3" font-size="15">+ Assistant</text><text class="wf-tx" x="48.3" y="328.2" font-size="15">To create a route in an LRS (Linear Referencing System) using</text><text class="wf-tx" x="48.3" y="357.2" font-size="15">ArcGIS Pro, follow these key steps:</text><rect class="wf-ico" x="100.5" y="400.1" width="6.8" height="14.5" rx="2.5"/><text class="wf-tx" x="154" y="412.3" font-size="15">Prepare your data: Add the centerline and network</text><text class="wf-tx" x="128.9" y="442.2" font-size="15">feature classes to your map. Ensure centerlines exist for</text><text class="wf-tx" x="128.9" y="471.2" font-size="15">the route location and do not overlap other centerlines in</text><text class="wf-tx" x="128.9" y="497.4" font-size="13.9">the LRS.</text><rect class="wf-ico" x="100.5" y="532.2" width="8.7" height="14.5" rx="2.5"/><text class="wf-tx" x="154" y="544" font-size="13.9">Open the Create</text><text class="wf-tx" x="249.3" y="544" font-size="13.9">Create Route tool:</text><text class="wf-tx" x="183.6" y="602.7" font-size="15">On the Location Referencing tab, in the Routes</text><text class="wf-tx" x="183.6" y="630.9" font-size="15">group, click Create.</text><text class="wf-tx" x="318" y="629.9" font-size="12.2">Create.</text><text class="wf-tx" x="183.6" y="660.6" font-size="15">The Create Route pane appears with selection tools</text><text class="wf-tx" x="183.6" y="689.6" font-size="15">(e.g., Select By Rectangle).</text><rect class="wf-ico" x="100.5" y="731.4" width="8.7" height="14.5" rx="2.5"/><text class="wf-tx" x="128.9" y="742.9" font-size="13">Select centerlines:</text><text class="wf-tx" x="225.2" y="743.2" font-size="13.9">centerlines:</text><text class="wf-tx" x="183.6" y="798" font-size="13.9">Use the selection tools to select one or more</text><text class="wf-tx" x="183.6" y="827" font-size="13.9">centerlines that will form the route.</text><text class="wf-tx" x="183.6" y="858.8" font-size="15">Click the “Allow choosing of one or more</text><text class="wf-tx" x="183.6" y="887.8" font-size="15">centerlines&quot; button to confirm your selection.</text><text class="wf-tx" x="183.6" y="916.8" font-size="15">You can reorder, flip direction, or remove</text><text class="wf-tx" x="183.6" y="945.7" font-size="15">centerlines in the table that appears.</text><rect class="wf-ico" x="100.5" y="987.4" width="13.5" height="14.5" rx="2.5"/><text class="wf-tx" x="128.9" y="999.2" font-size="13.9">Choose the network:</text><text class="wf-tx" x="287" y="999.2" font-size="13.9">network:</text><text class="wf-tx" x="183.6" y="1057.9" font-size="15">From the Network drop-down, select the LRS</text><text class="wf-tx" x="183.6" y="1084" font-size="13.9">Network where the route will be added.</text><rect class="wf-ico" x="100.5" y="1129.1" width="8.7" height="14.5" rx="2.5"/><text class="wf-tx" x="128.9" y="1141.3" font-size="15">Set route properties:</text><text class="wf-tx" x="300.6" y="1138.8" font-size="8">properties:</text><text class="wf-tx" x="183.6" y="1196.2" font-size="13.9">Choose a start date for the route.</text><text class="wf-tx" x="183.6" y="1226.7" font-size="15">Provide a unique Route</text><text class="wf-tx" x="404.9" y="1226.4" font-size="13.9">ID for the route within the</text><text class="wf-tx" x="183.6" y="1254.1" font-size="13.9">network and time slice.</text><text class="wf-tx" x="183.6" y="1285" font-size="15">Set the From Measure (default 0.000) and To</text><text class="wf-txh" x="35.8" y="1339.1" font-size="15">[Type a question or type / for options.</text><text class="wf-tx" x="35.8" y="1370.5" font-size="15">Use Ctrl + Up or Down arrows to scroll</text><text class="wf-tx" x="384.6" y="1370.5" font-size="15">previous questions.</text><rect class="wf-ico" x="18.8" y="1425.5" width="16.9" height="14.5" rx="2.5"/><text class="wf-tx" x="48.3" y="1437.7" font-size="15">Al-generated content may be inaccurate. See terms.</text></g></svg>