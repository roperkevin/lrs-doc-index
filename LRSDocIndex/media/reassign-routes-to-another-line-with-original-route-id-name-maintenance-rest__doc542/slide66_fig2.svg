<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 751.5 80.9" width="751.5" height="80.9" role="img" aria-label="Slide 66 interface wireframe (2 of 2)"><title>Slide 66 interface wireframe (2 of 2)</title><desc>Interface screenshot redrawn as a standardized wireframe: 4 icons, 17 text rows. 17 of 17 text rows carry text transcribed from the screenshot (OCR, approximate); positions are approximate to the source image and colours are mapped to the corpus palette.</desc><style>.plate{fill:#FFFFFF;stroke:#D7DFDF;stroke-width:1}.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.route{stroke:#16302F;stroke-width:3;stroke-dasharray:10 6;stroke-linecap:butt}.ctx{stroke:#B9C6C6;stroke-width:2.4}.event{stroke-width:8}.flat{stroke-linecap:butt}.tick{stroke:#6E8285;stroke-width:1.15}.maj{stroke:#4E6265;stroke-width:1.4}.leader{stroke:#6E8285;stroke-width:1}.split{stroke:#16302F;stroke-width:1.4;stroke-dasharray:3 2.5;opacity:.55}.splitdot{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.edge{stroke:#4E6265;stroke-width:1.8}.free{stroke-width:2.2}.freefill{stroke-width:2.2;stroke-linejoin:round}.dashed{stroke-dasharray:7 4.5}.dotted{stroke-dasharray:1.6 3.6}.node{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.t-plain{fill:#FFFFFF}.t-ink{fill:#E9EDED}.t-muted{fill:#EFF2F2}.t-cool{fill:#E5F0F5}.t-warm{fill:#F9F0E2}.t-green{fill:#E6F2EC}.t-violet{fill:#EFEAF7}.t-red{fill:#F8E9E5}.nlabel{font-size:12px;fill:#16302F;font-weight:500}.swatch{stroke-width:5}.legend{font-size:10.5px;fill:#4E6265}.s-ink{stroke:#16302F}.f-ink{fill:#16302F}.s-muted{stroke:#6E8285}.f-muted{fill:#6E8285}.s-cool{stroke:#1B6E8C}.f-cool{fill:#1B6E8C}.s-warm{stroke:#C2701A}.f-warm{fill:#9C5A12}.s-green{stroke:#2E7D5B}.f-green{fill:#2E7D5B}.s-violet{stroke:#7A5AA6}.f-violet{fill:#7A5AA6}.s-red{stroke:#B2442F}.f-red{fill:#B2442F}.event.s-cool,.swatch.s-cool{stroke:#4FA7D5}.event.s-warm,.swatch.s-warm{stroke:#E39A45}.event.s-green,.swatch.s-green{stroke:#4EB183}.event.s-violet,.swatch.s-violet{stroke:#A58BD3}.event.s-red,.swatch.s-red{stroke:#DC8168}.wf-panel{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.4}.wf-box{fill:none;stroke:#6E8285;stroke-width:1.1}.wf-field{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.1}.wf-btn{stroke-width:1.2}.wf-sep{stroke:#D7DFDF;stroke-width:1}.wf-gk{fill:#B9C6C6}.wf-gkh{fill:#4E6265}.wf-gkp{fill:#FFFFFF}.wf-ico{fill:#EFF2F2;stroke:#6E8285;stroke-width:1.1}.wf-tx{fill:#4E6265}.wf-txh{fill:#16302F;font-weight:600}.wf-txp{fill:#16302F;font-weight:500}text{font-family:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.measure{font-size:11px;fill:#6E8285;font-variant-numeric:tabular-nums}.id{font-size:12.5px;font-weight:600}.note{font-size:12px;fill:#16302F}</style><defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#16302F"/></marker><marker id="ae" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#4E6265"/></marker></defs><rect class="plate" x="1" y="1" width="749.5" height="78.9" rx="6"/><g transform="translate(15.1,17.2)"><rect class="wf-box" x="202.5" y="3.1" width="4.1" height="3.7" rx="4"/><rect class="wf-box" x="209.9" y="5.7" width="3.8" height="5" rx="4"/><rect class="wf-box" x="27.1" y="5.7" width="3.8" height="5" rx="4"/><rect class="wf-box" x="82.6" y="5.7" width="3.8" height="5" rx="4"/><rect class="wf-box" x="153.2" y="5.7" width="3" height="5" rx="4"/><rect class="wf-box" x="163.9" y="5.7" width="3.8" height="5" rx="4"/><rect class="wf-box" x="111.9" y="20.3" width="3.8" height="4.9" rx="4"/><rect class="wf-box" x="106.6" y="38" width="2.9" height="3.8" rx="4"/><line class="ln wf-sep" x1="301.3" y1="6.8" x2="340.7" y2="6.8"/><line class="ln wf-sep" x1="307.9" y1="7" x2="384.5" y2="7"/><line class="ln wf-sep" x1="380.4" y1="11.6" x2="716.4" y2="11.6"/><line class="ln wf-sep" x1="205.2" y1="43.6" x2="493.4" y2="43.6"/><rect class="wf-ico" x="4.9" y="4.8" width="6.6" height="6.3" rx="2.5"/><text class="wf-tx" x="20.4" y="10.7" font-size="8">For entire route,</text><text class="wf-tx" x="124.5" y="10.7" font-size="8">user provides</text><text class="wf-tx" x="186.6" y="10.7" font-size="8">provides Route Name that</text><text class="wf-tx" x="285.4" y="10.7" font-size="8">that</text><text class="wf-tx" x="306.5" y="11.1" font-size="9.1">belongs to other</text><text class="wf-tx" x="379.3" y="10.7" font-size="8">other route that</text><text class="wf-tx" x="439" y="10.7" font-size="8">that are still</text><text class="wf-tx" x="496.1" y="10.7" font-size="8">active than</text><text class="wf-tx" x="543.8" y="10.7" font-size="8">than source route or a</text><text class="wf-tx" x="665.8" y="10.7" font-size="8">brand</text><text class="wf-tx" x="694" y="10.7" font-size="8">new</text><rect class="wf-ico" x="106.6" y="10.1" width="2.9" height="3.6" rx="2.5"/><text class="wf-tx" x="20.4" y="24.8" font-size="8">route,</text><text class="wf-tx" x="56.9" y="24.8" font-size="8">return error</text><rect class="wf-ico" x="50.4" y="24.6" width="1.9" height="3.6" rx="2.5"/><rect class="wf-ico" x="35.3" y="37.2" width="4.9" height="4.4" rx="2.5"/><text class="wf-tx" x="50.4" y="42.2" font-size="8">In a word,</text><text class="wf-tx" x="93.9" y="42.2" font-size="8">target route name must be source route name,</text><text class="wf-tx" x="291.4" y="42.2" font-size="8">brand new route name,</text><text class="wf-tx" x="391.1" y="42.2" font-size="8">or a retired route’s name</text></g></svg>