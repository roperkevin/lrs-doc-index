<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="72 48 1950.4 988" width="1950.4" height="988" data-slide="13" data-shapes="38" data-connectors="0"><title>Slide 13 drawing — 38 shapes</title><rect x="72" y="48" width="1950.4" height="988" fill="#FFFFFF"/><text x="90.7" y="83.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#D2603A">METHOD CASE · P-LT-01</text><text x="90.7" y="147.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="42.6" fill="#2A2A2A">Line · Transfer to Another Line</text><rect x="88" y="181.9" width="610.4" height="84.7" rx="10" fill="none" stroke="#ECCCC0" stroke-width="0.8" data-prst="roundRect"/><text x="109.5" y="214.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" font-weight="bold" fill="#A8492A">Most-expanded method — collects target route name, from, to, AND</text><text x="109.5" y="235.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" font-weight="bold" fill="#A8492A">attributes.</text><text x="90.7" y="302.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9A9A9A">NETWORK</text><text x="90.7" y="333.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#34343C">Line (LineAttrNet, LineNet)</text><text x="90.7" y="380.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9A9A9A">PRECONDITION</text><text x="90.7" y="410" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">First pane resolves to Transfer with source route, source measures,</text><text x="90.7" y="431.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">and target line name. No target route name, target measures, or</text><text x="90.7" y="452.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">attributes given in initial prompt.</text><rect x="746.4" y="181.9" width="1085.6" height="245.6" rx="10" fill="none" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><rect x="747.2" y="182.7" width="1084" height="42" fill="#E5E5E5" data-prst="rect"/><ellipse cx="771.7" cy="203.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><ellipse cx="793.7" cy="203.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><ellipse cx="815.7" cy="203.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><text x="839.9" y="210.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#8A8A8A">prompt sequence</text><rect x="747.2" y="224.7" width="1084" height="202" fill="#F6F8FA" data-prst="rect"/><text x="797.9" y="257.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›&quot;Reassign RouteZ from 50 to 60 to Line1 in LineAttrNet on 01/01/2025.&quot;</text><text x="797.9" y="293.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›Change items when prompted: name (&quot;Call it RouteZ-A.&quot;), measures (&quot;From 0 to 10.&quot;), attributes (&quot;Arterial, County,</text><text x="797.9" y="313.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">45.&quot;)</text><text x="797.9" y="355.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›&quot;Yes.&quot;</text><text x="797.9" y="391.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#7A8590">▸Action: Click Next through the populated UI.</text><rect x="746.4" y="445.5" width="1085.6" height="142.8" rx="10" fill="#FFFFFF" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><text x="773.9" y="478.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D2603A">EXPECTED BEHAVIOR</text><text x="773.9" y="509.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">Assistant prompts for each missing item in turn — target route name, from measure, to measure, then attributes —</text><text x="773.9" y="530.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">confirming each. After approval it opens the populated first pane; Routes to Retire and the New Route Attributes</text><text x="773.9" y="551.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">pane (plus name/measures) are pre-populated.</text><rect x="746.4" y="649.2" width="250" height="1.6" fill="#E2E2E2" data-prst="rect"/><text x="765.1" y="634.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#2A2A2A">Network</text><rect x="996.4" y="649.2" width="835.6" height="1.6" fill="#E2E2E2" data-prst="rect"/><text x="1015.1" y="634.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#2A2A2A">Expected difference</text><rect x="746.4" y="650.8" width="1085.6" height="43.5" fill="#FBFCFD" data-prst="rect"/><rect x="746.4" y="693.5" width="250" height="1" fill="#EAEAEA" data-prst="rect"/><text x="765.1" y="678.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">LineAttrNet (has attrs)</text><rect x="996.4" y="693.5" width="835.6" height="1" fill="#EAEAEA" data-prst="rect"/><text x="1015.1" y="678.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">Attributes changed; attribute pane pre-populated.</text><rect x="746.4" y="736.6" width="250" height="1" fill="#EAEAEA" data-prst="rect"/><text x="765.1" y="721.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">LineNet (no attrs)</text><rect x="996.4" y="736.6" width="835.6" height="1" fill="#EAEAEA" data-prst="rect"/><text x="1015.1" y="721.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">Collects/confirms name + measures; no attribute prompt; no pane.</text><rect x="88" y="976.4" width="1744" height="1" fill="#F3F3F3" data-prst="rect"/><text x="90.7" y="1008.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Reassign Route · Second-Pane AI</text><text x="90.7" y="1028.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Assistant</text><text x="1788.1" y="1007.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.7" fill="#9A9A9A">15 /</text><text x="1788.1" y="1026.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.7" fill="#9A9A9A">25</text></svg>