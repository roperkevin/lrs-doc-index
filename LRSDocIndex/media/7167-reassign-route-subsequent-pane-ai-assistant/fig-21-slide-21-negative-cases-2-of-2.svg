ont-size="18.5" font-weight="bold" fill="#B3261E">Contract case: likely transitions and lets the tool error on Run, unless it pre-checks. Record actual behavior;</text><text x="726.7" y="516" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#B3261E">confirm intended contract with the team.</text><rect x="88" y="974.4" width="1744" height="1" fill="#F3F3F3" data-prst="rect"/><text x="90.7" y="1007.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.7" fill="#9A9A9A">Reassign Route · Second-Pane AI</text><text x="90.7" y="1026.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.7" fill="#9A9A9A">Assistant</text><text x="1788.1" y="1006.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" fill="#9A9A9A">21 /</text><text x="1788.1" y="1023.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" fill="#9A9A9A">25</text></svg>