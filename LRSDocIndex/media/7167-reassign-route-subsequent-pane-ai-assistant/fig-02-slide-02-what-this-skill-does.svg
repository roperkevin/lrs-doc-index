<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="80 54 1932.8 976" width="1932.8" height="976" data-slide="2" data-shapes="14" data-connectors="0"><title>Slide 2 drawing — 14 shapes</title><rect x="80" y="54" width="1932.8" height="976" fill="#FFFFFF"/><text x="98.7" y="90.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21" font-weight="bold" fill="#D2603A">OVERVIEW</text><text x="98.7" y="158" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="48.1" fill="#2A2A2A">What this skill does</text><text x="98.7" y="227.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="27" fill="#34343C">The existing Reassign Route AI Assistant skill already gathers the first UI pane. This story extends it to</text><text x="98.7" y="260.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="27" fill="#34343C">walk the user through the subsequent panes: gather and confirm the extra inputs those panes need, then</text><text x="98.7" y="292.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="27" fill="#34343C">pre-populate them so the user steps through a fully-filled UI.</text><ellipse cx="100.5" cy="383.3" rx="4.5" ry="4.5" fill="#D2603A" data-prst="ellipse"/><text x="125.7" y="387.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.2" font-weight="bold" fill="#2A2A2A">New behavior: gather and confirm subsequent-pane inputs, then hand off to a pre-populated</text><text x="125.7" y="414" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.2" font-weight="bold" fill="#2A2A2A">UI.</text><ellipse cx="100.5" cy="437.3" rx="4.5" ry="4.5" fill="#D2603A" data-prst="ellipse"/><text x="125.7" y="441.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.2" fill="#34343C">The first pane (network, date, source, measures, method) is treated as a precondition — already gathered before these</text><text x="125.7" y="468" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.2" fill="#34343C">steps.</text><ellipse cx="100.5" cy="491.3" rx="4.5" ry="4.5" fill="#D2603A" data-prst="ellipse"/><text x="125.7" y="495.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.2" fill="#34343C">The skill always opens the UI on pane 1; later panes fill in as the user</text><text x="125.7" y="522" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.2" fill="#34343C">clicks Next.</text><rect x="96" y="543.8" width="1500" height="78.5" rx="10" fill="#E1F5FE" data-prst="roundRect"/><text x="162" y="586.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="23" fill="#2E2E2E">First-pane recognition, licensing, and parameter collection are out of</text><text x="162" y="613.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="23" fill="#2E2E2E">scope for this plan.</text><rect x="96" y="966.4" width="1728" height="1" fill="#F3F3F3" data-prst="rect"/><text x="98.7" y="1002.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Reassign Route · Second-Pane AI</text><text x="98.7" y="1022.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Assistant</text><text x="1780.1" y="1002.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">02 /</text><text x="1780.1" y="1022.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">25</text></svg>