i, Carlito, Arial, sans-serif" font-size="16.7" fill="#24292F">&quot;Yes, open it.&quot; then navigate Back/Next</text><text x="1001.5" y="706" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">UI opens on pane 1 (never deep-links to pane 2/3); panes fill on Next; inputs maintained</text><text x="1001.5" y="727" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">across pane switches.</text><rect x="88" y="976.4" width="1744" height="1" fill="#F3F3F3" data-prst="rect"/><text x="90.7" y="1010.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Reassign Route · Second-Pane AI</text><text x="90.7" y="1030.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Assistant</text><text x="1788.1" y="1009.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.7" fill="#9A9A9A">19 /</text><text x="1788.1" y="1028.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.7" fill="#9A9A9A">25</text></svg>