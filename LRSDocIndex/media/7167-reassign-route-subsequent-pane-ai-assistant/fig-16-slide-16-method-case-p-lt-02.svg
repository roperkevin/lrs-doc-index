if" font-size="16.7" fill="#7A8590">(1)</text><text x="155.2" y="514.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#24292F">&quot;…on 01/01/2025.&quot;</text><text x="335.4" y="514.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#7A8590">(2)</text><text x="377.1" y="514.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#24292F">&quot;Call it RouteZ-A.&quot;</text><text x="577.2" y="514.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#7A8590">(3)</text><text x="618.9" y="514.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#24292F">&quot;From 0 to 10.&quot;</text><text x="779.3" y="514.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#7A8590">(4)</text><text x="821" y="514.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#24292F">&quot;Arterial, County, 45.&quot;</text><rect x="88" y="551.8" width="1744" height="114.2" rx="10" fill="#FFFFFF" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><text x="115.5" y="583.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D2603A">EXPECTED BEHAVIOR</text><text x="115.5" y="615.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19" font-weight="bold" fill="#34343C">All-up-front: confirms everything in one step, no re-ask. Partial: confirms name + measures, prompts for attributes. Incremental: confirms the running set after each turn,</text><text x="115.5" y="638.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19" font-weight="bold" fill="#34343C">prompts only for what's missing; nothing lost.</text><rect x="88" y="980.4" width="1744" height="1" fill="#F3F3F3" dat