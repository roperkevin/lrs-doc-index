<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="72 48 1950.4 988" width="1950.4" height="988" data-slide="5" data-shapes="38" data-connectors="0"><title>Slide 5 drawing — 38 shapes</title><rect x="72" y="48" width="1950.4" height="988" fill="#FFFFFF"/><text x="90.7" y="83.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#D2603A">METHOD CASE · P-NLF-01</text><text x="90.7" y="147.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="42.6" fill="#2A2A2A">Non-line · Form a New Route</text><text x="90.7" y="202.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9A9A9A">NETWORK</text><text x="90.7" y="234.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.4" fill="#34343C">Non-line (AttrNet, PlainNet)</text><text x="90.7" y="286" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9A9A9A">PRECONDITION</text><text x="90.7" y="317.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#34343C">First pane resolves to Form a New Route with source, source</text><text x="90.7" y="339.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#34343C">measures, target route, and target measures.</text><text x="90.7" y="397.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9A9A9A">FLOW</text><text x="90.7" y="429" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#5A5A5A">Prompt → assistant prompts for attributes → confirm → approve →</text><text x="90.7" y="451.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#5A5A5A">Next → attribute pane pre-populated</text><rect x="746.4" y="185.9" width="1085.6" height="222.4" rx="10" fill="none" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><rect x="747.2" y="186.7" width="1084" height="42" fill="#E5E5E5" data-prst="rect"/><ellipse cx="771.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><ellipse cx="793.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><ellipse cx="815.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><text x="839.9" y="214.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#8A8A8A">prompt sequence</text><rect x="747.2" y="228.7" width="1084" height="189.4" fill="#F6F8FA" data-prst="rect"/><text x="797.9" y="262.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›&quot;Split RouteX from 0 to 10 to form Route1 with target measures 0 to 10 in AttrNet on 01/01/2025.&quot;</text><text x="797.9" y="298.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">› Provide attributes when prompted (if not wanting to accept default values): &quot;RouteClass Arterial, Owner County, speed</text><text x="797.9" y="318.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">limit 45.&quot;</text><text x="796.4" y="344.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›&quot;Yes, open the tool.&quot;</text><text x="797.9" y="371.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#7A8590">▸Action: Click Next in the populated UI.</text><rect x="746.4" y="428.3" width="1085.6" height="153" rx="10" fill="#FFFFFF" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><text x="773.9" y="462.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D2603A">EXPECTED BEHAVIOR</text><text x="773.9" y="496.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" fill="#34343C">Assistant prompts for confirmation of the new route's additional attributes (does not skip the pane),</text><text x="773.9" y="520.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" fill="#34343C">then opens the populated UI on pane 1. On Next, the New Route Attributes pane is pre-populated with</text><text x="773.9" y="544.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" fill="#34343C">the confirmed values, shown via aliases.</text><rect x="746.4" y="647.1" width="230" height="1.6" fill="#E2E2E2" data-prst="rect"/><text x="765.1" y="630.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#2A2A2A">Network</text><rect x="976.4" y="647.1" width="855.6" height="1.6" fill="#E2E2E2" data-prst="rect"/><text x="995.1" y="630.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#2A2A2A">Expected difference</text><rect x="746.4" y="648.7" width="1085.6" height="46.4" fill="#FBFCFD" data-prst="rect"/><rect x="746.4" y="694.3" width="230" height="1" fill="#EAEAEA" data-prst="rect"/><text x="765.1" y="677.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">AttrNet (has attrs)</text><rect x="976.4" y="694.3" width="855.6" height="1" fill="#EAEAEA" data-prst="rect"/><text x="995.1" y="677.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">Attribute confirmation prompted, confirmed, pre-populated.</text><rect x="746.4" y="740.3" width="230" height="1" fill="#EAEAEA" data-prst="rect"/><text x="765.1" y="723.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">PlainNet (no attrs)</text><rect x="976.4" y="740.3" width="855.6" height="1" fill="#EAEAEA" data-prst="rect"/><text x="995.1" y="723.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">No attribute confirmation prompt; straight to UI; no second pane on Next.</text><rect x="88" y="974.4" width="1744" height="1" fill="#F3F3F3" data-prst="rect"/><text x="90.7" y="1008.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Reassign Route · Second-Pane AI</text><text x="90.7" y="1028.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Assistant</text><text x="1788.1" y="1008.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">07 /</text><text x="1788.1" y="1028.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">25</text></svg>