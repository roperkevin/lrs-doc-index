<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="72 48 1950.4 988" width="1950.4" height="988" data-slide="11" data-shapes="38" data-connectors="0"><title>Slide 11 drawing — 38 shapes</title><rect x="72" y="48" width="1950.4" height="988" fill="#FFFFFF"/><text x="90.7" y="83.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#D2603A">METHOD CASE · P-LM-01</text><text x="90.7" y="147.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="42.6" fill="#2A2A2A">Line · Merge to Adjacent Route</text><text x="90.7" y="202.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9A9A9A">NETWORK</text><text x="90.7" y="234.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.4" fill="#34343C">Line (LineAttrNet, LineNet)</text><text x="90.7" y="286" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9A9A9A">PRECONDITION</text><text x="90.7" y="317.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#34343C">Merge resolves with source from/to routes, source measures,</text><text x="90.7" y="339.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#34343C">target route, target measures, and recalibrate target.</text><text x="90.7" y="397.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9A9A9A">FLOW</text><text x="90.7" y="429" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#5A5A5A">Prompt → attributes (pane 3) → approve → Next to Routes to</text><text x="90.7" y="451.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#5A5A5A">Retire → Next to attribute pane</text><rect x="746.4" y="185.9" width="1085.6" height="247.6" rx="10" fill="none" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><rect x="747.2" y="186.7" width="1084" height="42" fill="#E5E5E5" data-prst="rect"/><ellipse cx="771.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><ellipse cx="793.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><ellipse cx="815.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><text x="839.9" y="214.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#8A8A8A">prompt sequence</text><rect x="747.2" y="228.7" width="1084" height="204" fill="#F6F8FA" data-prst="rect"/><text x="797.9" y="262.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›&quot;Merge RouteX from 0 to 20 into RouteY with target measures 0 to 30 in LineAttrNet on 01/01/2025. Recalibrate target</text><text x="797.9" y="282.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">downstream.&quot;</text><text x="797.9" y="323.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›Change attributes when prompted: &quot;RouteClass Arterial, Owner County, speed limit 45.&quot;</text><text x="797.9" y="360.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›&quot;Approve.&quot;</text><text x="797.9" y="396.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#7A8590">▸Action: Click Next to Pane 2 (Routes to Retire), then Next to Pane 3.</text><rect x="746.4" y="453.5" width="1085.6" height="121.1" rx="10" fill="#FFFFFF" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><text x="773.9" y="487.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D2603A">EXPECTED BEHAVIOR</text><text x="773.9" y="519.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">Assistant prompts for the merged route's attribute changes (Pane 3) and confirms. Pane 2 shows the correct routes</text><text x="773.9" y="540.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#34343C">with a MERGE note (source-line routes merged into the target route); Pane 3 is pre-populated.</text><rect x="746.4" y="640.4" width="250" height="1.6" fill="#E2E2E2" data-prst="rect"/><text x="765.1" y="623.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#2A2A2A">Network</text><rect x="996.4" y="640.4" width="835.6" height="1.6" fill="#E2E2E2" data-prst="rect"/><text x="1015.1" y="623.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#2A2A2A">Expected difference</text><rect x="746.4" y="642" width="1085.6" height="46.4" fill="#FBFCFD" data-prst="rect"/><rect x="746.4" y="687.6" width="250" height="1" fill="#EAEAEA" data-prst="rect"/><text x="765.1" y="671" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">LineAttrNet (has attrs)</text><rect x="996.4" y="687.6" width="835.6" height="1" fill="#EAEAEA" data-prst="rect"/><text x="1015.1" y="671" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">Pane 3 prompted for attribute changes, confirmed, pre-populated; Routes to Retire shown.</text><rect x="746.4" y="733.6" width="250" height="1" fill="#EAEAEA" data-prst="rect"/><text x="765.1" y="717.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">LineNet (no attrs)</text><rect x="996.4" y="733.6" width="835.6" height="1" fill="#EAEAEA" data-prst="rect"/><text x="1015.1" y="717.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">No attribute prompt; Routes to Retire reached; no third pane.</text><rect x="88" y="974.4" width="1744" height="1" fill="#F3F3F3" data-prst="rect"/><text x="90.7" y="1008.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Reassign Route · Second-Pane AI</text><text x="90.7" y="1028.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">Assistant</text><text x="1788.1" y="1008.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">13 /</text><text x="1788.1" y="1028.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#9A9A9A">25</text></svg>