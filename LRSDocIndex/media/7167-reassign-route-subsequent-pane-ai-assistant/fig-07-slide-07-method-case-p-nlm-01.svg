 x="90.7" y="451.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#5A5A5A">approve → Next → attribute pane pre-populated</text><rect x="746.4" y="185.9" width="1085.6" height="247.6" rx="10" fill="none" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><rect x="747.2" y="186.7" width="1084" height="42" fill="#E5E5E5" data-prst="rect"/><ellipse cx="771.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><ellipse cx="793.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><ellipse cx="815.7" cy="207.7" rx="6.5" ry="6.5" fill="#C9C8C8" data-prst="ellipse"/><text x="839.9" y="214.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#8A8A8A">prompt sequence</text><rect x="747.2" y="228.7" width="1084" height="204" fill="#F6F8FA" data-prst="rect"/><text x="797.9" y="262.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›&quot;Merge RouteX from 0 to 20 into RouteY with target measures 0 to 30 in AttrNet on 01/01/2025. Recalibrate target</text><text x="797.9" y="282.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">downstream.&quot;</text><text x="797.9" y="323.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›Change attributes when prompted: &quot;RouteClass Arterial, Owner County, speed limit 45.&quot;</text><text x="797.9" y="360.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#03904A">›&quot;Yes.&quot;</text><text x="797.9" y="396.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#7A8590">▸Action: Click Next in the UI.</text><rect x="746.4" y="453.5" width="1085.6" height="124" rx="10" fill="#FFFFFF" stroke="#ECECEC" stroke-width="0.8" data-prst="roundRect"/><text x="773.9" y="487.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D2603A">EXPECTED BEHAVIOR</text><text x="773.9" y="520.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#34343C">Assistant prompts for the merged route's additional attributes, confirms them, then opens the populated UI. On</text><text x="773.9" y="542.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.5" fill="#34343C">Next, the New Route Attributes pane is pre-populated (aliases shown).</text><rect x="746.4" y="643.3" width="230" height="1.6" fill="#E2E2E2" data-prst="rect"/><text x="765.1" y="626.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#2A2A2A">Network</text><rect x="976.4" y="643.3" width="855.6" height="1.6" fill="#E2E2E2" data-prst="rect"/><text x="995.1" y="626.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.6" fill="#2A2A2A">Expected difference</text><rect x="746.4" y="644.9" width="1085.6" height="46.4" fill="#FBFCFD" data-prst="rect"/><rect x="746.4" y="690.5" width="230" height="1" fill="#EAEAEA" data-prst="rect"/><text x="765.1" y="673.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">AttrNet (has attrs)</text><rect x="976.4" y="690.5" width="855.6" height="1" fill="#EAEAEA" data-prst="rect"/><text x="995.1" y="673.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">Attribute changes prompted, confirmed, pre-populated.</text><rect x="746.4" y="736.5" width="230" height="1" fill="#EAEAEA" data-prst="rect"/><text x="765.1" y="720.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16.7" fill="#34343C">PlainNet (no attrs)</text><rect x="976.4" y="736.5" width="855.6" height="1" fill="#EAEAEA" data-prst="rect"/><text x="995.1" y="720.1" text