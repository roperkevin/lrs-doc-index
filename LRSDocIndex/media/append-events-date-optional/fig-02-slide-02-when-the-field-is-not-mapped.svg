</text><text x="54.1" y="390.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Conflict prevention ON but ignored</text><text x="54.1" y="409.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Conflict prevention OFF</text><text x="54.1" y="429.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Test with inline and external PY</text><text x="54.1" y="448.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Test in Model Builder</text><text x="475.7" y="176.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If date fields are present in the</text><text x="475.7" y="195.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">loading event data, and they are</text><text x="475.7" y="214.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">not mapped, then do not consider</text><text x="475.7" y="233.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">them in the GP tool.</text></svg>