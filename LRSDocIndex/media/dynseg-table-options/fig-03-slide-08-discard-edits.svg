<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -3.6 752 840.8" width="752" height="840.8" data-slide="8" data-shapes="8" data-connectors="0"><title>Slide 8 drawing — 8 shapes</title><rect x="-16" y="-3.6" width="752" height="840.8" fill="#FFFFFF"/><rect x="0" y="12.4" width="720" height="32.1" fill="#031641" data-prst="rect"/><text x="360" y="34.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Discard edits</text><text x="40.3" y="90.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">The edits are not discarded when using the default version.</text><text x="40.3" y="109.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">The locks are not released after discarding the edits.</text><text x="40.3" y="128.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Verify that the edits are discarded for each of the event layers that have</text><text x="40.3" y="148" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">been edited through the dynseg table.</text><text x="40.3" y="167.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">The colored edited cells go back to their original color when the edits are</text><text x="40.3" y="186.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">discarded.</text><rect x="0" y="256.6" width="720" height="32.1" fill="#031641" data-prst="rect"/><text x="360" y="278.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Layer and field visibility</text><text x="40.3" y="334.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Verify that toggling the layer and field visibility does not re-dynseg the</text><text x="40.3" y="353.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">table.</text><text x="40.3" y="373" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">LRS, Referent, Editor Tracking, Object ID and Global ID fields are not</text><text x="40.3" y="392.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">shown in the list.</text><rect x="0" y="432" width="720" height="32.1" fill="#031641" data-prst="rect"/><text x="360" y="454" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Export</text><text x="40.3" y="504.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">The GeoJson output includes the features and attributes</text><text x="40.3" y="523.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Import the GeoJson using a GP tool in Pro and check if it matches up with a</text><text x="40.3" y="542.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">comparable output from the dynseg tool in Pro.</text><text x="40.3" y="561.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Open the CSV in Excel to check if data looks same as that in the table in</text><text x="40.3" y="580.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">ExB.</text><text x="40.3" y="600.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">What is the use of CSV and Json? Need to test as per the use case.</text><text x="40.3" y="619.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Only saved version is exported. That means if the cells are in yellow</text><text x="40.3" y="638.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">state, only their original values will be exported.</text><rect x="0" y="735.9" width="720" height="32.1" fill="#031641" data-prst="rect"/><text x="360" y="758" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Zoom in</text><text x="57.6" y="803.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Works with a single and multiple selected rows.</text></svg>