<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-34 -5 1321 730.2" width="1321" height="730.2" data-slide="2" data-shapes="5" data-connectors="0"><title>Slide 2 drawing — 5 shapes</title><rect x="-34" y="-5" width="1321" height="730.2" fill="#FFFFFF"/><text x="64" y="57.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="42.7" fill="#000000">User Story</text><text x="-8.4" y="337.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Support using multiple summary fields to create a length data product</text><text x="-8.4" y="360.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">using the Generate LRS product geoprocessing tool.</text><text x="-8.4" y="382.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">The summary fields are nested based on level. In the example here, the</text><text x="-8.4" y="405.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">base level is Route type (Level3) which are summarized by City (Level 2)</text><text x="-8.4" y="427.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">which are summarized by County (Level1).</text><text x="-8.4" y="449.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Length is calculated as a ∑ of (To measure – From Measure) for each event</text><text x="-8.4" y="472.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">(Functional Class Type) segment present for the selected routes.</text><rect x="744.9" y="47.5" width="220.8" height="478.4" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-01-slide-02-user-story.png" x="744.9" y="47.5" width="220.8" height="478.4" preserveAspectRatio="none"/><text x="855.3" y="290.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="45.9" y="74.8" width="672" height="233" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-02-user-story.png" x="45.9" y="74.8" width="672" height="233" preserveAspectRatio="none"/><text x="381.9" y="195.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="983" y="47.5" width="288" height="264.9" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-02-user-story.png" x="983" y="47.5" width="288" height="264.9" preserveAspectRatio="none"/><text x="1127" y="184" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="505.7" y="197.9" width="89.9" height="57.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-04-slide-02-user-story.png" x="505.7" y="197.9" width="89.9" height="57.6" preserveAspectRatio="none"/><text x="550.7" y="230.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="983" y="317.3" width="288" height="354.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-05-slide-02-user-story.png" x="983" y="317.3" width="288" height="354.3" preserveAspectRatio="none"/><text x="1127" y="498.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="1037" y="11" width="173.5" height="31.7" fill="#A5A5A5" stroke="#191919" stroke-width="1" data-prst="rect"/><text x="1123.8" y="31.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Template</text><rect x="1037" y="677.5" width="173.5" height="31.7" fill="#A5A5A5" stroke="#191919" stroke-width="1" data-prst="rect"/><text x="1123.8" y="686.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">CSV from GP</text><text x="1123.8" y="709.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Tool</text><rect x="646.7" y="38.6" width="64.6" height="31.7" fill="#A5A5A5" stroke="#191919" stroke-width="1" data-prst="rect"/><text x="679" y="59.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Data</text></svg>