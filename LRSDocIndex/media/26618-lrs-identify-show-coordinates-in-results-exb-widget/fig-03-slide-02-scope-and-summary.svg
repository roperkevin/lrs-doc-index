<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 992 553.9" width="992" height="553.9" data-slide="2" data-shapes="13" data-connectors="0"><title>Slide 2 drawing — 13 shapes</title><rect x="-16" y="-16" width="992" height="553.9" fill="#FFFFFF"/><rect x="20.8" y="173.1" width="474.8" height="347.9" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="image1.png" x="20.8" y="173.1" width="474.8" height="347.9" preserveAspectRatio="none"/><text x="258.2" y="351.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="33" y="293.4" width="183.2" height="215.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-02-scope-and-summary.png" x="33" y="293.4" width="183.2" height="215.6" preserveAspectRatio="none"/><text x="124.6" y="405.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="509.7" y="380.1" width="422.4" height="141.8" fill="#FFFFFF" data-prst="rect"/><rect x="509.7" y="367.1" width="7.7" height="154.8" fill="#A7BEAE" data-prst="rect"/><text x="531.4" y="418.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" font-weight="bold" fill="#3A2E2B">Out of scope</text><text x="532.7" y="447.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">No Z / elevation values - X,Y only</text><text x="532.7" y="464.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">Raw lat/long as a spatial reference</text><text x="532.7" y="481.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">option</text><rect x="509.7" y="144.9" width="422.4" height="228.8" fill="#FFFFFF" data-prst="rect"/><rect x="509.7" y="144.9" width="7.7" height="228.8" fill="#A7BEAE" data-prst="rect"/><text x="532.7" y="177.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" font-weight="bold" fill="#3A2E2B">In scope</text><text x="531.4" y="202.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">'Include coordinates in results' toggle in config -</text><text x="531.4" y="219.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">default OFF</text><text x="531.4" y="236.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">Set precision/tolerance in config (how many digits</text><text x="531.4" y="253.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">coordinate will have) – default to service precision</text><text x="531.4" y="269.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">Set Spatial Reference in config - default to LRS</text><text x="531.4" y="286.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">Coordinates derived from the LRS result location</text><text x="531.4" y="303.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">Highlight &amp; copy in 'X,Y' format</text><text x="531.4" y="320.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">Spatial reference shown in results</text><text x="531.4" y="337.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" fill="#6B615E">No performance degradation or regressions</text><rect x="243.2" y="330.2" width="154.2" height="19.2" fill="none" stroke="#A7BEAE" stroke-width="2" data-prst="rect"/><rect x="0" y="0" width="960" height="91.2" fill="#2F5597" data-prst="rect"/><text x="30.4" y="54" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#FFFFFF">Scope &amp; Summary</text><text x="23.7" y="117.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" font-weight="bold" fill="#181717">Objective: As an LRS event editor or analyst, I need</text><text x="23.7" y="135.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" font-weight="bold" fill="#181717">configurable coordinate output in the LRS Identify widget so</text><text x="23.7" y="152.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" font-weight="bold" fill="#181717">that I can interpret and reuse location information</text><text x="23.7" y="170.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" font-weight="bold" fill="#181717">accurately across systems.</text><rect x="243.2" y="352.5" width="154.2" height="27.6" fill="none" stroke="#A7BEAE" stroke-width="2" data-prst="rect"/></svg>