<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-380.6 -16 1076.7 1044.5" width="1076.7" height="1044.5" data-slide="4" data-shapes="8" data-connectors="0"><title>Slide 4 drawing — 8 shapes</title><rect x="-380.6" y="-16" width="1076.7" height="1044.5" fill="#FFFFFF"/><text x="9.6" y="22.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">New pane requires</text><text x="9.6" y="46.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">Dominant route information</text><text x="9.6" y="70.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">Selected Route ID/Name: Default is the most dominant route, in</text><text x="9.6" y="94.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">blue. If other routes from the dropdown are chosen, show in</text><text x="9.6" y="118.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">black</text><text x="9.6" y="142.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">If there is no concurrency for a section/time range (route from</text><text x="9.6" y="166.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">the first pane is the only route that exists), disable the</text><text x="9.6" y="190.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">route dropdown and show the only route in blue</text><text x="9.6" y="214.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">A grid of measure(s) on selected route</text><text x="9.6" y="238.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">When the user clicks next, transition to the 4th pane with the</text><text x="9.6" y="262.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">attributes</text><text x="9.6" y="286.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">If conflict prevention is enabled, acquire the locks for</text><text x="9.6" y="310.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">selected route(s) in this pane when transitioning to the</text><text x="9.6" y="334.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">attributes pane for adding single event, or acquire locks in</text><text x="9.6" y="358.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">attribute pane for adding multiple events</text><text x="9.6" y="382.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">If the route from the first pane does not end up being selected</text><text x="9.6" y="406.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">in concurrency pane, the route lock should become releasable</text><text x="9.6" y="430.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">The discussion about selecting and highlighting a segment did</text><text x="9.6" y="454.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">not have a conclusion in the user story estimation meeting. The</text><text x="9.6" y="478.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">PE needs to determine with the developer on how/how many</text><text x="9.6" y="502.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">sections can be expanded, selected/highlighted on the map</text><text x="9.6" y="526.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">Point event doesn’t need a highlight. It doesn’t in Pro.</text><text x="9.6" y="550.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">The concurrency pane lists all time ranges available in Start</text><text x="9.6" y="574.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">Date – End Date selected in the first pane, no matter what time</text><text x="9.6" y="598.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">it is in the map. For highlighting, even though the routes are</text><text x="9.6" y="622.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">hidden due to time in map, still show the highlight on map.</text><rect x="-364.6" y="0" width="339.6" height="503.2" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-03-new-pane-requires.png" x="-364.6" y="0" width="339.6" height="503.2" preserveAspectRatio="none"/><text x="-194.9" y="255.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="-355.9" y="154.8" width="175" height="19.4" fill="#F8F8F8" data-prst="rect"/><text x="