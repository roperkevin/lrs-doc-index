<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-380.6 -16 1404.6 993.4" width="1404.6" height="993.4" data-slide="3" data-shapes="9" data-connectors="0"><title>Slide 3 drawing — 9 shapes</title><rect x="-380.6" y="-16" width="1404.6" height="993.4" fill="#FFFFFF"/><text x="9.6" y="23.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">New pane requires</text><text x="9.6" y="49.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">When 1 or 3 from the example conditions are met (previous</text><text x="9.6" y="75" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">slide), have the tool transition to the new pane</text><text x="9.6" y="100.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">A paragraph about what this pane does shows up under tool</text><text x="9.6" y="126.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">title</text><text x="9.6" y="151.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Then, a Time Range dropdown for the temporal concurrencies</text><text x="9.6" y="177.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">By default, show the earliest time slice</text><text x="9.6" y="203" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">If there is only 1 temporal concurrency, disable (grey) the</text><text x="9.6" y="228.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">dropdown</text><text x="9.6" y="254.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">If there is no concurrency in one of the time slices, we</text><text x="9.6" y="279.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">still show the time slice but only a non-editable black</text><text x="9.6" y="305.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">label for selected Route</text><text x="9.6" y="331" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">In each time slice, the concurrency sections below might</text><text x="9.6" y="356.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">differ</text><text x="9.6" y="382.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">A Reset button to the right of time dropdown to reset the</text><text x="9.6" y="407.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">options in the drop downs to the default returned by the</text><text x="9.6" y="433.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">concurrency logic</text><text x="9.6" y="459" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Under time, the concurrency sections. There will only be 1</text><text x="9.6" y="484.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">section for Add Point, and potentially multiple sections</text><text x="9.6" y="510.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">for Add Line</text><text x="9.6" y="535.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Section title is selected route’s (FromM to ToM) RID/Rname</text><text x="9.6" y="561.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">. E.g. (2) I-4565339 for point, and (0 to 0.2) Willow to</text><text x="9.6" y="587" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Houston 200, for line.</text><text x="9.6" y="612.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">If it’s too long then use an ellipsis. If the user hovers</text><text x="9.6" y="638.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">shows them the whole section title</text><text x="9.6" y="663.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Order the sections by measure</text><rect x="-364.6" y="0" width="339.6" height="503.2" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-03-new-pane-requires.png" x="-364.6" y="0" width="339.6" height="503.2" preserveAspectRatio="none"/><text x="-194.9" y="255.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="-355.9" y="154.8" width="175" height="19.4" fill="#F8F8F8" data-prst="rect"/><text x="-268.4" y="168.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Time Range</text><rect x="-350" y="254.8" width="288.8" height="19.4" fill="#F8F8F8"