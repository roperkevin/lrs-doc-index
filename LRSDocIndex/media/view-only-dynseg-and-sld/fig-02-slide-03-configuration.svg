<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="3" data-shapes="6" data-connectors="1"><title>Slide 3 drawing — 6 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="27.5" y="116.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">Add toggle option above Merge coincident events called “View only”</text><text x="27.5" y="142" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">Default is off</text><text x="27.5" y="167.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">When it’s on, Dynseg table and SLD become non-editable as described in the next</text><text x="27.5" y="193.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">two pages.</text><text x="27.5" y="218.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">When it’s on, merge coincident event option can also be on but it won’t have</text><text x="27.5" y="244.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">any effect as editing is disabled</text><rect x="266.4" y="295.8" width="30.3" height="27.7" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" data-prst="rect"/><rect x="905.8" y="0" width="286.3" height="720" fill="#F3F3F3" stroke="#9A9A9A" stroke-dash