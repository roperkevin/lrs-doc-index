<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="4" data-shapes="41" data-connectors="4"><title>Slide 4 drawing — 41 shapes, 4 connectors</title><defs><marker id="ah-000000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#000000"/></marker></defs><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#4472C4" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#4472C4" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#ED7D31" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="27.5" y="114.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">No change in Dynseg table. Do not show site address layer in table nor create new segmentation</text><text x="27.5" y="136.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">Place site address points between intersections and point events, if any</text><text x="27.5" y="158.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">Honor site address symbology</text><text x="27.5" y="181.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">Hovering over a site address point shows Display field + Site Address ID, or Site Address ID itself if it is Display Field</text><text x="27.5" y="203.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">(like what we do today)</text><text x="27.5" y="226.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">Site addresses don’t carry measure and they are off routes most of time. Use the nearest measure on the route.</text><text x="27.5" y="248.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">After double clicking a site address record, pop-up window shows 1 section called “Fields” that shows all non-editor tracking</text><text x="27.5" y="270.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">fields. All fields are non-editable.</text><text x="27.5" y="293.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">Still show Statistics section if the site address contains numeric business fields</text><text x="27.5" y="315.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">If there are overlapping site addresses, just show the first returned (we have a story in the backlog to support clusters of</text><text x="27.5" y="338.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#404040">points like in this scenario and we'll address it in that story)</text><rect x="155.2" y="449.2" width="906.4" height="259.9" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-04-sld.png" x="155.2" y="449.2" width="906.4" height="259.9" preserveAspectRatio="none"/><text x="608.4" y="583.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="161.9" y="568.5" width="114.8" height="21.6" fill="#F0F0F0" data-prst="rect"/><text x="219.3" y="585.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Site</text><text x="219.3" y="603.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Addresses</text><rect x="291.7" y="567.3" width="385.1" height="24.4" fill="#FFFFFF" data-prst="rect"/><rect x="780.6" y="568.3" width="276.7" height="24.4" fill="#FFFFFF" data-prst="rect"/><ellipse cx="306" cy="580.4" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="323.3" cy="580.4" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="340" cy="580.6" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="356.8" cy="580.6" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="395.7" cy="580.2" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="413.1" cy="580.2" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="429.7" cy="580.4" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="446.5" cy="580.4" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="465.8" cy="580.6" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="483.1" cy="580.6" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="499.8" cy="580.8" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="516.6" cy="580.8" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="561.7" cy="580.4" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="579" cy="580.4" rx="4.1" ry="3.8" fill="#4472C4" stroke="#0A111D"