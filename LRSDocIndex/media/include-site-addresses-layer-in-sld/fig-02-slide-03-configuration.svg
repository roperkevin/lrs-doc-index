<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="3" data-shapes="6" data-connectors="2"><title>Slide 3 drawing — 6 shapes, 2 connectors</title><defs><marker id="ah-00B050" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00B050"/></marker></defs><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#4472C4" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#4472C4" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#ED7D31" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="27.5" y="116.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">If the LRS is ADM data and site address point layer is present</text><text x="27.5" y="142" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">in the webmap, add a toggle called “Show site addresses” under</text><text x="27.5" y="167.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">Show centerline in SLD settings</text><text x="27.5" y="193.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">Default state is on</text><text x="27.5" y="218.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">To hide site addresses in SLD, turn it off</text><text x="27.5" y="244.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">Users can choose any non-editor tracking or system fields</text><text x="27.5" y="270" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">(e.g. they can choose Full Address Number)</text><text x="27.5" y="295.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">Even when “Line only” is chosen for showing events, we still</text><text x="27.5" y="321.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">show Site Addresses when the toggle is on ??</text><text x="27.5" y="346.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">If the site addresses layer is unchecked in the Select layers</text><text x="27.5" y="372.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">pane (or removed in traditional mode), but this toggle is on,</text><text x="27.5" y="398" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">do not show in SLD. This is the same behavior as an event in</text><text x="27.5" y="423.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">the chosen attribute set is removed from Loaded layers.</text><rect x="1106" y="16.5" width="174" height="303.7" fill="#DAE3F3" data-prst="rect"/><text x="1193" y="37.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">Note:</text><text x="1193" y="59.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">This user story</text><text x="1193" y="82" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">will be</text><text x="1193" y="104.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">implemented</text><text x="1193" y="126.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">after having</text><text x="1193" y="149.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">Express Mode in</text><text x="1193" y="171.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">DynSeg widget,</text><text x="1193" y="194" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">so the majority</text><text x="1193" y="216.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">of designs will</text><text x="1193" y="238.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">be shown in</text><text x="1193" y="261.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">Express Mode,</text><text x="1193" y="283.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">but they work</text><text x="1193" y="306" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">the same in</text><text x="1193" y="328.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">“traditional</text><text x="1193" y="350.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">mode” aka</text><text x="1193" y="373.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">Select layers.</text><rect x="857.8" y="0" width="231.8" height="720" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-01-slide-03-configuration.png" x="857.8" y="0" width="231.8" height="720" preserveAspectRatio="none"/><text x="973.7" y="364" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 777.7 641.1 L 868.7 617" fill="none" stroke="#00B050" stroke-width="6" marker-end="url(#ah-00B050)"/></svg>