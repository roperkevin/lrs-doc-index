<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="12 100.7 696 773.8" width="696" height="773.8" data-slide="3" data-shapes="5" data-connectors="0"><title>Slide 3 drawing — 5 shapes</title><rect x="12" y="100.7" width="696" height="773.8" fill="#FFFFFF"/><rect x="30" y="116.7" width="660" height="28.8" rx="4.8" fill="#0C4982" data-prst="roundRect"/><text x="360" y="135.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Acceptance Criteria Tests: Verify that</text><rect x="28" y="529" width="660" height="28.8" rx="4.8" fill="#0C4982" data-prst="roundRect"/><text x="358" y="548.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Event Types</text><rect x="28" y="721" width="660" height="28.8" rx="4.8" fill="#0C4982" data-prst="roundRect"/><text x="358" y="740.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">GP Specific tests</text><text x="43.6" y="175.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">An optional parameter called “Ignore events with null LRS fields” is added to the</text><text x="43.6" y="193.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Generate Events GP Tool. Make sure that the parameter is ‘Optional’.</text><text x="43.6" y="210.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Default is unchecked.</text><text x="43.6" y="228.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">This options shows up only when UN dataset is present.</text><text x="43.6" y="245.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">When this parameter is unchecked, the tool should work as it does today i.e., the</text><text x="43.6" y="263.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">tool should work on the geometry of if any event records that have null RouteID and</text><text x="43.6" y="281.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Measure(s) fields are present.</text><text x="43.6" y="298.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">When this parameter is checked, any event records that have null RouteID and</text><text x="43.6" y="316.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Measure(s) fields should be ignored and the tool should run. Also confirm that no</text><text x="43.6" y="333.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">changes are made in terms of shapes or attributes of the event. Both the RID and</text><text x="43.6" y="351.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">measure fields should be Null. Ignore Loc Error too.</text><text x="43.6" y="369.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">The OIDs of event records that were skipped are listed in the text output file for</text><text x="43.6" y="386.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">the tool.</text><text x="43.6" y="404.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Test REST endpoint.</text><text x="45.6" y="788.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Model Builder: Single and chained</text><text x="45.6" y="806.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">PY: Standalone and in-line</text><text x="45.6" y="824.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Batch mode</text></svg>