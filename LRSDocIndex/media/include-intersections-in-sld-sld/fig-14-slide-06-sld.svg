<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="6" data-shapes="5" data-connectors="1"><title>Slide 6 drawing — 5 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="27.5" y="115" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">No change in Dynseg table. Do not show intersections in table nor create new segmentation</text><text x="27.5" y="138.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">Place Intersections at the top rows of SLD</text><text x="27.5" y="162.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">Honor intersection symbology</text><text x="27.5" y="186.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">Hovering over an intersection shows Display field + Intersection ID, or Intersection ID itself if it is Display</text><text x="27.5" y="209.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">Field (like what we do today)</text><text x="27.5" y="233.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">After double clicking an intersection record, pop-up window shows 1 section called “Fields” that shows all fields.</text><text x="27.5" y="257.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">All fields are non-editable.</text><text x="27.5" y="280.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">IntersectionID, IntersectionName, RouteID, FeatureID, FeatureClassName, FromDate, ToDate, Measure</text><text x="27.5" y="304.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">No statistics section</text><rect x="133" y="390" width="1061" height="330" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-13-slide-06-sld.png" x="133" y="390" width="1061" height="330" preserveAspectRatio="none"/><text x="663.5" y="559" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>