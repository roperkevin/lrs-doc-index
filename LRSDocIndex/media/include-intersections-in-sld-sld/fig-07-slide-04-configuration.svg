<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1442.7 752" width="1442.7" height="752" data-slide="4" data-shapes="6" data-connectors="1"><title>Slide 4 drawing — 6 shapes, 1 connector</title><rect x="-16" y="-16" width="1442.7" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="27.5" y="116.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">Have a SLD settings section under Default settings</text><text x="27.5" y="142" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">If webmap doesn’t contain any intersections, SLD settings</text><text x="27.5" y="167.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">only has Diagram default scale and Show statistics</text><text x="27.5" y="193.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">If webmap has intersection layers, the first thing in SLD</text><text x="27.5" y="218.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">settings is a dropdown</text><text x="27.5" y="244.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">Default state is Show intersection layers with all</text><text x="27.5" y="270" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">intersections layers checked below</text><text x="27.5" y="295.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">To hide a particular intersection layer, uncheck it</text><text x="27.5" y="321.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">If all intersection layers are unchecked, treat like B</text><text x="27.5" y="346.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">The other value is Hide intersection layers. When this</text><text x="27.5" y="372.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#404040">value is chosen, all checkboxes below are gone</text><rect x="670.6" y="16.5" width="253" height="501" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-04-configuration.png" x="670.6" y="16.5" width="253" height="501" preserveAspectRatio="none"/><text x="797.1" y="271" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="671.9" y="517.5" width="251.6" height="109.5" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-04-configuration.png" x="671.9" y="517.5" width="251.6" height="109.5" preserveAspectRatio="none"/><text x="797.7" y="576.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="858.5" y="18.7" width="63.9" height="63.9" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-04-slide-04-configuration.png" x="858.5" y="18.7" width="63.9" height="63.9" preserveAspectRatio="none"/><text x="890.5" y="54.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="938" y="0" width="472.7" height="720" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-05-slide-04-configuration.png" x="938" y="0" width="472.7" 