<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1329.6 752" width="1329.6" height="752" data-slide="5" data-shapes="6" data-connectors="2"><title>Slide 5 drawing — 6 shapes, 2 connectors</title><defs><marker id="ah-00B050" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00B050"/></marker></defs><rect x="-16" y="-16" width="1329.6" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="27.5" y="116.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">Users can choose any non-editor tracking or system fields by</text><text x="27.5" y="142" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">selecting the intersection layer in the webmap layer list</text><text x="27.5" y="167.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">Even when “Line only” is chosen for showing events, we still show</text><text x="27.5" y="193.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">intersections in SLD ??</text><text x="27.5" y="218.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">If an intersection is unchecked in the Select layers pane (or</text><text x="27.5" y="244.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">removed in traditional mode), but checked in Show intersection</text><text x="27.5" y="270" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">layers in SLD settings, do not show in SLD. This is the same</text><text x="27.5" y="295.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">behavior as an event in the chosen attribute set is removed from</text><text x="27.5" y="321.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#404040">Loaded layers.</text><rect x="1044.1" y="0" width="234" height="720" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-08-slide-05-configuration-ctd.png" x="1044.1" y="0" width="234" height="720" preserveAspectRatio="none"/><text x="1161.1" y="364" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="788.1" y="0" width="256" height="184" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-09-slide-05-configuration-ctd.png" x="788.1" y="0" width="256" height="184" preserveAspectRatio="none"/><text x="916.1" y="96" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="799.2" y="304.4" width="209.7" height="405.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-10-slide-05-configuration-ctd.png" x="799.2" y="304.4" width="209.7" height="405.6" preserveAspectRatio="none"/><text x="904.1" y="511.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 1231 191 L 894 332.5" fill="none" stroke="#00B050" stroke-width="4" marker-end="url(#ah-00B050)"/><rect x="1233.7" y="519.5" width="63