 is</text><text x="543.7" y="704" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">2 (2,14). We can</text><text x="543.7" y="732.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">choose the measure</text><text x="543.7" y="761.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">when selecting the</text><text x="543.7" y="790.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">pt. feature</text><path d="M 243.4 605.7 L 364.4 605.7" fill="none" stroke="#ED7D31" stroke-width="4" marker-start="url(#ah-ED7D31)"/><path d="M 364.4 605.7 L 364.4 499.3" fill="none" stroke="#ED7D31" stroke-width="4"/><path d="M 134.7 499.3 L 364.4 499.3" fill="none" stroke="#ED7D31" stroke-width="4"/><path d="M 134.7 605.7 L 243.4 605.7" fill="none" stroke="#ED7D31" stroke-width="4"/><path d="M 136.9 606.6 L 136.9 500.2" fill="none" stroke="#ED7D31" stroke-width="4"/><path d="M 245.5 605.7 L 245.5 712.2" fill="none" stroke="#ED7D31" stroke-width="4"/><text x="229.3" y="714.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#767171">0</text><text x="119.8" y="612.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#767171">4</text><text x="119.4" y="497.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#767171">6</text><text x="367.8" y="612.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#767171">12</text><text x="261.7" y="621.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#767171">14</text><text x="226.6" y="562.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#70AD47">Cafe</text><path d="M 241.2 609.2 L