<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-261.7 -16 1557.7 751.9" width="1557.7" height="751.9" data-slide="2" data-shapes="6" data-connectors="0"><title>Slide 2 drawing — 6 shapes</title><rect x="-261.7" y="-16" width="1557.7" height="751.9" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="719.9" fill="#4472C4" data-prst="rect"/><g transform="rotate(90 361.2 307.6)"><rect x="318.3" y="302.2" width="85.7" height="10.8" fill="#4472C4" data-prst="rect"/></g><rect x="-245.7" y="279.9" width="588.9" height="55.4" fill="#4472C4" data-prst="rect"/><rect x="60.8" y="96.9" width="1166.6" height="573.4" fill="#FFFFFF" data-prst="rect"/><text x="99.2" y="131.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="53.3" font-weight="bold" fill="#000000">User Story</text><text x="108.3" y="268.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">As an LRS editor, I want to generate intersection points at the location</text><text x="108.3" y="300.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">where a route self closes.</text><text x="108.3" y="332.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">This is a request from local government customers.</text><text x="108.3" y="364.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">Persona</text><text x="108.3" y="396.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">LRS Editor: This user is responsible for making edits to the LRS.</text><text x="108.3" y="428.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">In Pro, Currently we do not support generation of intersections at the</text><text x="108.3" y="460.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">self intersecting location on the routes. We need to enhance the generate</text><text x="108.3" y="492.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">intersection tool to generate intersection points at these self</text><text x="108.3" y="524.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#000000">intersecting locations.</text></svg>