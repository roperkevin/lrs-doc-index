<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-15.7 -16 1311.7 752" width="1311.7" height="752" data-slide="3" data-shapes="12" data-connectors="0"><title>Slide 3 drawing — 12 shapes</title><rect x="-15.7" y="-16" width="1311.7" height="752" fill="#FFFFFF"/><rect x="0.3" y="0" width="1279.7" height="720" fill="#4472C4" data-prst="rect"/><path d="M 1071.8 0 L 1190.9 0 L 1190.8 1.8 C 1185.1 29.4 1160.7 50.2 1131.4 50.2 C 1102.1 50.2 1077.6 29.4 1072 1.8 Z" fill="#FFC000"/><text x="69.9" y="46.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="40" font-weight="bold" fill="#000000">Generate Intersection at the self intersecting</text><text x="69.9" y="94.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="40" font-weight="bold" fill="#000000">location of a route</text><g transform="rotate(90 272.7 443.6)"><ellipse cx="272.7" cy="443.6" rx="214.4" ry="214.4" fill="none" stroke="#FFC000" stroke-width="13.3" stroke-dasharray="53.333333333333336 40" data-prst="arc"/></g><rect x="1027" y="295.4" width="252.7" height="324.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-03-generate-intersection-at-the-self.png" x="1027" y="295.4" width="252.7" height="324.3" preserveAspectRatio="none"/><text x="1153.4" y="461.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><text x="1154.9" y="325.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">R1</text><path d="M 1157.7 443.2 L 1166.3 443.2 L 1166.3 447.5 L 1170.7 447.5 L 1170.7 458.4 L 1166.3 458.4 L 1166.3 462.7 L 1157.7 462.7 L 1157.7 458.4 L 1153.4 458.4 L 1153.4 447.5 L 1157.7 447.5 Z" fill="#70AD47" stroke="#0A111D" stroke-width="1" data-prst="mathPlus"/><text x="1167.1" y="581.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">0</text><text x="1226.2" y="355.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">3.</text><text x="1226.2" y="371.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">6</text><text x="1079.3" y="358.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">2.</text><text x="1079.3" y="374.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">3</text><text x="1149.8" y="466.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">1</text><text x="1168" y="445" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">5</text><text x="99.5" y="192.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">If the intersection layer is same as the parent LRS network for an intersection feature class,</text><text x="99.5" y="219.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">then generate intersection GP tool should generate intersection at the self intersecting</text><text x="99.5" y="246.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">locations of the route.</text><text x="99.5" y="273.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">Since there will be more than one measure value at the intersection, the measure column can have</text><text x="99.5" y="301.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">any one of the value.</text><text x="99.5" y="328.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">When updating the intersection</text><text x="99.5" y="355.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">If a self intersecting route is created due to edit activities, new intersection will be created.</text><text x="99.5" y="382.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">If the route do not self intersect anymore due to an edit activity, then the intersection is</text><text x="99.5" y="409.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">retired.</text><text x="99.5" y="437.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">If the self intersecting point moves due to cartographic realign, present intersection will be</text><text x="99.5" y="464.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">moved</text><text x="99.5" y="491.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">If the route is deleted or do not intersect anymore due to carto realign, then the intersection</text><text x="99.5" y="518.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22.7" fill="#000000">point is deleted</text></svg>