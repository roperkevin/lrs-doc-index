<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1311.4 752" width="1311.4" height="752" data-slide="6" data-shapes="4" data-connectors="0"><title>Slide 6 drawing — 4 shapes</title><rect x="-16" y="-16" width="1311.4" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1279.4" height="720" fill="#FFFFFF" data-prst="rect"/><rect x="0" y="0" width="425.3" height="720" fill="#BD582C" data-prst="rect"/><text x="459.8" y="42.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Layer configuration should be displayed when a layer is selected.</text><text x="459.8" y="65.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to change the label for the layer.</text><text x="459.8" y="87.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">‘Route and Measure’ should be default for the search methods.</text><text x="459.8" y="110" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to show / hide different Search methods.</text><text x="459.8" y="132.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to set the search identifier for the Network (RouteID/</text><text x="459.8" y="154.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">RouteName).</text><text x="459.8" y="177.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">RouteID should be default identifier for nonline network.</text><text x="459.8" y="199.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">RouteName should be default identifier for line network.</text><text x="459.8" y="222" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Multifield route ID should be default identifier for multifield routeid network.</text><text x="459.8" y="244.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to set the sort field for the Network(RouteID/ RouteName).</text><text x="459.8" y="266.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able add the sort by single or multiple fields. New</text><text x="459.8" y="289.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Multiple sort fields should be able to add using the ‘Add a sort field’ button.</text><text x="459.8" y="311.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">New</text><text x="459.8" y="334" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to set the sort to ascending or descending for each sort field.</text><text x="459.8" y="356.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">New</text><text x="459.8" y="378.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Allow the user to choose whether the routeID, route name, or the multi fields</text><text x="459.8" y="401.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">that make up the concatenated routeID appear when the widget it launched</text><rect x="424.2" y="0" width="6.7" height="720" fill="#E48312" data-prst="rect"/><rect x="109.3" y="89.1" width="176.6" height="600.4" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-03-configuration.png" x="109.3" y="89.1" width="176.6" height="600.4" preserveAspectRatio="none"/><text x="197.6" y="393.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>