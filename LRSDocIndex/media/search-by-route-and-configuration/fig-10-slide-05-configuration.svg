<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1311.4 752" width="1311.4" height="752" data-slide="5" data-shapes="4" data-connectors="0"><title>Slide 5 drawing — 4 shapes</title><rect x="-16" y="-16" width="1311.4" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1279.4" height="720" fill="#FFFFFF" data-prst="rect"/><rect x="0" y="0" width="425.3" height="720" fill="#BD582C" data-prst="rect"/><text x="441.8" y="30.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to import all the Network layers from the map using the Import</text><text x="441.8" y="53.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">all button.</text><text x="441.8" y="75.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Provide a message when user clicks on Import all without selecting the map.</text><text x="441.8" y="98" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">If there is no LRS enabled service in the webmap, provide a message that no LRS</text><text x="441.8" y="120.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">enabled service is present.</text><text x="441.8" y="142.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to reorder the imported layers.</text><text x="441.8" y="165.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Allow only importing from a single map (if another map is chosen then clear the</text><text x="441.8" y="187.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">present layers before importing layers from different map).</text><text x="441.8" y="210" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Provide an error message if there are no Network layers in map.</text><text x="441.8" y="232.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Provide a message if the map has layers from more than one service.</text><text x="441.8" y="254.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">If there are more than one web map, list all those in the ‘Select a map’</text><text x="441.8" y="277.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">dropdown.</text><text x="441.8" y="299.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to remove any layer using x button next to the layer.</text><text x="441.8" y="322" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to set the Highlight color and width for the selected feature.</text><text x="441.8" y="344.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to set the number of records to display in the results page (page</text><text x="441.8" y="366.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">size).</text><text x="441.8" y="389.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to control the display of Method parameter.New</text><text x="441.8" y="411.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to set the default Network (if only one network available choose</text><text x="441.8" y="434" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">it by default). New</text><text x="441.8" y="456.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Should be able to control the display of Network parameter. New</text><rect x="424.2" y="0" width="6.7" height="720" fill="#E48312" data-prst="rect"/><rect x="207.8" y="123.3" width="183.6" height="585.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-09-slide-05-configuration.png" x="207.8" y="123.3" width="183.6" height="585.6" preserveAspectRatio="none"/><text x="299.6" y="420.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="16.5" y="123.3" width="178.6" height="585.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-03-configuration.png" x="16.5" y="123.3" width="178.6" height="585.6" preserveAspectRatio="none"/><text x="105.8" y="420.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>