<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="11" data-shapes="8" data-connectors="1"><title>Slide 11 drawing — 8 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0.3" y="672" width="1279.7" height="48" fill="#BD582C" data-prst="rect"/><rect x="0" y="665" width="1279.7" height="6.7" fill="#E48312" data-prst="rect"/><path d="M 126.8 456 L 1163.6 456" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="0" width="1279.7" height="720" fill="#E48312" data-prst="rect"/><rect x="0" y="0" width="481.3" height="720" fill="#BD582C" data-prst="rect"/><rect x="481.3" y="0" width="6.7" height="720" fill="#E48312" data-prst="rect"/><rect x="8.3" y="83.4" width="232.4" height="406" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="image15.png" x="8.3" y="83.4" width="232.4" height="406" preserveAspectRatio="none"/><text x="124.5" y="290.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="671.7" y="429.5" width="369.5" height="276.7" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="image16.png" x="671.7" y="429.5" width="369.5" height="276.7" preserveAspectRatio="none"/><text x="856.4" y="571.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="249" y="83.4" width="220.7" height="428" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-18-slide-11-search-by-route.png" x="249" y="83.4" width="220.7" height="428" preserveAspectRatio="none"/><text x="359.3" y="301.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><text x="507.1" y="24.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">If Multiple is chosen, then show two measure boxes.New</text><text x="507.1" y="47" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">If the user wants to locate more than two measures / stations on the</text><text x="507.1" y="69.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">route, they can use the ‘Add Another Measure’ button and another box</text><text x="507.1" y="91.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">will appear in the UI.New</text><text x="507.1" y="114.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">The additional measures can be removed using the x button which is</text><text x="507.1" y="136.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">visible on hover.New</text><text x="507.1" y="159" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">When the user enters routeid and measure(s), clicks search do the</text><text x="507.1" y="181.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">following:</text><text x="507.1" y="203.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Find the route and measure(s)</text><text x="507.1" y="226.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Transition the widget to a results pane that shows the route(s) that are</text><text x="507.1" y="248.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">returned by the search.</text><text x="507.1" y="293.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">When a record is selected from the results:</text><text x="507.1" y="315.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Zoom to that route and measure on the map</text><text x="507.1" y="338.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Highlight the route and the single measure location</text><text x="507.1" y="360.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Display route and measure label (as per cartographic standards, for</text><text x="507.1" y="383" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">example do not place overlapping labels) New</text><text x="507.1" y="427.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Measures can be in either US (0+00.00) or Metric (0+000.00) stationing</text><text x="507.1" y="450.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">format</text><text x="27.6" y="253.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#0070C0">54909500755</text><text x="27.6" y="334.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#0070C0">0.05</text></svg>