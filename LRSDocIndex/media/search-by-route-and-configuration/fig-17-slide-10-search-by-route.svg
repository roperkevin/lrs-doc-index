<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="10" data-shapes="7" data-connectors="1"><title>Slide 10 drawing — 7 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0.3" y="672" width="1279.7" height="48" fill="#BD582C" data-prst="rect"/><rect x="0" y="665" width="1279.7" height="6.7" fill="#E48312" data-prst="rect"/><path d="M 126.8 456 L 1163.6 456" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="0" width="1279.7" height="720" fill="#E48312" data-prst="rect"/><rect x="0" y="0" width="481.3" height="720" fill="#BD582C" data-prst="rect"/><rect x="481.3" y="0" width="6.7" height="720" fill="#E48312" data-prst="rect"/><text x="521.6" y="52.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Search button should be disabled until required parameters are provided.</text><text x="521.6" y="75.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">With Single option, When the user enter routeid and clicks search do the</text><text x="521.6" y="97.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">following:</text><text x="521.6" y="119.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Find the route(s)</text><text x="521.6" y="142.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Transition the widget to a results pane that shows the route(s) that are</text><text x="521.6" y="164.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">returned by the search.</text><text x="521.6" y="187.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">When a record is selected from the results:</text><text x="521.6" y="209.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Zoom to that route on the map</text><text x="521.6" y="231.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Highlight the route</text><text x="521.6" y="254.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Display route label (as per cartographic standards, for example do not</text><text x="521.6" y="276.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">place overlapping labels) New</text><rect x="32.1" y="299" width="417.2" height="416" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="image14.png" x="32.1" y="299" width="417.2" height="416" preserveAspectRatio="none"/><text x="240.7" y="511" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="92.7" y="70.3" width="193.3" height="218.5" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-15-slide-09-search-by-route.png" x="92.7" y="70.3" width="193.3" height="218.5" preserveAspectRatio="none"/><text x="189.3" y="183.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><text x="110.6" y="138.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">549095</text></svg>