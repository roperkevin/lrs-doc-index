<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="8" data-shapes="6" data-connectors="1"><title>Slide 8 drawing — 6 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0.3" y="672" width="1279.7" height="48" fill="#BD582C" data-prst="rect"/><rect x="0" y="665" width="1279.7" height="6.7" fill="#E48312" data-prst="rect"/><path d="M 126.8 456 L 1163.6 456" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="0" width="1279.7" height="720" fill="#E48312" data-prst="rect"/><rect x="0" y="0" width="481.3" height="720" fill="#BD582C" data-prst="rect"/><rect x="481.3" y="0" width="6.7" height="720" fill="#E48312" data-prst="rect"/><rect x="81.5" y="170.5" width="278" height="399.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-13-slide-08-search-by-route.png" x="81.5" y="170.5" width="278" height="399.3" preserveAspectRatio="none"/><text x="220.6" y="374.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><text x="510.7" y="41.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Create an Experience Builder widget called Search by Route that will allow</text><text x="510.7" y="63.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">the user to search for an entire route or a portion of a route.</text><text x="510.7" y="86.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Allow the user to populate the RouteID or Route Name (either a single field</text><text x="510.7" y="108.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">or the composite fields depending on the configuration) as well as the From</text><text x="510.7" y="131" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">and To Measure in the UI.</text><text x="510.7" y="153.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">The RouteID/Route Name is required, the measures are optional.</text><text x="510.7" y="175.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">The user can search for a single measure, multiple measures on the route or</text><text x="510.7" y="198.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">a range. New</text><text x="510.7" y="220.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Provide an intellisense experience for the RouteID/RouteName.</text><text x="510.7" y="243" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Allow wild card search (please use pro standard wildcards) New</text><text x="510.7" y="265.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Measures should be in whatever unit is configured for the LRS Network.</text><text x="510.7" y="287.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Measures can be in stationing format (0+00).</text><text x="510.7" y="310.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">If the route is invalid, provide a message that the route could not be</text><text x="510.7" y="332.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">found.</text><text x="510.7" y="355" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">If the measure(s) are invalid, provide a message that the measures could not</text><text x="510.7" y="377.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">be found on the route.</text><text x="510.7" y="399.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">Mark the required parameters with an *. New</text><text x="510.7" y="422.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">If there are multiple networks allow the user to change the network using</text><text x="510.7" y="444.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">the pencil button.</text><text x="510.7" y="467" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">If there are multiple methods allow the user to change the method using the</text><text x="510.7" y="489.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#0070C0">pencil button.</text></svg>