<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-666.3 4.7 2095 952.2" width="2095" height="952.2" data-slide="6" data-shapes="8" data-connectors="0"><title>Slide 6 drawing — 8 shapes</title><rect x="-666.3" y="4.7" width="2095" height="952.2" fill="#FFFFFF"/><text x="37.7" y="43.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Fourth pane verification 2</text><text x="37.7" y="69.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Merge coincident events: Adjoining events having the same</text><text x="37.7" y="94.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">attribute value for the selected field will be merged</text><text x="37.7" y="120.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">when calculating the output.</text><text x="37.7" y="146.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Do not show this if chosen layer is point event,</text><text x="37.7" y="171.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">centerline, or intersection</text><text x="37.7" y="197.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Users can configure filter expression for each log layer</text><text x="37.7" y="222.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">e.g. only speed limit records that are 65+ are included</text><text x="37.7" y="248.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">for highway log reports</text><text x="37.7" y="274.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Verify preview updates accordingly</text><text x="37.7" y="299.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">When a log field is added, then add a column for that</text><text x="37.7" y="325.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">field in the “Log Fields” section of the output. This</text><text x="37.7" y="350.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">column/field will identify the field value of that</text><text x="37.7" y="376.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">feature at that measure.</text><text x="37.7" y="402.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">When an LRS intersection layer is added, then add a</text><text x="37.7" y="427.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">column “Intersection” that contains the intersection name</text><text x="37.7" y="453.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">e.g. “Route1, Route2” --- even works for self</text><text x="37.7" y="478.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">intersection “Description: Intersecting RouteA”</text><text x="37.7" y="504.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">“Intersection RouteA, RouteA” and start/end intersections</text><text x="37.7" y="530.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">“Description: Intersecting RouteA” “Intersection RouteA”</text><rect x="63.2" y="645.6" width="543.2" height="295.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-09-slide-06-6.png" x="63.2" y="645.6" width="543.2" height="295.3" preserveAspectRatio="none"/><text x="334.8" y="797.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="402.4" y="803" width="99.5" height="29.6" fill="none" stroke="#ED7D31" stroke-width="3" data-prst="rect"/><rect x="521.8" y="829.5" width="69.8" height="29.6" fill="none" stroke="#ED7D31" stroke-width="3" data-prst="rect"/><rect x="737.9" y="200.8" width="674.9" height="444.8" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-10-slide-06-6.png" x="737.9" y="200.8" width="674.9" height="444.8" preserveAspectRatio="none"/><text x="1075.3" y="427.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="1218.7" y="408.4" width="59.7" height="21.3" fill="none" stroke="#ED7D31" stroke-width="3" data-prst="rect"/><rect x="-650.3" y="554" width="243.7" height="22.1" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/><rect x="-406.6" y="554" width="243.7" height="22.3" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/><rect x="-650.3" y="628.6" width="243.7" height="22.3" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/><rect x="-446.9" y="629" width="243.7" height="22.3" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/></svg>