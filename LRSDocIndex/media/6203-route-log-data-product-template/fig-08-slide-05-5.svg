<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-386.8 -18 1744.7 959.1" width="1744.7" height="959.1" data-slide="5" data-shapes="1" data-connectors="4"><title>Slide 5 drawing — 1 shape, 4 connectors</title><defs><marker id="ah-4472C4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4472C4"/></marker></defs><rect x="-386.8" y="-18" width="1744.7" height="959.1" fill="#FFFFFF"/><text x="37.5" y="21" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Fourth pane verification 1</text><text x="37.5" y="46.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Verify pane description</text><text x="37.5" y="72.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Pane is empty by default. Use Add to add log layers and</text><text x="37.5" y="97.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">fields. After Add</text><text x="37.5" y="123.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Prefix and Suffix are empty by default except “Begin “</text><text x="37.5" y="149" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">and/or “End “ (only line events have begin and end</text><text x="37.5" y="174.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">fields)</text><text x="37.5" y="200.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Notice there is a space</text><text x="37.5" y="225.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Verify only Point and Line events, and intersections</text><text x="37.5" y="251.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">registered to the selected network are shown in Layer</text><text x="37.5" y="277" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">dropdown</text><text x="37.5" y="302.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Allow only one field per layer in the template</text><text x="37.5" y="328.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Support Centerlines only when CL is configured for the</text><text x="37.5" y="353.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">ADM or UN versions of the LRS. CL also gets begin and end</text><text x="37.5" y="379.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">fields like a line event</text><text x="37.5" y="405" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">After choosing a layer and a field, Field Name in Table</text><text x="37.5" y="430.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">is automatically the same value from “Field”. Users can</text><text x="37.5" y="456.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">edit this value</text><text x="37.5" y="481.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Field Name in Table cannot be the same value as other</text><text x="37.5" y="507.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">layers</text><text x="37.5" y="533" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Preview reflects the change</text><text x="37.5" y="558.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Informative Text fields are editable</text><text x="37.5" y="584.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Users can configure multiple Log layers by keeping</text><text x="37.5" y="609.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">clicking Add</text><text x="37.5" y="635.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Do not allow adding the same layer twice</text><text x="37.5" y="661" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">To delete a Log layer, highlight it in table and click</text><text x="37.5" y="686.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Delete</text><text x="37.5" y="712.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">To edit a Log layer, highlight it in table and change</text><text x="37.5" y="737.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">fields</text><text x="37.5" y="763.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">If Layer is changed, clear Field and Field Name.</text><text x="37.5" y="789" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Show/hide/Reset begin/end text fields to “Begin“ and</text><text x="37.5" y="814.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">“End“ based on point/line event. Clear prefix/suffix</text><text x="37.5" y="840.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">If Field is changed, automatically update Field Name in</text><text x="37.5" y="865.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Table. Reset begin/end text fields to “Begin“ and “End“</text><text x="37.5" y="891.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">if it’s a line event. Clear prefix/suffix</text><rect x="-370.8" y="118.3" width="321.6" height="740.8" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-05-slide-05-5.png" x="-370.8" y="118.3" width="321.6" height="740.8" preserveAspectRatio="none"/><text x="-210" y="492.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="739.5" y="61.1" width="602.4" height="811.1" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-06-slide-05-5.png" x="739.5" y="61.1" width="602.4" height="811.1" preserveAspectRatio="none"/><text x="1040.7" y="470.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="763.2" y="582.4" width="306.7" height="223" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-07-slide-05-5.png" x="763.2" y="582.4" width="306.7" height="223" preserveAspectRatio="none"/><text x="916.6" y="698" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 1136.8 506.3 L 894.4 694.2" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/><path d="M 1119.9 549.1 L 887.6 758.2" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/><path d="M 1126.7 600.2 L 910.4 710.2" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/><path d="M 1136.8 633.6 L 894.4 736.9" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/></svg>