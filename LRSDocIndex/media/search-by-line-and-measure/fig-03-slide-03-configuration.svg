<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="16.4 6.3 1264.6 712.7" width="1264.6" height="712.7" data-slide="3" data-shapes="7" data-connectors="0"><title>Slide 3 drawing — 7 shapes</title><rect x="16.4" y="6.3" width="1264.6" height="712.7" fill="#FFFFFF"/><rect x="506.4" y="527.9" width="178" height="175.2" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-01-slide-03-configuration.png" x="506.4" y="527.9" width="178" height="175.2" preserveAspectRatio="none"/><text x="595.4" y="619.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="32.4" y="22.3" width="313.5" height="624.5" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-03-configuration.png" x="32.4" y="22.3" width="313.5" height="624.5" preserveAspectRatio="none"/><text x="189.1" y="338.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="738" y="542.7" width="160.5" height="89" fill="#E48312" stroke="#221403" stroke-width="1" data-prst="borderCallout1"/><text x="818.2" y="550.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">If Sort Field is set</text><text x="818.2" y="566.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">to</text><text x="818.2" y="582.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">LineID/Name/Order,</text><text x="818.2" y="598.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">make sure results</text><text x="818.2" y="614.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">are ranked by this</text><text x="818.2" y="630.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">line field.</text><text x="625.2" y="212.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Verify if the network is line network, “Line and Measure” is added to</text><text x="625.2" y="233.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Search methods; and Line Default dropdown is added to Identifier. If</text><text x="625.2" y="254.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">the network is non-Line network, these options are not added</text><text x="625.2" y="275.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Verify the Line and Measure toggle works as expected</text><text x="625.2" y="296.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Verify Line Default shows Line ID and Line Name as options (if network</text><text x="625.2" y="316.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">is PoM, there is only Line ID)</text><text x="625.2" y="337.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Verify when using Line and Measure to search, result table has line</text><text x="625.2" y="358.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">information (Line ID/Name/ID)</text><text x="625.2" y="379.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">When Sort Field is set to LineID/Name/ID, verify results are ranked by</text><text x="625.2" y="400.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">these fields.</text><text x="302.6" y="341.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#0070C0">Ne</text><text x="302.6" y="370.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#0070C0">w</text><text x="299.2" y="124.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#0070C0">Ne</text><text x="299.2" y="153.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#0070C0">w</text><rect x="331.4" y="108.9" width="160.5" height="89" fill="#E48312" stroke="#221403" stroke-width="1" data-prst="borderCallout1"/><text x="411.6" y="132.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">If network is a line</text><text x="411.6" y="148.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">network, add “Line</text><text x="411.6" y="164.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">and Measure” and a</text><text x="411.6" y="180.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">toggle button</text><rect x="342.4" y="323.1" width="254.3" height="199.1" fill="#E48312" stroke="#221403" stroke-width="1" data-prst="borderCallout1"/><text x="469.5" y="337.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">If network is a line network, add</text><text x="469.5" y="353.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">another set (title: Line Default;</text><text x="469.5" y="369.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">dropdown: Line ID/Line Name;</text><text x="469.5" y="385.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">tooltip)</text><text x="469.5" y="401.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">In published view, when method is</text><text x="469.5" y="417.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">search by line and measure, use</text><text x="469.5" y="433.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">this Line Default (and/or Default</text><text x="469.5" y="449.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">as Route is optional).</text><text x="469.5" y="465.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">Provide option to turn off Route</text><text x="469.5" y="481.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">search, so Route box is hidden</text><text x="469.5" y="497.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">If method is not line, use</text><text x="469.5" y="513.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">Default as it does today.</text><rect x="331.4" y="535.5" width="160.5" height="89" fill="#E48312" stroke="#221403" stroke-width="1" data-prst="borderCallout1"/><text x="411.6" y="535.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">Currently,</text><text x="411.6" y="551.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">LineID/LineName can</text><text x="411.6" y="567.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">be added as a Sort</text><text x="411.6" y="583.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">Field. But searched</text><text x="411.6" y="599.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">result does not</text><text x="411.6" y="615.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">contain Line</text><text x="411.6" y="631.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">information.</text></svg>