<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="5" data-shapes="5" data-connectors="1"><title>Slide 5 drawing — 5 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="656.1" y="161.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">If Route is searched along with Line, use Route identifier to</text><text x="656.1" y="182.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">refine searched results.</text><text x="656.1" y="202.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Implement intellisense and wildcard options in Route Identifier</text><text x="656.1" y="223.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">field</text><text x="656.1" y="244.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Do pane transitions and results labeling and honor time and</text><text x="656.1" y="265.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">version as what we do today</text><text x="656.1" y="285.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">When the user clicks search, do the following:</text><text x="656.1" y="306.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Find the route(s)</text><text x="656.1" y="327.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Transition the widget to a results pane that shows the route(s)</text><text x="656.1" y="347.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">that are returned by the search.</text><text x="656.1" y="368.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Show results in expanded form if the option is set in the</text><text x="656.1" y="389.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">configuration.</text><text x="656.1" y="410.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">When a record is selected from the results:</text><text x="656.1" y="430.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Zoom to that route on the map</text><text x="656.1" y="451.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Highlight the route</text><text x="656.1" y="472.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Display route label (as per cartographic standards, for example</text><text x="656.1" y="493" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">do not place overlapping labels)</text><text x="656.1" y="513.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Search results should honor the time filter</text><text x="656.1" y="534.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#808080">Search results should honor the version</text><rect x="67.5" y="155.1" width="574.5" height="383.2" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-07-slide-05-search-by-line.png" x="67.5" y="155.1" width="574.5" height="383.2" preserveAspectRatio="none"/><text x="354.8" y="350.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>