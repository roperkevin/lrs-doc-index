<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="4" data-shapes="6" data-connectors="1"><title>Slide 4 drawing — 6 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><rect x="66.7" y="48" width="572.3" height="399.2" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-04-slide-04-search-by-line.png" x="66.7" y="48" width="572.3" height="399.2" preserveAspectRatio="none"/><text x="352.9" y="251.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="656.1" y="161.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">If no line network exists or line network has Line and Measure</text><text x="656.1" y="182.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">turned off in configuration, Line and Measure does not appear</text><text x="656.1" y="202.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">in Method</text><text x="656.1" y="223.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">If there is only 1 line network configured with Line and</text><text x="656.1" y="244.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Measure option, after choosing Line and Measure for the method,</text><text x="656.1" y="265.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">pencil button does not show for Network</text><text x="656.1" y="285.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Line Identifier is required. Route Identifier and Measure are</text><text x="656.1" y="306.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">optional.</text><text x="656.1" y="327.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Verify when Hide route search is turned on, there is no Route</text><text x="656.1" y="347.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Name/ID box in UI</text><text x="656.1" y="368.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">If nothing is populated, search returns all routes – just like</text><text x="656.1" y="389.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">what Search by Route does</text><text x="656.1" y="410.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">If only Line Identifier field is populated, return all routes</text><text x="656.1" y="430.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">on the line</text><text x="656.1" y="451.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Implement intellisense and wildcard options in Line Identifier</text><text x="656.1" y="472.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">field</text><text x="656.1" y="493" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Verify the hidden elements (e.g. hide method; hide network) and</text><text x="656.1" y="513.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">alias are honored</text><text x="656.1" y="534.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Searched result should contain line information (Line ID; Line</text><text x="656.1" y="555.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Name; Line Order)</text><rect x="73.7" y="441.9" width="190.7" height="262.8" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-05-slide-04-search-by-line.png" x="73.7" y="441.9" width="190.7" height="262.8" preserveAspectRatio="none"/><text x="169.1" y="577.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="338.2" y="456.6" width="148.4" height="92.1" fill="#E48312" stroke="#221403" stroke-width="1" data-prst="borderCallout1"/><text x="412.4" y="482" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">Option to turn off</text><text x="412.4" y="498" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">route search is</text><text x="412.4" y="514" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">checked, so Route</text><text x="412.4" y="530" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#FFFFFF">box is hidden</text></svg>