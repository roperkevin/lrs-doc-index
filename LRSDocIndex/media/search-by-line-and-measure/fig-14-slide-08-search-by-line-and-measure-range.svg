<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="8" data-shapes="9" data-connectors="3"><title>Slide 8 drawing — 9 shapes, 3 connectors</title><defs><marker id="ah-E48312" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#E48312"/></marker></defs><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="586.6" y="162.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Return all the possible combination of routes that have</text><text x="586.6" y="185" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">either/both these measures (example next slide)</text><text x="586.6" y="207.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">For a single route that has the range, return everything like in</text><text x="586.6" y="229.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Search by Route plus Line information. The title is the route</text><text x="586.6" y="252.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">For a range that involves 2 routes, return From Route, To Route,</text><text x="586.6" y="274.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">and Line information. The title is “FromR – ToR”</text><text x="586.6" y="297" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">If only From or To is populated, treat as searching a single</text><text x="586.6" y="319.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">measure</text><text x="586.6" y="341.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">If Route is searched along with Line, use Route identifier to</text><text x="586.6" y="364.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">refine searched results</text><text x="586.6" y="386.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Do pane transitions and results labeling and honor time and</text><text x="586.6" y="409" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">version as what we do today. When there are too many results,</text><text x="586.6" y="431.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">labels can overlap.</text><text x="586.6" y="476.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Do we want to filter out results involving 2 routes but routes</text><text x="586.6" y="498.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">have non-overlapping time?</text><rect x="19.1" y="68.4" width="551.5" height="544.1" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-13-slide-08-search-by-line-and-measure-range.png" x="19.1" y="68.4" width="551.5" height="544.1" preserveAspectRatio="none"/><text x="294.8" y="344.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="307.4" y="223.1" width="248.3" height="40.5" rx="6.7" fill="none" stroke="#FFC000" stroke-width="1" data-prst="roundRect"/><rect x="307.4" y="340.4" width="248.3" height="23.3" rx="3.9" fill="none" stroke="#FFC000" stroke-width="1" data-prst="roundRect"/><rect x="307.4" y="453.2" width="248.3" height="16.5" rx="2.7" fill="none" stroke="#FFC000" stroke-width="1" data-prst="roundRect"/><rect x="167.5" y="570.1" width="139.8" height="119.4" fill="#E48312" stroke="#221403" stroke-width="1" data-prst="borderCallout1"/><text x="237.4" y="607" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Row Names</text><text x="237.4" y="635.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">can be</text><text x="237.4" y="664.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">flexible</text><path d="M 938.4 263.5 L 367.1 127.1" fill="none" stroke="#E48312" stroke-width="1" marker-end="url(#ah-E48312)"/><path d="M 872.5 324.7 L 411.3 295.5" fill="none" stroke="#E48312" stroke-width="1" marker-end="url(#ah-E48312)"/></svg>