<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="2.6 -18.5 1295 804.1" width="1295" height="804.1" data-slide="3" data-shapes="4" data-connectors="2"><title>Slide 3 drawing — 4 shapes, 2 connectors</title><defs><marker id="ah-4472C4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4472C4"/></marker></defs><rect x="2.6" y="-18.5" width="1295" height="804.1" fill="#FFFFFF"/><text x="28.2" y="94.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Add a tool-tip in a hover format to each Reassign method (5 methods in total)</text><text x="28.2" y="120.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Add an icon to each method in the dropdown that links to the corresponding method</text><text x="28.2" y="146" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">section in documentation</text><text x="28.2" y="171.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">When cursor is placed on the method in the dropdown, text and graphics are shown in</text><text x="28.2" y="197.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">the hover of the method</text><text x="28.2" y="222.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">text lists and briefly explains scenarios can be achieved (any from</text><text x="28.2" y="248.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">merge/split/rename/transfer): e.g. what portion of source route(s) are retired; what</text><text x="28.2" y="274" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">does target route(s) look like; for the new method, original Rid/name can maintain or</text><text x="28.2" y="299.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">not</text><text x="28.2" y="325.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Dev and PE decide the text and graphics</text><text x="28.2" y="350.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Graphics - optional: Dev checks if graphics are allowed in this tool-tip. If so,</text><text x="28.2" y="376.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">provide one or many graphics that help explain the scenario(s).</text><text x="28.2" y="581.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">When cursor is placed on the method name outside of the dropdown, hover box does not</text><text x="28.2" y="606.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">show (?)</text><text x="28.2" y="709.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Pro window size does not affect hover visibility</text><text x="28.2" y="734.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Refer to explore tooltip and the Raster Layer dropdown in Weighted Sum Properties</text><rect x="290.6" y="548.2" width="286" height="62" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-01-slide-03-reassign-method-hovers.png" x="290.6" y="548.2" width="286" height="62" preserveAspectRatio="none"/><text x="433.6" y="583.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><text x="624.1" y="353.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">(an example)</text><rect x="798.8" y="551.7" width="181.7" height="217.9" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-03-reassign-method-hovers.png" x="798.8" y="551.7" width="181.7" height="217.9" preserveAspectRatio="none"/><text x="889.7" y="664.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 1225.6 55.1 L 1228 55.1 L 1229.2 57.5 L 1228 59.9 L 1225.6 59.9 L 1224.4 57.5 Z" fill="#4472C4" stroke="#223962" stroke-width="1" data-prst="hexagon"/><path d="M 1225.4 69.1 L 1227.8 69.1 L 1229 71.5 L 1227.8 73.9 L 1225.4 73.9 L 1224.2 71.5 Z" fill="#4472C4" stroke="#223962" stroke-width="1" data-prst="hexagon"/><rect x="376.1" y="324.5" width="218.7" height="193.8" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-03-reassign-method-hovers.png" x="376.1" y="324.5" width="218.7" height="193.8" preserveAspectRatio="none"/><text x="485.4" y="425.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="557" y="352.7" width="9.6" height="9.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-04-slide-03-reassign-method-hovers.png" x="557" y="352.7" width="9.6" height="9.6" preserveAspectRatio="none"/><text x="561.8" y="361.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="557" y="363.5" width="9.6" height="9.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-04-slide-03-reassign-method-hovers.png" x="557" y="363.5" width="9.6" height="9.6" preserveAspectRatio="none"/><text x="561.8" y="372.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="557" y="374.2" width="9.6" height="9.6" fill="#