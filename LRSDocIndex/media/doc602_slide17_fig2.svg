<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.4 309.8" width="585.4" height="309.8" role="img" aria-label="Slide 17 diagram (2 of 3)"><title>Slide 17 diagram (2 of 3)</title><desc>Diagram drawn from the slide's own shapes: 3 nodes (Same Event ID, New Event ID, Event is added to the existing time-slice), 3 connectors.</desc><style>.plate{fill:#FFFFFF;stroke:#D7DFDF;stroke-width:1}.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.route{stroke:#16302F;stroke-width:3;stroke-dasharray:10 6;stroke-linecap:butt}.ctx{stroke:#B9C6C6;stroke-width:2.4}.event{stroke-width:8}.flat{stroke-linecap:butt}.tick{stroke:#6E8285;stroke-width:1.15}.maj{stroke:#4E6265;stroke-width:1.4}.leader{stroke:#6E8285;stroke-width:1}.split{stroke:#16302F;stroke-width:1.4;stroke-dasharray:3 2.5;opacity:.55}.splitdot{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.edge{stroke:#4E6265;stroke-width:1.8}.free{stroke-width:2.2}.freefill{stroke-width:2.2;stroke-linejoin:round}.dashed{stroke-dasharray:7 4.5}.dotted{stroke-dasharray:1.6 3.6}.node{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.t-plain{fill:#FFFFFF}.t-ink{fill:#E9EDED}.t-muted{fill:#EFF2F2}.t-cool{fill:#E5F0F5}.t-warm{fill:#F9F0E2}.t-green{fill:#E6F2EC}.t-violet{fill:#EFEAF7}.t-red{fill:#F8E9E5}.nlabel{font-size:12px;fill:#16302F;font-weight:500}.swatch{stroke-width:5}.legend{font-size:10.5px;fill:#4E6265}.s-ink{stroke:#16302F}.f-ink{fill:#16302F}.s-muted{stroke:#6E8285}.f-muted{fill:#6E8285}.s-cool{stroke:#1B6E8C}.f-cool{fill:#1B6E8C}.s-warm{stroke:#C2701A}.f-warm{fill:#9C5A12}.s-green{stroke:#2E7D5B}.f-green{fill:#2E7D5B}.s-violet{stroke:#7A5AA6}.f-violet{fill:#7A5AA6}.s-red{stroke:#B2442F}.f-red{fill:#B2442F}.event.s-cool,.swatch.s-cool{stroke:#4FA7D5}.event.s-warm,.swatch.s-warm{stroke:#E39A45}.event.s-green,.swatch.s-green{stroke:#4EB183}.event.s-violet,.swatch.s-violet{stroke:#A58BD3}.event.s-red,.swatch.s-red{stroke:#DC8168}.wf-panel{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.4}.wf-box{fill:none;stroke:#6E8285;stroke-width:1.1}.wf-field{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.1}.wf-btn{stroke-width:1.2}.wf-sep{stroke:#D7DFDF;stroke-width:1}.wf-gk{fill:#B9C6C6}.wf-gkh{fill:#4E6265}.wf-gkp{fill:#FFFFFF}.wf-ico{fill:#EFF2F2;stroke:#6E8285;stroke-width:1.1}.wf-tx{fill:#4E6265}.wf-txh{fill:#16302F;font-weight:600}.wf-txp{fill:#16302F;font-weight:500}text{font-family:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.measure{font-size:11px;fill:#6E8285;font-variant-numeric:tabular-nums}.id{font-size:12.5px;font-weight:600}.note{font-size:12px;fill:#16302F}</style><defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#16302F"/></marker><marker id="ae" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#4E6265"/></marker></defs><rect class="plate" x="1" y="1" width="583.4" height="307.8" rx="6"/><g transform="translate(-4,-440.5)"><line class="ln edge s-red" x1="120" y1="460.5" x2="106.5" y2="551.5" marker-end="url(#ae)"/><line class="ln edge s-red" x1="183.2" y1="483.6" x2="111.4" y2="641.9" marker-end="url(#ae)"/><line class="ln edge s-red" x1="264" y1="488.3" x2="397.4" y2="698" marker-end="url(#ae)"/><rect class="node t-plain s-ink" x="32" y="551.5" width="144" height="32.3" rx="7"/><text class="nlabel" x="104" y="567.7" text-anchor="middle" dominant-baseline="central">Same Event ID</text><rect class="node t-plain s-ink" x="32" y="641.9" width="144" height="32.3" rx="7"/><text class="nlabel" x="104" y="658" text-anchor="middle" dominant-baseline="central">New Event ID</text><rect class="node t-plain s-ink" x="246" y="698" width="323.4" height="32.3" rx="7"/><text class="nlabel" x="407.7" y="706.7" text-anchor="middle" dominant-baseline="central">Event is added to the</text><text class="nlabel" x="407.7" y="721.7" text-anchor="middle" dominant-baseline="central">existing time-slice<