<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-261.7 -16 1557.7 751.9" width="1557.7" height="751.9" data-slide="2" data-shapes="6" data-connectors="0"><title>Slide 2 drawing — 6 shapes</title><rect x="-261.7" y="-16" width="1557.7" height="751.9" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="719.9" fill="#4472C4" data-prst="rect"/><g transform="rotate(90 361.2 307.6)"><rect x="318.3" y="302.2" width="85.7" height="10.8" fill="#4472C4" data-prst="rect"/></g><rect x="-245.7" y="279.9" width="588.9" height="55.4" fill="#4472C4" data-prst="rect"/><rect x="60.8" y="96.9" width="1166.6" height="573.4" fill="#FFFFFF" data-prst="rect"/><text x="99.2" y="131.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="53.3" font-weight="bold" fill="#000000">User Story</text><text x="108.3" y="236.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">As an LRS editor, I want to add a global check in the LRS event editing</text><text x="108.3" y="268.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">tools to prevent editing the event , if there are any unprocessed records</text><text x="108.3" y="300.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">in the edit log table within a given version.</text><text x="108.3" y="364.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">Persona</text><text x="108.3" y="396.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">LRS Editor: This user is responsible for making edits to the LRS.</text><text x="108.3" y="428.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">In Pro, Currently in a version it is possible to edit the events with out</text><text x="108.3" y="460.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">running the AEB tool after a route edit. This may result in incorrect</text><text x="108.3" y="492.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">event creation. To prevent users from creating/updating events before</text><text x="108.3" y="524.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">event behaviors are applied, we need to add a check to prevent event</text><text x="108.3" y="556.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#24292F">editing if there are unprocessed edit log records.</text></svg>