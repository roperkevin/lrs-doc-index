<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-15.7 -16 1311.7 752" width="1311.7" height="752" data-slide="4" data-shapes="6" data-connectors="0"><title>Slide 4 drawing — 6 shapes</title><rect x="-15.7" y="-16" width="1311.7" height="752" fill="#FFFFFF"/><rect x="0.3" y="0" width="1279.7" height="720" fill="#4472C4" data-prst="rect"/><path d="M 1071.8 0 L 1190.9 0 L 1190.8 1.8 C 1185.1 29.4 1160.7 50.2 1131.4 50.2 C 1102.1 50.2 1077.6 29.4 1072 1.8 Z" fill="#FFC000"/><text x="98.7" y="53.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="53.3" font-weight="bold" fill="#000000">Things to consider in implementing this</text><text x="98.7" y="117.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="53.3" font-weight="bold" fill="#000000">check</text><g transform="rotate(90 272.7 443.6)"><ellipse cx="272.7" cy="443.6" rx="214.4" ry="214.4" fill="none" stroke="#FFC000" stroke-width="13.3" stroke-dasharray="53.333333333333336 40" data-prst="arc"/></g><text x="97.6" y="155.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Database Type</text><text x="120" y="139.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Can we provide an error message or warning message ? Which one makes more sense?</text><text x="120" y="165" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">How much can we narrow down this logic , so that we reduce the amount of unwanted</text><text x="120" y="190.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">restriction on the data?</text><text x="120" y="216.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Are we going to implement based on edit log for individual routes?</text><text x="120" y="241.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If we implement based on edit logs for the routes – there may be an edit log for</text><text x="120" y="267.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">the route but the event the user planning to create/ edit may be in the upstream</text><text x="120" y="293" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">portion of the route which is not going to be affected by the route edit. Are we</text><text x="120" y="318.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">still going to stop the user from editing the event? Or can we consider the</text><text x="120" y="344.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">measure on the route also when planning to implement this check</text><text x="120" y="369.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">In the case of spanning events, if the starting route or ending route has</text><text x="120" y="395.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">unprocessed edit log, prevent the user from creating /modifying the event. Does</text><text x="120" y="421" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">the unprocessed edit log of in between routes matter?. If so, how it can be</text><text x="120" y="446.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">handled?</text><text x="120" y="472.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Routes with time slices - Route R1 1/1/2000 – 12/31/2010 – edit log is processed</text><text x="120" y="497.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">and 12/31/2010 – Null edit log is unprocessed. Should not the restrict the user on</text><text x="120" y="523.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">the edit log processed time slice. Is this correct?</text></svg>