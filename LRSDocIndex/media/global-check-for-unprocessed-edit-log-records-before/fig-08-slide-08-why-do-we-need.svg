<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 751.9" width="1312" height="751.9" data-slide="8" data-shapes="5" data-connectors="0"><title>Slide 8 drawing — 5 shapes</title><rect x="-16" y="-16" width="1312" height="751.9" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="719.9" fill="#4472C4" data-prst="rect"/><rect x="0" y="209.9" width="1202.6" height="82.1" fill="#FFC000" data-prst="rect"/><rect x="0" y="231.3" width="1195.1" height="448.1" fill="#FFFFFF" data-prst="rect"/><g transform="rotate(90 1219.8 250.8)"><rect x="1178.8" y="242.8" width="82.1" height="16" fill="#FFC000" data-prst="rect"/></g><text x="92.9" y="26.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">Why do we need?</text><text x="92.9" y="51.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">As we have now event editing capabilities in Pro there is a chance for the users to create</text><text x="92.9" y="76.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">route and add events without running AEB in the same session which may create some unwanted</text><text x="92.9" y="101.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">results. To eliminate that we may need to add this check.</text><text x="92.9" y="126.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">Will it be captured when the users runs through REST?</text><text x="92.9" y="151.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">Yes it can be done because the check is going to happen at dataset level so it can be done</text><text x="92.9" y="201.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">This check is needed only when a user working in a same version.</text><text x="92.9" y="226.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">Edit logs are versioned and route edits in a saved version with AEB cannot be posted into</text><text x="92.9" y="251.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">default with applying AEB.</text><text x="92.9" y="276.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">When a user tries to post a version with route edits and no AEB run it stops the user from</text><text x="92.9" y="301.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#000000">posting the version</text></svg>