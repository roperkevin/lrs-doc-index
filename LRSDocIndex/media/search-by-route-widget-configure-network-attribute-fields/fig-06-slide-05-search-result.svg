<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="5" data-shapes="5" data-connectors="1"><title>Slide 5 drawing — 5 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="656.1" y="162.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">After setting up displayed fields, the route table in</text><text x="656.1" y="185" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">search result should honor configuration</text><text x="656.1" y="207.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">Field display does not affect search logic</text><text x="656.1" y="229.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">E.g. Measure field is hidden but user searches for a</text><text x="656.1" y="252.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">measure. We should still point to and label that location</text><text x="656.1" y="274.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">on the route, despite not showing Measure in table</text><text x="656.1" y="297" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">E.g. Route ID field is hidden but it’s configured as a</text><text x="656.1" y="319.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">sort field. We should still sort routes by Route ID,</text><text x="656.1" y="341.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">despite not showing Route ID field in table</text><text x="656.1" y="364.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">When all fields are hidden, the search result is a list of</text><text x="656.1" y="386.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">routes without route caret</text><text x="656.1" y="409" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">When fields are hidden, using data action to populate</text><text x="656.1" y="431.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#404040">other widgets should still work</text><rect x="49.3" y="106.4" width="576.2" height="475.9" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-05-slide-05-search-result.png" x="49.3" y="106.4" width="576.2" height="475.9" preserveAspectRatio="none"/><text x="337.4" y="348.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>