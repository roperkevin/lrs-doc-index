<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="4" data-shapes="5" data-connectors="1"><title>Slide 4 drawing — 5 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><rect x="67.5" y="72" width="572.3" height="542.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-04-configuration.png" x="67.5" y="72" width="572.3" height="542.3" preserveAspectRatio="none"/><text x="353.7" y="347.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="673.1" y="198.6" width="572.3" height="32.3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" data-prst="rect"/><text x="673.1" y="169.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Add a section “Advance field display” after result sorting</text><text x="673.1" y="190.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Add the ability to show nonLRS fields in search result</text><text x="673.1" y="210.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">All fields are configurable to show/hide</text><text x="673.1" y="231" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Advance field display is off by default. In this case, show</text><text x="673.1" y="251.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">fields in search result as we do today</text><text x="673.1" y="271.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">When turned on, 2 lists appear below. The fields that are</text><text x="673.1" y="292.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">shown by default are checked (e.g. LRS fields), and vice</text><text x="673.1" y="312.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">versa. User can further check or uncheck any field</text><text x="673.1" y="333" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Network fields are fields that are actually in network</text><text x="673.1" y="353.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">feature class. Except editor tracking and system fields</text><text x="673.1" y="373.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Additional fields are not directly in network feature class,</text><text x="673.1" y="394.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">e.g. measures and derived network fields</text><text x="673.1" y="414.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">If derived network is not in webmap or is removed from</text><text x="673.1" y="435" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Search widget, the checkboxes do not show</text><text x="673.1" y="455.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Allow users to uncheck all fields</text><text x="673.1" y="475.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Verify after checking and unchecking some fields, turning</text><text x="673.1" y="496.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Advance field display off will still show default fields.</text><text x="673.1" y="516.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">Then, the last selection is remembered when turning Advance</text><text x="673.1" y="537" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17" fill="#404040">field display back on</text></svg>