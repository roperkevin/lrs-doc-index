<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-40 7.7 776 939.5" width="776" height="939.5" data-slide="3" data-shapes="7" data-connectors="0"><title>Slide 3 drawing — 7 shapes</title><rect x="-40" y="7.7" width="776" height="939.5" fill="#FFFFFF"/><rect x="0" y="447.9" width="504" height="32.1" fill="#031641" data-prst="rect"/><text x="252" y="469.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Effective date</text><text x="-8.4" y="505.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Today’s date</text><text x="-8.4" y="521.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Past date</text><text x="-8.4" y="537.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Future date</text><text x="-8.4" y="553.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">No routes exist on the selected date: Empty output is generated with a warning</text><text x="-8.4" y="569.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">PY: Incorrect date format. Show error message.</text><text x="-8.4" y="585.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Test with a route that does not have a 00:00:00 timestamp and check if there is a difference in the</text><text x="-8.4" y="601.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">output</text><text x="45.6" y="714" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Verify there is a progress bar at the bottom of tool pane and it shows the progress</text><text x="45.6" y="730" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Clicking cancel will actually cancel the tool</text><text x="45.6" y="746" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">PY: Inline and Standalone</text><text x="45.6" y="762" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Modelbuilder chained</text><text x="45.6" y="778" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Test with single and multiple routes</text><text x="45.6" y="794" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Run the tool with the same input layers and filters provided in the Generate LRS data product</text><text x="45.6" y="810" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">supporting the route log user story. Compare the outputs. Only the description should be</text><text x="45.6" y="826" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">different. There are 2 test plans.</text><rect x="0" y="283.1" width="504" height="32.1" fill="#031641" data-prst="rect"/><text x="252" y="305.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Output file</text><text x="-8.4" y="334.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">CSV: Both Pro and PY</text><text x="-8.4" y="350.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Database table: Both Pro and PY</text><text x="-8.4" y="366.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">PY: Provide name of an existing file. Show error message.</text><text x="-8.4" y="382.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">PY: Provide an invalid name. Show error message.</text><text x="-8.4" y="398.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Test if CSV can be overwritten when using the PY version.</text><text x="-14.4" y="39.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">No routes selected: Data product created for all the routes in the network that are valid for the</text><text x="-14.4" y="55.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">selected date.</text><text x="-14.4" y="71.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Routes selected: Data product created for the selected routes in the network that are valid for the</text><text x="-14.4" y="87.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">selected date.</text><text x="-14.4" y="103.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Routes selected in a line network: Data product created for the all the routes in the line to which</text><text x="-14.4" y="119.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">the selected route belongs to that are valid for the selected date.</text><text x="-14.4" y="135.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Definition queries are respected</text><text x="-14.4" y="151.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Non network FC as input: Show error message</text><text x="-14.4" y="167.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">PY: Provide a file name that does not exist. Show error message</text><text x="-14.4" y="183.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Route Identifier field in the output:</text><text x="-14.4" y="199.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Route ID for Non-Line network.</text><text x="-14.4" y="215.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Route name and Line Name for Line network.</text><rect x="0" y="660.9" width="720" height="32.1" fill="#031641" data-prst="rect"/><text x="360" y="683" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Miscellaneous</text><rect x="504" y="104.3" width="192" height="362.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-01-slide-02-2.png" x="504" y="104.3" width="192" height="362.6" preserveAspectRatio="none"/><text x="600" y="289.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>