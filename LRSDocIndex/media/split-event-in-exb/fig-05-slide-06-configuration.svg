<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="6" data-shapes="5" data-connectors="0"><title>Slide 6 drawing — 5 shapes</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="720" fill="#83992A" data-prst="rect"/><rect x="50.9" y="50.9" width="1178.2" height="155.3" fill="#373737" data-prst="rect"/><rect x="68.3" y="68.1" width="1143.4" height="121" fill="none" stroke="#83992A" stroke-width="1.7" data-prst="rect"/><rect x="0" y="240" width="1280" height="480" fill="#FFFFFF" data-prst="rect"/><text x="27.2" y="262.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Display the layer configuration after a layer is selected.</text><text x="27.2" y="314.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should be able to change the label in the layer configuration.</text><text x="27.2" y="365.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should be able to configure the attribute fields for each event layer to display/edit when splitting the</text><text x="27.2" y="390.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">event.</text><text x="27.2" y="442.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">For configure fields show only business fields to display and edit, LRS fields and System fields should</text><text x="27.2" y="467.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">not be shown in the configuration.</text><text x="27.2" y="518.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If needed user should be able to select \ unselect the fields to show.</text><text x="27.2" y="570.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If needed user should be able to enable \ disable the fields to edit.</text><text x="27.2" y="621.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should be able to reorder the fields in the section of configure fields.</text><text x="27.2" y="672.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">By default, enable ‘Use field alias’ for the fields</text><text x="27.2" y="723.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should be able to add filed description using settings button for the field.</text></svg>