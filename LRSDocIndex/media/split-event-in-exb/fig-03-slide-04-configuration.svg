<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="4" data-shapes="5" data-connectors="0"><title>Slide 4 drawing — 5 shapes</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="720" fill="#83992A" data-prst="rect"/><rect x="50.9" y="50.9" width="1178.2" height="155.3" fill="#373737" data-prst="rect"/><rect x="68.3" y="68.1" width="1143.4" height="121" fill="none" stroke="#83992A" stroke-width="1.7" data-prst="rect"/><rect x="0" y="240" width="1280" height="480" fill="#FFFFFF" data-prst="rect"/><text x="9.6" y="275.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If there is no LRS enabled service in the webmap, don’t show any event layers and provide a message that no LRS</text><text x="9.6" y="301.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">enabled service is present.</text><text x="9.6" y="352.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should be able to import all the line event and network layers from the map using the Load Layers button.</text><text x="9.6" y="403.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should be able to add any missing layer using the ‘New editable Layer’ option.</text><text x="9.6" y="455.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should be able to reorder the imported layers.</text><text x="9.6" y="506.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should be able to remove any layer using x button next to the respective layer.</text><text x="9.6" y="557.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Allow only importing from a single map (if another map is chosen then clear the present layers before importing</text><text x="9.6" y="583.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">layers from different map).</text><text x="9.6" y="634.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Provide an error message if there are no Line event layers in the list after importing.</text><text x="9.6" y="685.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Provide an error message if the network is not imported for the events (registered network for the events).</text><text x="9.6" y="736.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Provide a message if the map has layers from more than one service.</text></svg>