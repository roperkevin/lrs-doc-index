<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="7" data-shapes="6" data-connectors="0"><title>Slide 7 drawing — 6 shapes</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="720" fill="#83992A" data-prst="rect"/><rect x="49.8" y="49.3" width="387.9" height="621.3" fill="#373737" data-prst="rect"/><rect x="67.2" y="66.7" width="353.3" height="586.6" fill="none" stroke="#83992A" stroke-width="1.7" data-prst="rect"/><rect x="488.6" y="0" width="791.4" height="720" fill="#FFFFFF" data-prst="rect"/><rect x="89.3" y="68.6" width="313.3" height="582.9" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-06-slide-07-split-event.png" x="89.3" y="68.6" width="313.3" height="582.9" preserveAspectRatio="none"/><text x="246" y="364" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><text x="714.8" y="58" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" font-weight="bold" fill="#262626">Split Event</text><text x="513.1" y="98.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Add a widget called Split Event.</text><text x="513.1" y="124.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Once clicked, the Split Events tool should open in the Experience</text><text x="513.1" y="150" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">builder app.</text><text x="513.1" y="175.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">The event layer drop down should include all the LRS line events</text><text x="513.1" y="201.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">within the map.</text><text x="513.1" y="226.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Once an event layer is selected, populate the units for the measure</text><text x="513.1" y="252.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">label as per the network m units.</text><text x="513.1" y="278" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">If the event selected is part of an LRS Network with Route Name</text><text x="513.1" y="303.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">configured and Route Name is configured for the event, show Route</text><text x="513.1" y="329.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Name in place of RouteID.</text><text x="513.1" y="354.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Allow the user to type the RouteID/Name or use the route picker to</text><text x="513.1" y="380.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">select the location</text><text x="513.1" y="406" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Allow the user to type the measure or use the picker to select the</text><text x="513.1" y="431.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">location</text><text x="513.1" y="457.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Once the user clicks a location, verify there is an event from the</text><text x="513.1" y="482.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">event layer at that location and populate the routeID/route name,</text><text x="513.1" y="508.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">the measure, and the OID of the event at that location</text><text x="513.1" y="534" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Flash the route three times once selected and provide a marker on</text><text x="513.1" y="559.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">the map at the split location</text><text x="513.1" y="585.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">If there is more than one route (or more than one route time slice)</text><text x="513.1" y="610.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">at a location clicked on the map, show a picker with the</text><text x="513.1" y="636.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">RouteID/Name and Dates for the user to select</text><text x="513.1" y="662" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">If the user selects a location on the map with more than one measure</text><text x="513.1" y="687.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">(self intersection point, etc.), provide a picker for the user to</text><text x="513.1" y="713.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">choose which measure they want to split at</text></svg>