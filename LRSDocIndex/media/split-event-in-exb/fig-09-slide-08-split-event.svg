<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="8" data-shapes="5" data-connectors="0"><title>Slide 8 drawing — 5 shapes</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="720" fill="#83992A" data-prst="rect"/><rect x="49.8" y="49.3" width="387.9" height="621.3" fill="#373737" data-prst="rect"/><rect x="67.2" y="66.7" width="353.3" height="586.6" fill="none" stroke="#83992A" stroke-width="1.7" data-prst="rect"/><rect x="488.6" y="0" width="791.4" height="720" fill="#FFFFFF" data-prst="rect"/><text x="498.2" y="30.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Populate the Split Date with today’s date and populate the attributes</text><text x="498.2" y="55.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">for the event selected.</text><text x="498.2" y="81.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If user route start date is checked, populate the split date with</text><text x="498.2" y="107.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">route start date.</text><text x="498.2" y="132.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If more than one event exists at the split location, provide an error</text><text x="498.2" y="158.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">message to the user about more than one event being present at that</text><text x="498.2" y="183.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">location.</text><text x="498.2" y="209.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If the selected measure is at the start/endpoint of an event, give</text><text x="498.2" y="235.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">the user a message about the selected location being the start/end of</text><text x="498.2" y="260.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">an event and not being able to split.</text><text x="498.2" y="286.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If the user changes the date, utilize the date for the newly created</text><text x="498.2" y="311.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">events that result from the split.</text><text x="498.2" y="337.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If the date is changed to date outside the route date range, provide</text><text x="498.2" y="363.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">an error and alert the user that the dates are outside the route time</text><text x="498.2" y="388.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">range.</text><text x="498.2" y="414.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">In the attributes section, allow the user to change any of the non</text><text x="498.2" y="439.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">LRS attributes (Access Control and Derived From are examples in the</text><text x="498.2" y="465.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">graphics).</text><text x="498.2" y="491.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">When the user clicks Split, execute the split and flash on the map</text><text x="498.2" y="516.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">sequentially the two different features that now exist.</text><text x="498.2" y="542.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Once the split is complete, show a confirmation notification and</text><text x="498.2" y="567.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">clear out the UI other than the event layer being selected.</text><rect x="77.7" y="73.9" width="331.1" height="571.9" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-08-slide-08-split-event.png" x="77.7" y="73.9" width="331.1" height="571.9" preserveAspectRatio="none"/><text x="243.3" y="363.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>