<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1275.2 752" width="1275.2" height="752" data-slide="2" data-shapes="8" data-connectors="1"><title>Slide 2 drawing — 8 shapes, 1 connector</title><defs><marker id="ah-000000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#000000"/></marker></defs><rect x="-16" y="-16" width="1275.2" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="26.9" height="720" fill="#D3E171" data-prst="rect"/><rect x="26.9" y="0" width="11.5" height="720" fill="#0E7C86" data-prst="rect"/><text x="67.2" y="91.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1F3A5F">Overview &amp; User Story</text><text x="73.7" y="149" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">User Story</text><text x="73.7" y="173" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">As an event editor or LRS analyst, I need to view LRS attributes</text><text x="73.7" y="197" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">(Route ID(s), Measure(s), Dates, Event ID) followed by business</text><text x="73.7" y="221" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">attributes in the SLD hover tooltip using display names, so that I</text><text x="73.7" y="245" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">can quickly understand event context without opening additional</text><text x="73.7" y="269" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">dialogs.</text><text x="73.7" y="293" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">Workflow</text><text x="73.7" y="317" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">Hover over event → Tooltip shows LRS attributes first → Business</text><text x="73.7" y="341" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">attributes next → Continue analysis</text><text x="73.7" y="365" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F3A5F">Scope of Enhancement</text><text x="85" y="368.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Enhance the existing inline hover tooltip</text><text x="85" y="390.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">only (no change to click / double-click</text><text x="85" y="413.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">popup or highlight behavior)</text><text x="85" y="435.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">LRS attributes shown first: Route ID(s),</text><text x="85" y="458.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Measure(s), Dates, Event ID</text><text x="85" y="480.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Business (non-LRS) attributes shown after</text><text x="85" y="502.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">LRS attributes, using alias / display</text><text x="85" y="525.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">names</text><text x="85" y="547.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Exclude ObjectID, Shape, and Shape</text><text x="85" y="570.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Length, Editor Tracking Fields,</text><text x="85" y="592.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Validation Fields, and Referent Fields</text><text x="85" y="614.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Respect configured attribute sets</text><text x="85" y="637.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Truncate overflow to fit UI</text><text x="85" y="659.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#22303C">Maintain hover performance</text><text x="1082.4" y="157.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" font-weight="bold" fill="#FFFFFF">LEGEND</text><rect x="832.9" y="101.1" width="391.1" height="311.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-02-overview-and-user-story.png" x="832.9" y="101.1" width="391.1" height="311.3" preserveAspectRatio="none"/><text x="1028.5" y="260.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="501.8" y="483.2" width="731.4" height="187.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-02-overview-and-user-story.png" x="501.8" y="483.2" width="731.4" height="187.3" preserveAspectRatio="none"/><text x="867.5" y="580.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><text x="966.3" y="84.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">New Tooltip</text><text x="901.7" y="506.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">Old Tooltip</text><path d="M 1012.5 512.2 L 1050 560.8" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#ah-000000)"/></svg>