sans-serif" font-size="21.3" font-weight="bold" fill="#000000">APR4 - Simple routes and gapped routes in a line with</text><text x="9.6" y="55.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">overlapping point and line events. No location layer. 1</text><text x="9.6" y="81.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Referent layer. Routes and events have time slices (APR 6)</text><text x="9.6" y="106.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Log: a point event, an intersection, and spanning line events.</text><text x="9.6" y="132.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Change start/end texts for all. Do not configure any prefix or</text><text x="9.6" y="157.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">suffix. No filter expression. Merge coincident for one line</text><text x="9.6" y="183.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">event</text><text x="9.6" y="209.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Referent: nearest upstream, customize stand/end/prefix/suffix,</text><text x="9.6" y="234.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">in feet</text><text x="9.6" y="260.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Use RouteName</text><path d="M 266.5 405.4 L 433.6 405.4" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#ah-000000)"/><text x="57.6"