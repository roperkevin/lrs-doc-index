rst="borderCallout1"/><text x="376.2" y="553.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">20000</text><path d="M 435.2 598 L 602.4 598" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#ah-000000)"/><text x="46.3" y="506.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">2020-null</text><text x="255.3" y="622.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#767171">10000</text><text x="582.1" y="585.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#767171">10000</text><ellipse cx="162.8" cy="596.2" rx="14.4" ry="14.4" fill="#FFC000" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="162.5" cy="596.4" rx="7.2" ry="7.2" fill="#ED7D31" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><rect x="435.2" y="521.2" width="30.4" height="39" fill="#843C0B" stroke="#0A111D" stroke-width="1" data-prst="borderCallout1"/><text x="450.4" y="546.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">0</text><rect x="600.9" y="517.2" width="63.2" height="39" fill="#843C0B" stroke="#0A111D" stroke-width="1" data-prst="borderCallout1"/><text x="632.5" y="542.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">10000</text><ellipse cx="45.3" cy="702.8" rx="7.2" ry="7.2" fill="#ED7D31" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><ellipse cx="45.7" cy="738.5" rx="14.4" ry="14.4" fill="#FFC000" stroke="#0A111D" stroke-width="1" data-prst="ellipse"/><text x="74.3" y="744.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Leak</text><rect x="-650.3" y="554" width="243.7" height="22.1" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/><rect x="-406.6" y="554.3" width="243.7" height="22.3" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/><text x="-816.3" y="152.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">Coincident vs. overlapping events 2 DOTClass events that have</text><text x="-816.3" y="181.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">identical values in all the business fields, at the same location</text><text x="-816.3" y="210.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">same time - if one starts at the other's end point, they are</text><text x="-816.3" y="239" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">coincident. When the &quot;merge coincident events&quot; option is checked</text><text x="-816.3" y="267.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">in template, we only generate 1 start record and 1 end record,</text><text x="-816.3" y="296.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">instead of start 1 end1 start 2 end 2. However, if they have an</text><text x="-816.3" y="325.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">overlapping portion, even the &quot;merge coincident events&quot; option is</text><text x="-816.3" y="354.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">checked, they are treated as separate records, something like</text><text x="-816.3" y="383" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">start 1 start 2 end 1 end 2.</text><text x="-816.3" y="411.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">2 DOTClass events that have identical values in the log field but</text><text x="-816.3" y="440.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">different values in other business fields, at the same location</text><text x="-816.3" y="469.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">same time - same as above. In route log, as long as the</text><text x="-816.3" y="498.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">coincident events' log field matches, they merge as 1 record in</text><text x="-816.3" y="527" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">result.</text><text x="-816.3" y="555.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">2 DOTClass events that have different values in all the business</text><text x="-816.3" y="584.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">fields, at the same location same time - will not merge as all</text><text x="-816.3" y="613.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">values are different. If they overlap, generate records</text><text x="-816.3" y="642.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">separately.</text><rect x="-650.3" y="628.6" width="243.7" height="22.3" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/><rect x="-447.7" y="628.6" width="243.7" height="22.3" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/><rect x="32.5" y="768.8" width="66" height="19.4" fill="#2E75B6" stroke="#000000" stroke-width="1" data-prst="rect"/><text x="65.5" y="772.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Class</text><text x="65.5" y="792.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">1</text><text x="719.9" y="83.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">2000-2020</text><text x="719.9" y="514.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">2020-null</text><rect x="822.4" y="158.3" width="165.8" height="20.5" fill="none" stroke="#FF00FF" stroke-width="4" data-prst="rect"/><rect x="822.4" y="311" width="165.8" height="68.2" fill="none" stroke="#FF00FF" stroke-width="4" data-prst="rect"/><rect x="827.6" y="607" width="165.8" height="20.5" fill="none" stroke="#FF00FF" stroke-width="4" data-prst="rect"/><rect x="822.4" y="673.2" width="165.8" height="20.5" fill="none" stroke="#FF00FF" stroke-width="4" data-prst="rect"/><rect x="830.4" y="778" width="165.8" height="88.3" fill="none" stroke="#FF00FF" stroke-width="4" data-prst="rect"/><rect x="734.9" y="917.7" width="630.1" height="67.9" fill="none" stroke="#FF00FF" stroke-width="4" data-prst="rect"/><text x="1050" y="942.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">For overlapping events, Event Column says the</text><text x="1050" y="971.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">last event the route enters, but either is fine</text></svg>