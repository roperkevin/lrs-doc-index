<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 211.7" width="755" height="211.7" role="img" aria-label="Slide 9 interface wireframe (2 of 2)"><title>Slide 9 interface wireframe (2 of 2)</title><desc>Interface screenshot redrawn as a standardized wireframe: 2 fields, 1 icon, 15 text rows. 10 of 15 text rows carry text transcribed from the screenshot (OCR, approximate); the rest render as placeholder bars; positions are approximate to the source image and colours are mapped to the corpus palette.</desc><style>.plate{fill:#FFFFFF;stroke:#D7DFDF;stroke-width:1}.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.route{stroke:#16302F;stroke-width:3;stroke-dasharray:10 6;stroke-linecap:butt}.ctx{stroke:#B9C6C6;stroke-width:2.4}.event{stroke-width:8}.flat{stroke-linecap:butt}.tick{stroke:#6E8285;stroke-width:1.15}.maj{stroke:#4E6265;stroke-width:1.4}.leader{stroke:#6E8285;stroke-width:1}.split{stroke:#16302F;stroke-width:1.4;stroke-dasharray:3 2.5;opacity:.55}.splitdot{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.edge{stroke:#4E6265;stroke-width:1.8}.free{stroke-width:2.2}.freefill{stroke-width:2.2;stroke-linejoin:round}.dashed{stroke-dasharray:7 4.5}.dotted{stroke-dasharray:1.6 3.6}.node{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.t-plain{fill:#FFFFFF}.t-ink{fill:#E9EDED}.t-muted{fill:#EFF2F2}.t-cool{fill:#E5F0F5}.t-warm{fill:#F9F0E2}.t-green{fill:#E6F2EC}.t-violet{fill:#EFEAF7}.t-red{fill:#F8E9E5}.nlabel{font-size:12px;fill:#16302F;font-weight:500}.swatch{stroke-width:5}.legend{font-size:10.5px;fill:#4E6265}.s-ink{stroke:#16302F}.f-ink{fill:#16302F}.s-muted{stroke:#6E8285}.f-muted{fill:#6E8285}.s-cool{stroke:#1B6E8C}.f-cool{fill:#1B6E8C}.s-warm{stroke:#C2701A}.f-warm{fill:#9C5A12}.s-green{stroke:#2E7D5B}.f-green{fill:#2E7D5B}.s-violet{stroke:#7A5AA6}.f-violet{fill:#7A5AA6}.s-red{stroke:#B2442F}.f-red{fill:#B2442F}.event.s-cool,.swatch.s-cool{stroke:#4FA7D5}.event.s-warm,.swatch.s-warm{stroke:#E39A45}.event.s-green,.swatch.s-green{stroke:#4EB183}.event.s-violet,.swatch.s-violet{stroke:#A58BD3}.event.s-red,.swatch.s-red{stroke:#DC8168}.wf-panel{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.4}.wf-box{fill:none;stroke:#6E8285;stroke-width:1.1}.wf-field{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.1}.wf-btn{stroke-width:1.2}.wf-sep{stroke:#D7DFDF;stroke-width:1}.wf-gk{fill:#B9C6C6}.wf-gkh{fill:#4E6265}.wf-gkp{fill:#FFFFFF}.wf-ico{fill:#EFF2F2;stroke:#6E8285;stroke-width:1.1}.wf-tx{fill:#4E6265}.wf-txh{fill:#16302F;font-weight:600}.wf-txp{fill:#16302F;font-weight:500}text{font-family:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.measure{font-size:11px;fill:#6E8285;font-variant-numeric:tabular-nums}.id{font-size:12.5px;font-weight:600}.note{font-size:12px;fill:#16302F}</style><defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#16302F"/></marker><marker id="ae" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#4E6265"/></marker></defs><rect class="plate" x="1" y="1" width="753" height="209.7" rx="6"/><g transform="translate(10.7,9.7)"><rect class="wf-field" x="69.9" y="23.3" width="39.6" height="15.5" rx="4"/><rect class="wf-field" x="614.4" y="23.3" width="38.8" height="15.5" rx="4"/><rect class="wf-box" x="179.4" y="116.9" width="59.8" height="28" rx="4"/><line class="ln wf-sep" x1="78.8" y1="24.1" x2="78.8" y2="40.4"/><line class="ln wf-sep" x1="88.5" y1="24.1" x2="88.5" y2="40.4"/><line class="ln wf-sep" x1="100.2" y1="24.1" x2="100.2" y2="40.4"/><line class="ln wf-sep" x1="621.7" y1="24.1" x2="621.7" y2="40.4"/><line class="ln wf-sep" x1="631.8" y1="24.1" x2="631.8" y2="40.4"/><line class="ln wf-sep" x1="641.2" y1="24.1" x2="641.2" y2="40.4"/><line class="ln wf-sep" x1="646.2" y1="24.1" x2="646.2" y2="40.4"/><text class="wf-txh" x="9.3" y="19.9" font-size="10.5">We will try to follow what Create Feature Class do.</text><text class="wf-txh" x="320.8" y="19.6" font-size="9.8">Instead of bunch of red x next to each row outside the table, we</text><text class="wf-tx" x="9.3" y="35.8" font-size="8.4">will add a Delete</text><text class="wf-txh" x="115" y="36.5" font-size="10.5">Delete button in the upper right above the table and user can select more than one row to…</text><text class="wf-tx" x="657.1" y="35.6" font-size="8">delete at once.</text><text class="wf-tx" x="16.3" y="92.6" font-size="8">Create Feature Class</text><text class="wf-tx" x="207.4" y="92.6" font-size="8">vax</text><text class="wf-tx" x="115" y="107.3" font-size="8">Fields</text><rect class="wf-gkh" x="148.3" y="127.7" width="34.2" height="7.9" rx="4"/><rect class="wf-ico" x="230.7" y="120.8" width="11.7" height="22.5" rx="2.5"/><text class="wf-tx" x="33.4" y="155.9" font-size="8">Feld Name</text><text class="wf-tx" x="135.4" y="155.9" font-size="8">Data</text><rect class="wf-gk" x="33.4" y="164.4" width="29.5" height="4.5" rx="2.3"/><rect class="wf-gk" x="135.4" y="164.4" width="27.7" height="4.5" rx="2.3"/><rect class="wf-gk" x="33.4" y="177.6" width="19.4" height="4.5" rx="2.3"/><rect class="wf-gk" x="135.4" y="177.6" width="18.4" height="4.5" rx="2.3"/></g></svg>