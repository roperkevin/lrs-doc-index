<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="4" data-shapes="9" data-connectors="4"><title>Slide 4 drawing — 9 shapes, 4 connectors</title><defs><marker id="ah-000000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#000000"/></marker></defs><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#4472C4" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#4472C4" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#ED7D31" data-prst="rect"/><rect x="663.5" y="201.4" width="548.9" height="43.3" fill="#FFFFFF" data-prst="rect"/><text x="27.5" y="115" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">No change in Dynseg table. Do not show centerline layer in table nor create new segmentation</text><text x="27.5" y="138.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">Place centerline on top of all the lines, below all the points</text><text x="27.5" y="162.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">Use an arrow symbology to show centerline direction</text><text x="27.5" y="186.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">Show display field on centerlines. Hovering over a centerline shows Display field + Centerline ID, or Centerline ID</text><text x="27.5" y="209.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">itself if it is Display Field (like what we do today)</text><text x="27.5" y="233.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">After double clicking a centerline record, pop-up window shows 1 section called “Fields” that shows all non-editor</text><text x="27.5" y="257.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">tracking fields. All fields are non-editable.</text><text x="27.5" y="280.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" font-weight="bold" fill="#404040">Still show Statistics section if the centerline contains numeric business fields</text><rect x="82" y="381.4" width="1061" height="330" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-04-sld.png" x="82" y="381.4" width="1061" height="330" preserveAspectRatio="none"/><text x="612.5" y="550.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="89.9" y="533" width="134.4" height="27.5" fill="#F0F0F0" data-prst="rect"/><text x="157.1" y="550.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Pipeline Line</text><rect x="241.7" y="531.4" width="450.8" height="31" fill="#FFFFFF" data-prst="rect"/><rect x="814.1" y="532.7" width="323.9" height="31" fill="#FFFFFF" data-prst="rect"/><path d="M 241.7 549.1 L 470 549.1" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah-000000)"/><path d="M 692.5 549.1 L 470 549.1" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah-000000)"/><path d="M 814.1 548.9 L 1138 548.2" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah-000000)"/><rect x="697.8" y="527.4" width="121.4" height="9.7" fill="#FFFFFF" data-prst="rect"/><text x="758.6" y="534.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="8" fill="#000000">Pipeline Line ID:</text><text x="758.6" y="543.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="8" fill="#000000">{A9537-GS392-5B…</text></svg>