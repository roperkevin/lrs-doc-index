<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="59.9 16.4 1168.7 613.9" width="1168.7" height="613.9" data-slide="3" data-shapes="24" data-connectors="14"><title>Slide 3 drawing — 24 shapes, 14 connectors</title><defs><marker id="ah-4472C4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4472C4"/></marker></defs><rect x="59.9" y="16.4" width="1168.7" height="613.9" fill="#FFFFFF"/><text x="487.2" y="73.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="42.7" fill="#000000">User Story</text><text x="156" y="134.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Summary layers can be networks, polygons or line events</text><text x="156" y="157.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Length layers can be line events or networks</text><text x="156" y="179.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">Event feature selection is not supported.</text><text x="156" y="201.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">The length is calculated for the routes/events that are present for the selected effective date.</text><text x="156" y="224.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">If the template JSON has a Summary field but no Length field, utilize the field called &quot;Length&quot;</text><text x="156" y="246.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#000000">to compute the length using the routes.</text><rect x="98.4" y="402.2" width="119" height="119" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-04-slide-03-summary-layers-can-be-networks-polygons.png" x="98.4" y="402.2" width="119" height="119" preserveAspectRatio="none"/><text x="157.9" y="465.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 308.8 492.8 L 884.8 492.8" fill="none" stroke="#4472C4" stroke-width="1.3" marker-end="url(#ah-4472C4)"/><path d="M 308.8 473.6 L 308.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 740.8 473.6 L 740.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 356.8 473.6 L 356.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 500.8 473.6 L 500.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 404.8 473.6 L 404.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 644.8 473.6 L 644.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 452.8 473.6 L 452.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 596.8 473.6 L 596.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 548.8 473.6 L 548.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><path d="M 788.8 473.6 L 788.8 492.8" fill="none" stroke="#767171" stroke-width="1"/><text x="303.8" y="469.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">0</text><text x="784.8" y="469.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">10</text><text x="352.9" y="469.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">1</text><text x="401.1" y="469.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">2</text><text x="448.2" y="469.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">3</text><text x="497.3" y="469.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">4</t