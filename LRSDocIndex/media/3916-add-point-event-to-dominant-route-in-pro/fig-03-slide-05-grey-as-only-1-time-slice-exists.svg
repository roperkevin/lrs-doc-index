<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -15.1 1340.9 960.7" width="1340.9" height="960.7" data-slide="5" data-shapes="13" data-connectors="0"><title>Slide 5 drawing — 13 shapes</title><rect x="-16" y="-15.1" width="1340.9" height="960.7" fill="#FFFFFF"/><text x="9.6" y="23.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">New pane requires</text><text x="9.6" y="49.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">A paragraph about what this pane does shows up under tool</text><text x="9.6" y="75" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">title</text><text x="9.6" y="100.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Then, a time dropdown for the temporal concurrencies</text><text x="9.6" y="126.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">By default, show the earliest time slice</text><text x="9.6" y="151.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">If there is only 1 temporal concurrency, disable (grey) the</text><text x="9.6" y="177.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">dropdown</text><text x="9.6" y="203" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">If there is no concurrency in one of the time slices, we</text><text x="9.6" y="228.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">still show the time slice but only a non-editable black</text><text x="9.6" y="254.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">label for selected Route</text><text x="9.6" y="279.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">A Reset button to the right of time dropdown to reset the</text><text x="9.6" y="305.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">options in the drop downs to what was returned by the</text><text x="9.6" y="331" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">concurrency logic</text><text x="9.6" y="356.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Under time dropdown, the route ID/Name label from the first</text><text x="9.6" y="382.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">pane</text><text x="9.6" y="407.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">A grid of spatial concurrencies</text><text x="9.6" y="433.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">2 columns: Measure and Route selection</text><text x="9.6" y="459" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Measure is the measure on the route in the first pane for</text><text x="9.6" y="484.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">the chosen time slice. It does not change.</text><text x="9.6" y="510.2" text-anchor="start" font-family="Calibri, Carlito, Arial, 