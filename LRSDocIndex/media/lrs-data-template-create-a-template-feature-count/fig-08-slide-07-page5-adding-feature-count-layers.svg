<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="18.7 -6.8 1227.5 674.1" width="1227.5" height="674.1" data-slide="7" data-shapes="2" data-connectors="4"><title>Slide 7 drawing — 2 shapes, 4 connectors</title><defs><marker id="ah-4472C4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4472C4"/></marker></defs><rect x="18.7" y="-6.8" width="1227.5" height="674.1" fill="#FFFFFF"/><text x="587" y="148.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">The participants of the feature count are added in the page.</text><text x="587" y="167.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Support Line Events, Point Events and LRS intersections.</text><text x="587" y="186.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">A feature is counted for a route when their Route IDs match.</text><text x="587" y="206.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Intersections will be counted for each of the participating routes.</text><text x="587" y="225.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Count only the events that can be drawn on the route</text><text x="587" y="244.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">When a point/line event is located at the common boundary of multiple</text><text x="587" y="263.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">polygons, then only count it for one of the polygons.</text><text x="587" y="282.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If overlapping polygons exist, then pick one and provide a warning that</text><text x="587" y="302.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">overlapping polygons existed and one of them was used.</text><text x="587" y="321.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Unclassified for routes that are not intersecting the boundary polygon.</text><text x="587" y="340.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If loc errors exist, then provide a warning that events with loc errors are</text><text x="587" y="359.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">excluded from the output.</text><text x="587" y="378.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Multi-part events are counted as one</text><text x="587" y="398.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Feature count to be calculated Route wise. So, count the event (green) for</text><text x="587" y="417.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">each of the three routes (blue).</text><text x="264.3" y="50.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="42.7" fill="#000000">Page5 – Adding feature count layers</text><rect x="34.7" y="130.1" width="521.4" height="459.8" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-07-slide-07-page5-adding-feature-count-layers.png" x="34.7" y="130.1" width="521.4" height="459.8" preserveAspectRatio="none"/><text x="295.4" y="364" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 632.8 651.3 L 840.5 651.3" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/><path d="M 837.3 651.3 L 1045 651.3" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/><path d="M 1045 651.3 L 1111 651.3" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/><path d="M 632.8 633.2 L 1104.5 633.2" fill="none" stroke="#92D050" stroke-width="6"/></svg>