<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 582.4 525.1" width="582.4" height="525.1" role="img" aria-label="Slide 3 interface wireframe (2 of 2)"><title>Slide 3 interface wireframe (2 of 2)</title><desc>Interface screenshot redrawn as a standardized wireframe: 3 fields, 5 icons, 13 text rows. 10 of 13 text rows carry text transcribed from the screenshot (OCR, approximate); the rest render as placeholder bars; positions are approximate to the source image and colours are mapped to the corpus palette.</desc><style>.plate{fill:#FFFFFF;stroke:#D7DFDF;stroke-width:1}.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.route{stroke:#16302F;stroke-width:3;stroke-dasharray:10 6;stroke-linecap:butt}.ctx{stroke:#B9C6C6;stroke-width:2.4}.event{stroke-width:8}.flat{stroke-linecap:butt}.tick{stroke:#6E8285;stroke-width:1.15}.maj{stroke:#4E6265;stroke-width:1.4}.leader{stroke:#6E8285;stroke-width:1}.split{stroke:#16302F;stroke-width:1.4;stroke-dasharray:3 2.5;opacity:.55}.splitdot{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.edge{stroke:#4E6265;stroke-width:1.8}.free{stroke-width:2.2}.freefill{stroke-width:2.2;stroke-linejoin:round}.dashed{stroke-dasharray:7 4.5}.dotted{stroke-dasharray:1.6 3.6}.node{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.t-plain{fill:#FFFFFF}.t-ink{fill:#E9EDED}.t-muted{fill:#EFF2F2}.t-cool{fill:#E5F0F5}.t-warm{fill:#F9F0E2}.t-green{fill:#E6F2EC}.t-violet{fill:#EFEAF7}.t-red{fill:#F8E9E5}.nlabel{font-size:12px;fill:#16302F;font-weight:500}.swatch{stroke-width:5}.legend{font-size:10.5px;fill:#4E6265}.s-ink{stroke:#16302F}.f-ink{fill:#16302F}.s-muted{stroke:#6E8285}.f-muted{fill:#6E8285}.s-cool{stroke:#1B6E8C}.f-cool{fill:#1B6E8C}.s-warm{stroke:#C2701A}.f-warm{fill:#9C5A12}.s-green{stroke:#2E7D5B}.f-green{fill:#2E7D5B}.s-violet{stroke:#7A5AA6}.f-violet{fill:#7A5AA6}.s-red{stroke:#B2442F}.f-red{fill:#B2442F}.event.s-cool,.swatch.s-cool{stroke:#4FA7D5}.event.s-warm,.swatch.s-warm{stroke:#E39A45}.event.s-green,.swatch.s-green{stroke:#4EB183}.event.s-violet,.swatch.s-violet{stroke:#A58BD3}.event.s-red,.swatch.s-red{stroke:#DC8168}.wf-panel{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.4}.wf-box{fill:none;stroke:#6E8285;stroke-width:1.1}.wf-field{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.1}.wf-btn{stroke-width:1.2}.wf-sep{stroke:#D7DFDF;stroke-width:1}.wf-gk{fill:#B9C6C6}.wf-gkh{fill:#4E6265}.wf-gkp{fill:#FFFFFF}.wf-ico{fill:#EFF2F2;stroke:#6E8285;stroke-width:1.1}.wf-tx{fill:#4E6265}.wf-txh{fill:#16302F;font-weight:600}.wf-txp{fill:#16302F;font-weight:500}text{font-family:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.measure{font-size:11px;fill:#6E8285;font-variant-numeric:tabular-nums}.id{font-size:12.5px;font-weight:600}.note{font-size:12px;fill:#16302F}</style><defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#16302F"/></marker><marker id="ae" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#4E6265"/></marker></defs><rect class="plate" x="1" y="1" width="580.4" height="523.1" rx="6"/><g transform="translate(4,16.8)"><rect class="wf-field" x="43.2" y="187.2" width="462.4" height="33.6" rx="4"/><rect class="wf-field" x="101.4" y="267.2" width="404.2" height="33.6" rx="4"/><rect class="wf-box" x="43.2" y="316.8" width="19.2" height="19.2" rx="4"/><rect class="wf-field" x="43.2" y="374.4" width="462.4" height="33.6" rx="4"/><line class="ln wf-sep" x1="51.2" y1="193.6" x2="51.2" y2="216"/><line class="ln wf-sep" x1="480" y1="187.2" x2="480" y2="220.8"/><line class="ln wf-sep" x1="16" y1="3.2" x2="558.4" y2="3.2"/><text class="wf-tx" x="24.5" y="34.6" font-size="15">Geoprocessing</text><rect class="wf-ico" x="518.8" y="22" width="-0.4" height="16" rx="2.5"/><rect class="wf-ico" x="24.5" y="59.7" width="29.9" height="28.8" rx="2.5"/><text class="wf-tx" x="212.8" y="78.7" font-size="15">Overlay Event