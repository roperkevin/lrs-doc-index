<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-10.7 -18.3 1305.6 754.9" width="1305.6" height="754.9" data-slide="4" data-shapes="20" data-connectors="2"><title>Slide 4 drawing — 20 shapes, 2 connectors</title><rect x="-10.7" y="-18.3" width="1305.6" height="754.9" fill="#FFFFFF"/><rect x="893.9" y="-2.3" width="258" height="720" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-04-after-transitioning-to-the-2nd-pane-show.png" x="893.9" y="-2.3" width="258" height="720" preserveAspectRatio="none"/><text x="1022.9" y="361.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="30.6" y="293" width="782.7" height="100.4" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="1" data-prst="rect"/><text x="421.9" y="311.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">For Measures, allow the user to either type the X, Y value or use the picker to select</text><text x="421.9" y="330.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">location from the map</text><text x="421.9" y="349.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Measure selector should work with snapping.</text><text x="421.9" y="369" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">No. of decimal values displayed in measure should be as per M resolution of network</text><text x="421.9" y="388.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Add validations for Measure (X/Y not provided, one of them not provided, type non-numeric</text><text x="421.9" y="407.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">value)</text><rect x="34.9" y="170" width="782.5" height="114.1" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="1" data-prst="rect"/><text x="426.1" y="188.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Provide three options, for Spatial Reference dropdown: LRS Spatial Reference, Web map</text><text x="426.1" y="207.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">spatial reference, GCS_WGS_1984</text><text x="426.1" y="226.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">If the user changes spatial reference and there is already a location selected on map, then</text><text x="426.1" y="246" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">verify the coordinates based upon the selected spatial reference. If the coordinates cannot</text><text x="426.1" y="265.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">be located show an error message upon hover: The Coordinates could not be projected</text><rect x="31.5" y="401.5" width="783.2" height="161.3" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="1" data-prst="rect"/><text x="423.1" y="419.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Once the location is selected on route, show selected location on the map (including</text><text x="423.1" y="439.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">distance) with the same markers that are used in Event Editor</text><text x="423.1" y="496.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">If the user clicks on a location that isn’t on a route, the route measure closest to the</text><text x="423.1" y="515.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">original coordinates will be selected and its distance from the route will be displayed (as</text><text x="423.1" y="535.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">shown in yellow on UI)</text><text x="423.1" y="554.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">If referents are configured, then ‘using coordinates’ should be the dreferentmethod</text><rect x="382.9" y="429.2" width="42" height="55.1" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-04-after-transitioning-to-the-2nd-pane-show.png" x="382.9" y="429.2" width="42" height="55.1" preserveAspectRatio="none"/><text x="403.9" y="460.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="317.1" y="429.2" width="35.2" height="53.4" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-04-slide-04-after-transitioning-to-the-2nd-pane-show.png" x="317.1" y="429.2" width="35.2" height="53.4" preserveAspectRatio="none"/><text x="334.7" y="459.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="35" y="118.7" width="782.5" height="40.5" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="1" data-prst="rect"/><text x="426.3" y="137.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">User can type GC factor in the text box (Will adjust the coordinates by dividing X and Y by</text><text x="426.3" y="156.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">the value specified. The value should be a number and cannot be 0)</text><rect x="31.5" y="571" width="782.9" height="123.3" fill="none" stroke="#808080" stroke-width="0.8" data-prst="rect"/><text x="423" y="589.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If 2nd pane is filled out and user goes back to 1st pane:</text><text x="423" y="608.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If user selects a different method, reset 2nd (3rd pane if applicable) and clear markers on</text><text x="423" y="627.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">map</text><text x="423" y="647" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If user selects same method again, keep the markers on map and any thing filled out in 3rd</text><text x="423" y="666.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">pane</text><text x="423" y="685.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">User moves to 3rd pane, fill out the attributes and hits back , markers on map + any</text><text x="423" y="704.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">information on (2nd, 3rd ) panes should remain intact</text><rect x="381.5" y="251.2" width="228.5" height="28.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-05-slide-04-after-transitioning-to-the-2nd-pane-show.png" x="381.5" y="251.2" width="228.5" height="28.6" preserveAspectRatio="none"/><text x="495.7" y="269.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><ellipse cx="944.5" cy="133.7" rx="10.5" ry="8.3" fill="#70AD47" stroke="#385724" stroke-width="1" data-prst="ellipse"/><text x="944.5