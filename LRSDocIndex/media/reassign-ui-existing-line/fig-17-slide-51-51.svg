<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-15.8 -8.2 752.3 335.1" width="752.3" height="335.1" data-slide="51" data-shapes="9" data-connectors="5"><title>Slide 51 drawing — 9 shapes, 5 connectors</title><defs><marker id="ah-4472C4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4472C4"/></marker><marker id="ah-F9558A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#F9558A"/></marker></defs><rect x="-15.8" y="-8.2" width="752.3" height="335.1" fill="#FFFFFF"/><path d="M 720.5 120 L 0.2 120" fill="none" stroke="#808080" stroke-width="3"/><text x="14.4" y="137.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="10.7" fill="#000000">Here the arrows show the direction of the CL and the colors show route on the CL. For RA-L1, the direction of the CL is</text><text x="14.4" y="150.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="10.7" fill="#000000">opposite to that of the route’s calibration as the in-memory flip CL tool was used to create that route. When We reassign the</text><text x="14.4" y="163.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="10.7" fill="#000000">complete route RA-L1 to another line (transfer) make sure that the output route is calibrated in the same direction as before</text><path d="M 364.4 271.5 L 530.5 271.5" fill="none" stroke="#92D050" stroke-width="8"/><path d="M 192.5 271.6 L 360.5 271.6" fill="none" stroke="#92D050" stroke-width="8"/><path d="M 194.5 271.8 L 362.5 271.8" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/><path d="M 530.5 271.6 L 362.5 271.6" fill="none" stroke="#F9558A" stroke-width="1" marker-end="url(#ah-F9558A)"/><text x="180.1" y="258" text-anchor="start" font-family="C