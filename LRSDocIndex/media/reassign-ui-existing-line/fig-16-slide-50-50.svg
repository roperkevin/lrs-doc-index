" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">RX-L</text><text x="366.7" y="235" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">2</text><text x="14.4" y="137.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="10.7" fill="#000000">Here the arrows show the direction of the CL and the colors show route on the CL. For RA-L1, the direction of the CL is</text><text x="14.4" y="150.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="10.7" fill="#000000">opposite to that of the route’s calibration as the in-memory flip CL tool was used to create that route. When We reassign the</text><text x="14.4" y="163.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="10.7" fill="#000000">complete route RA-L1 to another line (transfer) make sure that the output route is calibrated in the same direction as before</text><text x="387.2" y="238.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#8497B0">100</text><text x="202.2" y="239.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#8497B0">100</text><rect x="50.4" y="372.1" width="624" height="477" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="image75.png" x="50.4" y="372.1" width="624" height="477" preserveAspectRatio="none"/><text x="362.4" y="614.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>