<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="14.6 5.7 1211.9 713.3" width="1211.9" height="713.3" data-slide="4" data-shapes="5" data-connectors="7"><title>Slide 4 drawing — 5 shapes, 7 connectors</title><defs><marker id="ah-5B9BD5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5B9BD5"/></marker></defs><rect x="14.6" y="5.7" width="1211.9" height="713.3" fill="#FFFFFF"/><rect x="865.9" y="21.7" width="344.6" height="681.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-04-after-transitioning-to-the-2nd-pane-show.png" x="865.9" y="21.7" width="344.6" height="681.3" preserveAspectRatio="none"/><text x="1038.2" y="366.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 950 221 L 873.9 221 L 873.9 74.9 L 797.7 74.9" fill="none" stroke="#5B9BD5" stroke-width="1" marker-end="url(#ah-5B9BD5)"/><rect x="30.6" y="293" width="782.7" height="80.7" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="1" data-prst="rect"/><text x="421.9" y="311.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">For Measures, allow the user to either type the X, Y value or use the picker to select</text><text x="421.9" y="330.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">location from the map</text><text x="421.9" y="349.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Measure selector should work with snapping and user should be able to zoom to x,y</text><text x="421.9" y="369" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">coordinates on the map</text><text x="421.9" y="388.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Add validations for Measure (X/Y not provided, one of them not provided, type non-numeric</text><text x="421.9" y="407.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">value)</text><rect x="34.9" y="170" width="782.5" height="114.1" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="1" data-prst="rect"/><text x="426.1" y="188.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Provide three options, for Spatial Reference dropdown: LRS Spatial Reference, Web map</text><text x="426.1" y="207.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">spatial reference, GCS_WGS_1984</text><text x="426.1" y="226.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If the user changes spatial reference and there is already a location selected on map, then</text><text x="426.1" y="246" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">verify the coordinates based upon the selected spatial reference. If the coordinates cannot</text><text x="426.1" y="265.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">be located show an error message upon hover: Coordinates could not be projected</text><rect x="31.5" y="383.8" width="783.2" height="161.3" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="1" data-prst="rect"/><text x="423.1" y="402.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Once the location is selected on route, show selected location on the map (including</text><text x="423.1" y="421.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">distance) with the same markers that are used in Event Editor</text><text x="423.1" y="479" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If the user clicks on a location that isn’t on a route, the route measure closest to the</text><text x="423.1" y="498.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">original coordinates will be selected and its distance from the route will be displayed</text><text x="423.1" y="517.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If referents are configured, then ‘using coordinates’ should be the dreferentmethod</text><rect x="382.9" y="411.5" width="42" height="55.1" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-03-slide-04-after-transitioning-to-the-2nd-pane-show.png" x="382.9" y="411.5" width="42" height="55.1" preserveAspectRatio="none"/><text x="403.9" y="443" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="317.1" y="411.5" width="35.2" height="53.4" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-04-slide-04-after-transitioning-to-the-2nd-pane-show.png" x="317.1" y="411.5" width="35.2" height="53.4" preserveAspectRatio="none"/><text x="334.7" y="442.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 837 326.3 L 884 326.3" fill="none" stroke="#5B9BD5" stroke-width="1"/><rect x="35" y="118.7" width="782.5" height="40.5" fill="#FFFFFF" stroke="#A5A5A5" stroke-width="1" data-prst="rect"/><text x="426.3" y="137.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">User can type GC factor in the text box (Will adjust the coordinates by dividing X and Y by</text><text x="426.3" y="156.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">the value specified. The value should be a number and cannot be 0)</text><path d="M 838.1 326.3 L 838.1 232.6 L 817.5 232.6 L 817.5 138.9" fill="none" stroke="#5B9BD5" stroke-width="1" marker-end="url(#ah-5B9BD5)"/><path d="M 823.6 373.9 L 823.6 315 L 796 315 L 796 256.2" fill="none" stroke="#5B9BD5" stroke-width="1" marker-end="url(#ah-5B9BD5)"/><path d="M 879 470.6 L 838.3 470.6 L 838.3 525.5 L 797.7 525.5" fill="none" stroke="#5B9BD5" stroke-width="1" marker-end="url(#ah-5B9BD5)"/><rect x="31.5" y="557.1" width="782.9" height="123.3" fill="none" stroke="#808080" stroke-width="0.8" data-prst="rect"/><text x="423" y="575.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If 2nd pane is filled out and user goes back to first pane:</text><text x="423" y="594.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If user selects a different method, reset second pane and clear markers on map</text><text x="423" y="613.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">If user selects same method again, keep the markers on map and any thing filled out in 2nd</text><text x="423" y="633.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">pane</text><text x="423" y="652.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">User moves to 3rd pane, fill out the attributes and hits back , markers on map + any</text><text x="423" y="671.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">information on (2nd, 3rd ) panes should remain intact</text><path d="M 824.5 372.8 L 886 372.8" fill="none" stroke="#5B9BD5" stroke-width="1"/><path d="M 886 407.5 L 785 362.4" fill="none" stroke="#5B9BD5" stroke-width="1" marker-end="url(#ah-5B9BD5)"/><rect x="373.5" y="251.2" width="228.5" height="28.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-05-slide-04-after-transitioning-to-the-2nd-pane-show.png" x="373.5" y="251.2" width="228.5" height="28.6" preserveAspectRatio="none"/><text x="487.7" y="269.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>