="url(#ah-156082)"/><path d="M 514.4 319.8 L 514.7 383.2" fill="none" stroke="#156082" stroke-width="1" marker-end="url(#ah-156082)"/><text x="314.4" y="390.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">If this</text><text x="314.4" y="406.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">time slice</text><text x="314.4" y="422.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">is selected</text><path d="M 336.3 426.6 L 336 489.8" fill="none" stroke="#156082" stroke-width="1" marker-end="url(#ah-156082)"/><path d="M 514.7 426.6 L 514.9 490" fill="none" stroke="#156082" stroke-width="1" marker-end="url(#ah-156082)"/><text x="249.6" y="500.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Table date will be 2010 and</text><text x="249.6" y="516.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">the routes and events</text><text x="249.6" y="532.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">available in 2010 will be</text><text x="249.6" y="548.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">used for dynseg</text><text x="490.1" y="390.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">If this</text><text x="490.1" y="406.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">time slice</text><text x="490.1" y="422.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">is selected</text><text x="460.8" y="500.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">Table date will be 2010 and</text><text x="460.8" y="516.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">the routes and events</text><text x="460.8" y="532.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">available in 2010 will be</text><text x="460.8" y="548.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">used for dynseg</text><text x="57.6" y="628" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">The only thing that matters is the from date of the time</text><text x="57.6" y="653.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">filter/slider. The dynseg will take place only for the</text><text x="57.6" y="679.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">routes and events that are present on the from date of</text><text x="57.6" y="704.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">the time slider.</text><text x="57.6" y="756" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If the time slider is set to a point in time, then that</text><text x="57.6" y="781.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">date is used to dynseg.</text><text x="57.6" y="832.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If no time slider/filter widget is configured, then</text><text x="57.6" y="858.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">today’s date is used to dynseg.</text></svg>