f" font-size="13.3" fill="#000000">generate</text><text x="488.5" y="551.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">d</text><text x="488.5" y="567.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">for</text><text x="488.5" y="583.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">dynseg</text><text x="490.1" y="390.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">If this</text><text x="490.1" y="406.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">time slice</text><text x="490.1" y="422.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#000000">is selected</text><text x="38" y="626.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">The only thing that matters is the from date of the time</text><text x="38" y="652.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">filter/slider. The dynseg will take place only for the</text><text x="38" y="677.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">routes and events that are present on the from date of</text><text x="38" y="703.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">the time slider.</text><text x="38" y="754.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If the time slider is set to a point in time, then that</text><text x="38" y="780.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">date is used to dynseg.</text><text x="38" y="831.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If no time slider/filter widget is configured, then</text><text x="38" y="856.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">today’s date is used to dynseg.</text><rect x="0" y="12.4" width="720" height="32.1" fill="#031641" data-prst="rect"/><text x="360" y="34.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#FFFFFF">Time Cases</text></svg>