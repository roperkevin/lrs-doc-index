<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 601.6 876.8" width="601.6" height="876.8" role="img" aria-label="Slide 25 interface wireframe (2 of 2)"><title>Slide 25 interface wireframe (2 of 2)</title><desc>Interface screenshot redrawn as a standardized wireframe: 2 panels, 1 field, 20 text rows. Text inside a screenshot is pixels, so text rows render as placeholder bars; positions are approximate to the source image and colours are mapped to the corpus palette.</desc><style>.plate{fill:#FFFFFF;stroke:#D7DFDF;stroke-width:1}.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.route{stroke:#16302F;stroke-width:3;stroke-dasharray:10 6;stroke-linecap:butt}.ctx{stroke:#B9C6C6;stroke-width:2.4}.event{stroke-width:8}.flat{stroke-linecap:butt}.tick{stroke:#6E8285;stroke-width:1.15}.maj{stroke:#4E6265;stroke-width:1.4}.leader{stroke:#6E8285;stroke-width:1}.split{stroke:#16302F;stroke-width:1.4;stroke-dasharray:3 2.5;opacity:.55}.splitdot{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.edge{stroke:#4E6265;stroke-width:1.8}.free{stroke-width:2.2}.freefill{stroke-width:2.2;stroke-linejoin:round}.dashed{stroke-dasharray:7 4.5}.dotted{stroke-dasharray:1.6 3.6}.node{fill:#FFFFFF;stroke:#16302F;stroke-width:1.6}.t-plain{fill:#FFFFFF}.t-ink{fill:#E9EDED}.t-muted{fill:#EFF2F2}.t-cool{fill:#E5F0F5}.t-warm{fill:#F9F0E2}.t-green{fill:#E6F2EC}.t-violet{fill:#EFEAF7}.t-red{fill:#F8E9E5}.nlabel{font-size:12px;fill:#16302F;font-weight:500}.swatch{stroke-width:5}.legend{font-size:10.5px;fill:#4E6265}.s-ink{stroke:#16302F}.f-ink{fill:#16302F}.s-muted{stroke:#6E8285}.f-muted{fill:#6E8285}.s-cool{stroke:#1B6E8C}.f-cool{fill:#1B6E8C}.s-warm{stroke:#C2701A}.f-warm{fill:#9C5A12}.s-green{stroke:#2E7D5B}.f-green{fill:#2E7D5B}.s-violet{stroke:#7A5AA6}.f-violet{fill:#7A5AA6}.s-red{stroke:#B2442F}.f-red{fill:#B2442F}.event.s-cool,.swatch.s-cool{stroke:#4FA7D5}.event.s-warm,.swatch.s-warm{stroke:#E39A45}.event.s-green,.swatch.s-green{stroke:#4EB183}.event.s-violet,.swatch.s-violet{stroke:#A58BD3}.event.s-red,.swatch.s-red{stroke:#DC8168}.wf-panel{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.4}.wf-box{fill:none;stroke:#6E8285;stroke-width:1.1}.wf-field{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.1}.wf-btn{stroke-width:1.2}.wf-sep{stroke:#D7DFDF;stroke-width:1}.wf-gk{fill:#B9C6C6}.wf-gkh{fill:#4E6265}.wf-gkp{fill:#FFFFFF}.wf-ico{fill:#EFF2F2;stroke:#6E8285;stroke-width:1.1}.wf-tx{fill:#4E6265}.wf-txh{fill:#16302F;font-weight:600}.wf-txp{fill:#16302F;font-weight:500}text{font-family:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.measure{font-size:11px;fill:#6E8285;font-variant-numeric:tabular-nums}.id{font-size:12.5px;font-weight:600}.note{font-size:12px;fill:#16302F}</style><defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#16302F"/></marker><marker id="ae" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#4E6265"/></marker></defs><rect class="plate" x="1" y="1" width="599.6" height="874.8" rx="6"/><g transform="translate(12,10.4)"><rect class="wf-panel" x="8" y="9.6" width="561.6" height="836.8" rx="7"/><rect class="wf-panel" x="116.8" y="390.4" width="409.1" height="54.4" rx="7"/><rect class="wf-field" x="172.4" y="32" width="258" height="57.6" rx="4"/><rect class="wf-box" x="32.8" y="462.4" width="493.1" height="121.6" rx="4"/><rect class="wf-box" x="32.8" y="684.8" width="493.1" height="89.6" rx="4"/><rect class="wf-gk" x="32.8" y="58.8" width="122.4" height="12" rx="6"/><rect class="wf-gk" x="193.6" y="58.8" width="206.4" height="12" rx="6"/><rect class="wf-gk" x="32.8" y="102.8" width="176.8" height="12" rx="6"/><rect class="wf-gk" x="32.8" y="146" width="316" height="12" rx="6"/><rect class="wf-gk" x="32.8" y="189.2" width="116" height="12" rx="6"/><rect class="wf-gk" x="172.4" y="189.2" width="43.6" height="12" rx="6"/><rect class="wf-gk"