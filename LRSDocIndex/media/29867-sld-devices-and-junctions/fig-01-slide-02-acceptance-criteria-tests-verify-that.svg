<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="12 52.7 704 698.4" width="704" height="698.4" data-slide="2" data-shapes="8" data-connectors="0"><title>Slide 2 drawing — 8 shapes</title><rect x="12" y="52.7" width="704" height="698.4" fill="#FFFFFF"/><rect x="30" y="68.7" width="660" height="28.8" rx="4.8" fill="#0C4982" data-prst="roundRect"/><text x="360" y="87.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Acceptance Criteria Tests: Verify that</text><rect x="28" y="301.1" width="660" height="28.8" rx="4.8" fill="#0C4982" data-prst="roundRect"/><text x="358" y="320.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Data Types</text><rect x="28" y="408" width="660" height="28.8" rx="4.8" fill="#0C4982" data-prst="roundRect"/><text x="358" y="427.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Functionality Tests</text><text x="43.6" y="127.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Shows only for an UN-APR dataset</text><text x="43.6" y="145.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Shows for SLD only, not for the DynSeg Table in ExB</text><text x="43.6" y="162.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Symbology comes from the webmap for these layers to start with</text><text x="43.6" y="180.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Allow turning these layers ON/OFF</text><text x="43.6" y="197.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">These layers show up as the top rows, even above any other point event layers</text><text x="43.6" y="215.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">The layers are un editable in the SLD</text><text x="45.6" y="462.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Hover on a device or junction shows Event ID and &lt;Display Field&gt;</text><text x="45.6" y="480" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Double click on a device or junction opens the attribute table</text><text x="45.6" y="497.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Clicking on the measure ruler shows the drill-down attributes that includes the</text><text x="45.6" y="515.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">devices and junctions</text><text x="45.6" y="532.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">These two layers support the change in zoom level</text><text x="45.6" y="550.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">These two layers support showing the statistics when configured</text><text x="45.6" y="568" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">A11y and 508 (Run Allyhawk for Web tests against widget to ensure a11y issues are</text><text x="45.6" y="585.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">not introduced)</text><text x="43.6" y="367.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">UN-APR only</text><rect x="36" y="631.7" width="660" height="28.8" rx="4.8" fill="#0C4982" data-prst="roundRect"/><text x="366" y="650.8" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" fill="#FFFFFF">Configuration Tests</text><text x="53.6" y="689.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">The devices and junctions layers appear in the list of layers in a new category</text><text x="53.6" y="706.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">named “UN Layers”</text><text x="53.6" y="724.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">The devices and junctions layers layer’s Display field can be changed</text></svg>