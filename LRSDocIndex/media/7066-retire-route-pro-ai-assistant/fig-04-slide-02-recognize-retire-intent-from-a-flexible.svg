<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1320.9 752" width="1320.9" height="752" data-slide="2" data-shapes="19" data-connectors="0"><title>Slide 2 drawing — 19 shapes</title><rect x="-16" y="-16" width="1320.9" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1276.8" height="110.4" fill="#0F2748" stroke="#0F2748" stroke-width="1.3" data-prst="rect"/><rect x="0" y="110.4" width="1276.8" height="5.8" fill="#3AA6B9" stroke="#3AA6B9" stroke-width="1.3" data-prst="rect"/><text x="48" y="83.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="34.7" font-weight="bold" fill="#FFFFFF">Summary</text><text x="31.4" y="167.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">Recognize retire intent from a flexible set of prompts (e.g., &quot;retire a route&quot;,</text><text x="31.4" y="188.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">&quot;retire the beginning of a road&quot;, &quot;retire a pipeline segment&quot;).</text><text x="31.4" y="209.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">Verify Location Referencing licensing before proceeding.</text><text x="31.4" y="230.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">Walk the user through: Network → Retire Date → Route ID(s) → From/To Measures →</text><text x="31.4" y="251.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">Recalibrate Downstream.</text><text x="31.4" y="271.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">Confirm all inputs, then open a fully-populated Retire Route UI for the user to</text><text x="31.4" y="292.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">click Run.</text><text x="31.4" y="313.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">Provide clear error / cannot-complete messages on every failure path. Verify Retire</text><text x="31.4" y="334.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#1E293B">Route only opens when no errors exist with the input parameters.</text><rect x="817.4" y="132.2" width="436.8" height="523.2" fill="#0F2748" stroke="#0F2748" stroke-width="1" data-prst="rect"/><text x="859.4" y="173.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Test environment + Test data</text><text x="837.7" y="217.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3AA6B9">CLIENT</text><text x="837.7" y="246" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">ArcGIS Pro 3.8 with Pro AI Assistant add-on</text><text x="837.7" y="282.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3AA6B9">SERVER</text><text x="837.7" y="318.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">ArcGIS Enterprise 12.2, Location Referencing configured</text><text x="838.6" y="353" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3AA6B9">DATA</text><text x="838.6" y="558.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3AA6B9">ROUTE TYPES</text><text x="839.2" y="581.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">Simple &amp; Complex routes: lollipop, loop, alpha,</text><text x="839.2" y="599.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">branch, infinity</text><text x="839.2" y="618.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">Gapped &amp; Multi-gapped routes</text><rect x="0" y="686.4" width="1276.8" height="33.6" fill="#0F2748" stroke="#0F2748" stroke-width="1.3" data-prst="rect"/><text x="38.4" y="705.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="12" fill="#FFFFFF">LRS Retire Route · AI Assistant Test Plan</text><text x="1238.4" y="705.7" text-anchor="end" font-family="Calibri, Carlito, Arial, sans-serif" font-size="12" fill="#FFFFFF">2 / 21</text><text x="838.6" y="401.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">Feature Service Only</text><text x="838.6" y="420.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">RH Network with multi-field route Ids</text><text x="838.6" y="438.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">RH PostMile Network</text><text x="838.6" y="457" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">ADM RH Network</text><text x="838.6" y="475.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">APR Line Network</text><text x="838.6" y="493.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">UNAPR Line Network</text><text x="838.6" y="512.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">Network with z-values on 3D route</text><text x="838.6" y="530.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15.3" fill="#FFFFFF">Projected and unprojected data</text><rect x="279.3" y="363.7" width="2