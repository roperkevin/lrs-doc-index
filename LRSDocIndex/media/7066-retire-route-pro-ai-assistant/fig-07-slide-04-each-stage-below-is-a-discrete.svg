8" stroke="#0F2748" stroke-width="1.3" data-prst="ellipse"/><text x="863" y="275.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#FFFFFF">6</text><text x="863" y="352" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F2748">From/To</text><text x="863" y="371.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F2748">measures</text><path d="M 815 403.2 L 911 403.2" fill="none" stroke="#3AA6B9" stroke-width="1.3"/><text x="863" y="497.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">Validate range</text><text x="863" y="513.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">and route extent;</text><text x="863" y="529.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">accept &quot;entire</text><text x="863" y="545.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">route&quot;/&quot;all&quot;.</text><path d="M 935.5 422.4 L 940.3 422.4" fill="none" stroke="#3AA6B9" stroke-width="2.7"/><rect x="940.8" y="206.4" width="144" height="432" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1" data-prst="rect"/><ellipse cx="1012.8" cy="268.8" rx="33.6" ry="33.6" fill="#0F2748" stroke="#0F2748" stroke-width="1.3" data-prst="ellipse"/><text x="1012.8" y="275.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#FFFFFF">7</text><text x="1012.8" y="352" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F2748">Recalibrate</text><text x="1012.8" y="371.2" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight=