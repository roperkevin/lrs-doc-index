ito, Arial, sans-serif" font-size="13.3" fill="#1E293B">populated Retire</text><text x="1162.6" y="545.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">Route pane.</text><rect x="0" y="686.4" width="1276.8" height="33.6" fill="#0F2748" stroke="#0F2748" stroke-width="1.3" data-prst="rect"/><text x="38.4" y="705.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="12" fill="#FFFFFF">LRS Retire Route · AI Assistant Test Plan</text><text x="1238.4" y="705.7" text-anchor="end" font-family="Calibri, Carlito, Arial, sans-serif" font-size="12" fill="#FFFFFF">4 /21</text><text x="57.6" y="663" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#64748B">Assistant will be able to handle when a sentence has been structured with the above checkpoints (1, 3-7) out of order.</text></svg>