="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">Recognize retire</text><text x="114.2" y="513.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">intent; ask user</text><text x="114.2" y="529.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">to confirm before</text><text x="114.2" y="545.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">proceeding.</text><path d="M 186.7 422.4 L 191.5 422.4" fill="none" stroke="#3AA6B9" stroke-width="2.7"/><rect x="192" y="206.4" width="144" height="432" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1" data-prst="rect"/><ellipse cx="264" cy="268.8" rx="33.6" ry="33.6" fill="#0F2748" stroke="#0F2748" stroke-width="1.3" data-prst="ellipse"/><text x="264" y="275.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" font-weight="bold" fill="#FFFFFF">2</text><text x="264" y="361.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F2748">Licensing check</text><path d="M 216 403.2 L 312 403.2" fill="none" stroke="#3AA6B9" stroke-width="1.3"/><text x="264" y="497.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">Verify Location</text><text x="264" y="513.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">Referencing</text><text x="264" y="529.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">license; link to</text><text x="264" y="545.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="13.3" fill="#1E293B">docs on failure.</text><path d="M 336.5 422.4 L 341.3 422.4" fill="none" stroke="#3AA6B9" stroke-width="2.7"/><rect x="341.8" y="206.4"