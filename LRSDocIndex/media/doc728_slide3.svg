02.2" y="936.7" font-size="15">Choose layers to display the count for.</text><text class="wf-txh" x="55.7" y="1022.3" font-size="15">© Complete</text><text class="wf-tx" x="193" y="1022.3" font-size="15">Complete and save template</text><text class="wf-tx" x="419" y="1019.7" font-size="8">template</text><text class="wf-tx" x="102.2" y="1065.1" font-size="15">Click on Finish for saving the template.</text><rect class="wf-gk" x="129.9" y="1289.8" width="50.1" height="4.5" rx="2.3"/><text class="wf-tx" x="55.7" y="1357.7" font-size="15">Learn more about creating</text><text class="wf-tx" x="342" y="1357.7" font-size="15">creating an LRS data template</text><text class="wf-tx" x="55.7" y="1461.1" font-size="15">Page 1/5</text><text class="wf-tx" x="55.7" y="1520.7" font-size="15">Previous</text><rect class="wf-gk" x="228.5" y="1509.3" width="54.8" height="12" rx="6"/><text class="wf-tx" x="383.5" y="1520.7" font-size="15">Finish</text><rect class="wf-gkh" x="520.4" y="1509.3" width="133.8" height="12" rx="6"/><text class="wf-tx" x="55.7" y="1602.7" font-size="15">LRS Data Products |</text><text class="wf-tx" x="342" y="1602.7" font-size="15">Geoprocessing</text></g></svg>