<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -6.9 1100.9 1043.4" width="1100.9" height="1043.4" data-slide="2" data-shapes="6" data-connectors="0"><title>Slide 2 drawing — 6 shapes</title><rect x="-16" y="-6.9" width="1100.9" height="1043.4" fill="#FFFFFF"/><text x="9.6" y="34.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">As of now, length of a route is calculated only at the</text><text x="9.6" y="63.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">locations where the route is intersecting all the</text><text x="9.6" y="91.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">summary layers. But we also need to calculate the</text><text x="9.6" y="120.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">length of the route that is not intersecting the</text><text x="9.6" y="149.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">summary layers and name the cell as Unclassified.</text><rect x="745" y="200.4" width="288" height="330.7" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-01-slide-02-2.png" x="745" y="200.4" width="288" height="330.7" preserveAspectRatio="none"/><text x="889" y="369.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 1031 514.3 C 1031.8 514.8 1032.7 515.3 1033.5 515.8 C 1034.2 516.3 1034.7 516.9 1035.5 517.3 C 1035.9 517.6 1036.5 517.6 1037 517.8 C 1040 519.1 1038 518.4 1040.5 519.8 C 1041.1 520.2 1041.8 520.4 1042.5 520.8 C 1043 521.1 1043.5 521.4 1044 521.8 C 1045 522.7 1045.6 524.5 1047 524.8 C 1050.1 525.6 1048.3 525.1 1052.5 526.3 C 1053 526.6 1053.6 526.8 1054 527.3 C 1054.3 527.7 1054 528.5 1054.5 528.8 C 1057.7 531.2 1057.1 529.6 1059.5 530.8 C 1060 531.1 1060.5 531.5 1061 531.8" fill="none" stroke="#0A111D" stroke-width="2.3"/><g transform="rotate(304.1 1051.3 514.2)"><rect x="1045.6" y="496.9" width="11.5" height="34.6" fill="none" stroke="#548235" stroke-width="1.3" data-prst="rightBrace"/></g><rect x="995.2" y="675.7" width="11.5" height="22.1" fill="none" stroke="#548235" stroke-width="1.3" data-prst="rightBrace"/><rect x="995.2" y="646.8" width="11.5" height="22.1" fill="none" stroke="#912E2D" stroke-width="1.3" data-prst="rightBrace"/><text x="14.5" y="218.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Testing</text><text x="14.5" y="244.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Use existing Generate LRS Data Product GP tool</text><text x="14.5" y="269.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Input template is a Length template</text><text x="14.5" y="295.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test when template does not include summary layer and user</text><text x="14.5" y="321" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">chooses the summary layer in GP tool</text><text x="14.5" y="346.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test in fgdb, egdb (oracle + sql), fs - default and versions</text><text x="14.5" y="372.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test with RH, APR, and ADM (few cases)</text><text x="14.5" y="397.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test with simple, gapped, 3D, and complex route shapes</text><text x="14.5" y="423.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test with polygons and/or line events being the summary layers</text><text x="14.5" y="449" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test with and without length layers</text><text x="14.5" y="474.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test 1 case with uncalibrated route</text><text x="14.5" y="500.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Excluded or not does not impact result</text><text x="14.5" y="525.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test 1 case with overlapping and gapped summary layers</text><text x="14.5" y="551.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test 1 case where the route does not intersect any summary</text><text x="14.5" y="577" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">layer</text><text x="14.5" y="602.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test 1 case when all length layers are within summary layers,</text><text x="14.5" y="628.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">and no Unclassified will show up</text><text x="14.5" y="653.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test with different gap calibration rules</text><text x="14.5" y="679.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" font-weight="bold" fill="#000000">Test with and without route selection and definition query</text></svg>