atch.s-violet{stroke:#A58BD3}.event.s-red,.swatch.s-red{stroke:#DC8168}.wf-panel{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.4}.wf-box{fill:none;stroke:#6E8285;stroke-width:1.1}.wf-field{fill:#FFFFFF;stroke:#6E8285;stroke-width:1.1}.wf-btn{stroke-width:1.2}.wf-sep{stroke:#D7DFDF;stroke-width:1}.wf-gk{fill:#B9C6C6}.wf-gkh{fill:#4E6265}.wf-gkp{fill:#FFFFFF}.wf-ico{fill:#EFF2F2;stroke:#6E8285;stroke-width:1.1}.wf-tx{fill:#4E6265}.wf-txh{fill:#16302F;font-weight:600}.wf-txp{fill:#16302F;font-weight:500}text{font-family:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif}.measure{font-size:11px;fill:#6E8285;font-variant-numeric:tabular-nums}.id{font-size:12.5px;font-weight:600}.note{font-size:12px;fill:#16302F}</style><defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#16302F"/></marker><marker id="ae" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0 0.7 L8 4 L0 7.3 z" fill="#4E6265"/></marker></defs><rect class="plate" x="1" y="1" width="681.2" height="1082.8" rx="6"/><g transform="translate(12,16.8)"><rect class="wf-field" x="63.7" y="171.2" width="544.3" height="33.6" rx="4"/><rect class="wf-field" x="125" y="699.2" width="483" height="40" rx="4"/><line class="ln wf-sep" x1="8" y1="3.2" x2="651.2" y2="3.2"/><line class="ln wf-sep" x1="192" y1="1048" x2="651.2" y2="1048"/><text class="wf-txh" x="24.8" y="34.2" font-size="15">Location Referencing</text><rect class="wf-ico" x="603.2" y="21.6" width="11.2" height="16" rx="2.5"/><text class="wf-txh" x="161.6" y="76.6" font-size="15">‘Add Multiple Point Events</text><rect class="wf-ico" x="616" y="51.2" width="25.6" height="25.6" rx="2.5"/><text class="wf-tx" x="254.4" y="123" font-size="15">Manage Attributes</text><text class="wf-tx" x="125" y="159.9" font-size="13">Attribute Set:</text><text class="wf-tx" x="63.7" y="193.5" font-size="13">[All