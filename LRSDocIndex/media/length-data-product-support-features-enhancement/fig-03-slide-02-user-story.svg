<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="19.1 14.5 1223.9 665.1" width="1223.9" height="665.1" data-slide="2" data-shapes="5" data-connectors="1"><title>Slide 2 drawing — 5 shapes, 1 connector</title><defs><marker id="ah-4472C4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4472C4"/></marker></defs><rect x="19.1" y="14.5" width="1223.9" height="665.1" fill="#FFFFFF"/><text x="44.7" y="71.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="42.7" font-weight="bold" fill="#000000">User Story</text><text x="554.6" y="100.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Add another option in these two GP tools:</text><text x="554.6" y="119.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Generate LRS Data Product</text><text x="554.6" y="138.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Generate Linear Referenced Length Summary:</text><text x="554.6" y="157.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Add additional option in the output format dropdown : Feature Class</text><text x="554.6" y="177.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Appears only when a Length Template is used in the Generate LRS Data Product GP</text><text x="554.6" y="196.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">tool</text><text x="554.6" y="215.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Always appears in the Generate Linear Referenced Length Summary GP tool</text><text x="554.6" y="234.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Output File (utilize existing) : Combo box to locate and name the feature class</text><text x="554.6" y="253.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">The output type is a polyline feature class without z and m values</text><text x="554.6" y="273.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Use the field properties of the input layers for the fields in the output</text><text x="554.6" y="292.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">feature class</text><text x="554.6" y="311.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">The output contains the geometry not in aggregated form.</text><text x="554.6" y="330.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">If Exclude Null Summary Rows is unchecked and Include Geometry is checked, do</text><text x="554.6" y="349.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">not include any rows with zero shape length in the feature class output.</text><text x="554.6" y="369.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Display warning message to let know the users that the output from these tools</text><text x="554.6" y="388.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">will be different for shape and table options.</text><rect x="40.1" y="96.4" width="208.7" height="469.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-01-slide-02-user-story.png" x="40.1" y="96.4" width="208.7" height="469.6" preserveAspectRatio="none"/><text x="144.5" y="335.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="263.6" y="96.4" width="264" height="548.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-02-user-story.png" x="263.6" y="96.4" width="264" height="548.3" preserveAspectRatio="none"/><text x="395.6" y="374.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><rect x="48.1" y="421" width="192.9" height="79.5" rx="13.3" fill="none" stroke="#00B050" stroke-width="1" data-prst="roundRect"/><text x="62.6" y="620.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">Option to include</text><text x="62.6" y="649.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">Geometry</text><path d="M 91.1 595.7 L 144.5 505" fill="none" stroke="#4472C4" stroke-width="1" marker-end="url(#ah-4472C4)"/><rect x="275.8" y="412.2" width="234.4" height="96.9" rx="16.2" fill="none" stroke="#00B050" stroke-width="1" data-prst="roundRect"/></svg>