<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="8" data-shapes="6" data-connectors="0"><title>Slide 8 drawing — 6 shapes</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="720" fill="#83992A" data-prst="rect"/><rect x="49.8" y="49.3" width="387.9" height="621.3" fill="#373737" data-prst="rect"/><rect x="67.2" y="66.7" width="353.3" height="586.6" fill="none" stroke="#83992A" stroke-width="1.7" data-prst="rect"/><rect x="488.6" y="0" width="791.4" height="720" fill="#FFFFFF" data-prst="rect"/><text x="498.2" y="72.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">As soon as the user select events to merge show it in the Events to</text><text x="498.2" y="97.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Merge section with a list of events that are selected</text><text x="498.2" y="123.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">The display field for the event will be used as the identifier.</text><text x="498.2" y="149.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Allow to remove an event from the selection list.</text><text x="498.2" y="174.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Keep this list synched with the selection on the map that means</text><text x="498.2" y="200.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">updating the list dynamically when the selection changes on the</text><text x="498.2" y="225.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">map/attribute table for that event layer.</text><text x="498.2" y="251.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Selecting an event will result in using its attributes for the</text><text x="498.2" y="277.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">resultant merged event.</text><text x="498.2" y="302.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Write (Preserve) along that event in the list</text><text x="498.2" y="328.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Flash the ‘Preserve’ event 3 times</text><text x="498.2" y="353.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">The first event in the list will be selected by default</text><text x="498.2" y="379.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">If events are already selected for the chosen event layer prior to</text><text x="498.2" y="405.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">opening the tool, then upon the selection of that event layer at the</text><text x="498.2" y="430.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">top, populate this section with the list of already selected events.</text><rect x="95" y="75.6" width="277.9" height="571.1" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-06-slide-07-merge-events.png" x="95" y="75.6" width="277.9" height="571.1" preserveAspectRatio="none"/><text x="234" y="365.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><text x="527.4" y="42" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">Events to Merge</text></svg>