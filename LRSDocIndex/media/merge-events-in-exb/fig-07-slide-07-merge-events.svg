<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="7" data-shapes="6" data-connectors="0"><title>Slide 7 drawing — 6 shapes</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="720" fill="#83992A" data-prst="rect"/><rect x="49.8" y="49.3" width="387.9" height="621.3" fill="#373737" data-prst="rect"/><rect x="67.2" y="66.7" width="353.3" height="586.6" fill="none" stroke="#83992A" stroke-width="1.7" data-prst="rect"/><rect x="488.6" y="0" width="791.4" height="720" fill="#FFFFFF" data-prst="rect"/><text x="714.8" y="58" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" font-weight="bold" fill="#262626">Merge Events</text><text x="513.1" y="98.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Add a widget called Merge Events.</text><text x="513.1" y="124.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Once clicked, the Merge Events tool should open in the Experience</text><text x="513.1" y="150" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">builder app.</text><text x="513.1" y="175.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">The event layer drop down should include all the LRS line events</text><text x="513.1" y="201.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">within the map and should be able to select one.</text><text x="513.1" y="226.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">The default layer should be as per the layer set in the</text><text x="513.1" y="252.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">configuration.</text><text x="513.1" y="278" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">The order of the event layers dropdown should be as per the order in</text><text x="513.1" y="303.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">the configuration.</text><text x="513.1" y="329.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">For non-spanning line events, the events should be on the same</text><text x="513.1" y="354.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">route.</text><text x="513.1" y="380.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">For spanning line events, the events should be on the same line.</text><text x="513.1" y="406" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">If a single event is selected, then show an error.</text><text x="513.1" y="431.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">For non spanning events, if the events do not belong to the same</text><text x="513.1" y="457.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">route, then show “The selected events are not on the same route”</text><text x="513.1" y="482.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">error.</text><text x="513.1" y="508.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">For spanning events, if the events do not belong to the same line,</text><text x="513.1" y="534" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">then show “The selected events are not on the same line” error.</text><text x="513.1" y="559.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#262626">Allow merging more than 2 events.</text><rect x="72.6" y="75.9" width="277.9" height="571.1" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-06-slide-07-merge-events.png" x="72.6" y="75.9" width="277.9" height="571.1" preserveAspectRatio="none"/><text x="211.5" y="365.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>