<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="11" data-shapes="5" data-connectors="0"><title>Slide 11 drawing — 5 shapes</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="720" fill="#83992A" data-prst="rect"/><rect x="49.8" y="49.3" width="387.9" height="621.3" fill="#373737" data-prst="rect"/><rect x="67.2" y="66.7" width="353.3" height="586.6" fill="none" stroke="#83992A" stroke-width="1.7" data-prst="rect"/><rect x="488.6" y="0" width="791.4" height="720" fill="#FFFFFF" data-prst="rect"/><text x="498.2" y="28.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">Retire all the events by populating their To Date with the From Date from</text><text x="498.2" y="52.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">this form and create a new event with the Event ID of the preserved event</text><text x="498.2" y="76.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">and the dates, from this form</text><text x="498.2" y="100" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">Time slice the resulting event based on the dates provided in this form and</text><text x="498.2" y="123.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">the dates of the route/routes (spanning)</text><text x="498.2" y="147.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">If the From/To Date is changed to dates outside the route date range,</text><text x="498.2" y="171" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">provide an error and alert the user that the dates are outside the route</text><text x="498.2" y="194.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">date range</text><text x="498.2" y="218.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">If the merging events are not co-incident, then fill the gap while creating</text><text x="498.2" y="242" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">the event</text><text x="498.2" y="265.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">Validate the Merged event attributes</text><text x="498.2" y="289.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">If referents are present for both from location of the first event and to</text><text x="498.2" y="313.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">location of the last event, and if the from and to measures of the merged</text><text x="498.2" y="336.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">event are unchanged, then keep the referent information intact for the</text><text x="498.2" y="360.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">merged event</text><text x="498.2" y="384.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">With reference to the case above, if the from measure of the merged event</text><text x="498.2" y="407.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">is changed then remove the referent information of the From Referent from</text><text x="498.2" y="431.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">the output merged event</text><text x="498.2" y="455.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">With reference to the case above, if the to measure of the merged event is</text><text x="498.2" y="478.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">changed then remove the referent information of the To Referent from the</text><text x="498.2" y="502.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">output merged event</text><text x="498.2" y="526.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">Once the merged event is created successfully, provide a message and return</text><text x="498.2" y="549.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">the form to its initial loading stage.</text><text x="498.2" y="573.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">Once the merged event is created successfully, refresh the layer on the map</text><text x="498.2" y="597.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="19.7" fill="#000000">and flash the merged event 3 times</text><rect x="109.3" y="79.7" width="273" height="556.6" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-11-slide-11-retire-all-the-events-by-populating.png" x="109.3" y="79.7" width="273" height="556.6" preserveAspectRatio="none"/><text x="245.8" y="362" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>