<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="10" data-shapes="5" data-connectors="0"><title>Slide 10 drawing — 5 shapes</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="720" fill="#83992A" data-prst="rect"/><rect x="49.8" y="49.3" width="387.9" height="621.3" fill="#373737" data-prst="rect"/><rect x="67.2" y="66.7" width="353.3" height="586.6" fill="none" stroke="#83992A" stroke-width="1.7" data-prst="rect"/><rect x="488.6" y="0" width="791.4" height="720" fill="#FFFFFF" data-prst="rect"/><text x="498.2" y="30.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">The event id should be of the ‘preserve’ event</text><text x="498.2" y="55.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">From and To Route id’s should be populated based on the event start</text><text x="498.2" y="81.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">and end location of the merged event.</text><text x="498.2" y="107.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">From and To Route names should be populated based on the event start</text><text x="498.2" y="132.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">and end location when route name field is configured for the event.</text><text x="498.2" y="158.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">From measure = From measure of the first event in the increasing</text><text x="498.2" y="183.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">order of calibration of the route/line</text><text x="498.2" y="209.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">To measure = To measure of the last event in the increasing order of</text><text x="498.2" y="235.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">calibration of the route/line</text><text x="498.2" y="260.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Validate the From Measure with the From Route upon running the tool</text><text x="498.2" y="286.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Validate the To Measure with the To Route upon running the tool</text><text x="498.2" y="311.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Should support Subtypes, Range Domain, Coded Value Domains,</text><text x="498.2" y="337.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Contingent values, Attribute rules, Non nullable fields</text><text x="498.2" y="363.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Provide helpful error messages upon validation. E.g., if the entered</text><text x="498.2" y="388.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">value is out of range for a field, then provide the range in the</text><text x="498.2" y="414.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">error message.</text><text x="498.2" y="439.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Denote required fields</text><text x="498.2" y="465.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="21.3" fill="#000000">Show a vertical scroll if needed</text><rect x="95" y="75.6" width="277.9" height="571.1" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-06-slide-07-merge-events.png" x="95" y="75.6" width="277.9" height="571.1" preserveAspectRatio="none"/><text x="234" y="365.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>