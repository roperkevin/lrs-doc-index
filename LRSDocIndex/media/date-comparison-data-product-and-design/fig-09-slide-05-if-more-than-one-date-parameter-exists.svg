<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="185 -74.8 1918.3 1193.3" width="1918.3" height="1193.3" data-slide="5" data-shapes="9" data-connectors="3"><title>Slide 5 drawing — 9 shapes, 3 connectors</title><defs><marker id="ah-00B0F0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00B0F0"/></marker></defs><rect x="185" y="-74.8" width="1918.3" height="1193.3" fill="#FFFFFF"/><path d="M 934.2 -19.4 L 1941.6 -19.4 L 1941.6 1102.5 L 934.2 1102.5 Z" fill="#323156"/><text x="229.2" y="104.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="86.7" fill="#F58235">Design</text><path d="M 1536.7 -58.8 L 2087.3 -58.8 L 2087.3 216.5 L 1536.7 216.5 L 1536.7 -58.8 Z" fill="none"/><text x="970.2" y="239.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">If more than one date parameter exists, then:</text><text x="970.2" y="271.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">For each Length/FCount field, add a suffix “_date “where date</text><text x="970.2" y="303.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">is in the MMDDYYYY format.</text><text x="970.2" y="335.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">Add an additional field named Change_LengthField_date_date2</text><text x="970.2" y="367.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">where the change is calculated by subtracting the length/FCount</text><text x="970.2" y="399.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">values of date 2 and date</text><text x="1008" y="151.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#F58235">Details</text><rect x="201" y="145.8" width="288" height="914.2" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-08-slide-05-if-more-than-one-date-parameter-exists.png" x="201" y="145.8" width="288" height="914.2" preserveAspectRatio="none"/><text x="345" y="606.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 594.8 418 L 450.8 418" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="606.2" y="378" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#00B0F0">date</text><path d="M 594.8 512.9 L 450.8 512.9" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="606.2" y="472.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#00B0F0">date2</text><path d="M 597 571.7 L 453 571.7" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="608.4" y="531.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#00B0F0">date3</text><text x="959.4" y="751.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">Allow the dates to be added in ascending order. If the last date is</text><text x="959.4" y="783.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">newer than the previous date, then show an error.</text><text x="959.4" y="815.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">The change values can be negative in case the date2 length is</text><text x="959.4" y="847.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">smaller than the date length.</text></svg>