<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="210.6 -74.8 1892.7 1193.3" width="1892.7" height="1193.3" data-slide="4" data-shapes="6" data-connectors="1"><title>Slide 4 drawing — 6 shapes, 1 connector</title><defs><marker id="ah-00B0F0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00B0F0"/></marker></defs><rect x="210.6" y="-74.8" width="1892.7" height="1193.3" fill="#FFFFFF"/><path d="M 934.2 -19.4 L 1941.6 -19.4 L 1941.6 1102.5 L 934.2 1102.5 Z" fill="#323156"/><text x="229.2" y="104.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="86.7" fill="#F58235">Design</text><path d="M 1536.7 -58.8 L 2087.3 -58.8 L 2087.3 216.5 L 1536.7 216.5 L 1536.7 -58.8 Z" fill="none"/><text x="984" y="269" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">Add additional optional date parameters in the Generate LRS</text><text x="984" y="301" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">Data Product GP tool</text><text x="984" y="333" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">The additional date parameter appears only when the template is</text><text x="984" y="365" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">for either Length or Feature Count data products.</text><text x="984" y="397" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">If only one date parameter exists, run the tool like we did in</text><text x="984" y="429" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">Pro 3.5.</text><text x="1008" y="151.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#F58235">Details</text><rect x="226.6" y="155.9" width="297.6" height="895.1" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-06-slide-04-design.png" x="226.6" y="155.9" width="297.6" height="895.1" preserveAspectRatio="none"/><text x="375.4" y="607.4" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 592 484 L 375.4 484" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="608" y="458.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="32" fill="#00B0F0">When a Length</text><text x="608" y="497.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="32" fill="#00B0F0">or FC template</text><text x="608" y="535.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="32" fill="#00B0F0">is used</text></svg>