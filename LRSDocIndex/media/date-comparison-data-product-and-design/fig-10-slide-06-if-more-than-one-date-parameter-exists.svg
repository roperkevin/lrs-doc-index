<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="212.4 -74.8 1890.9 1193.3" width="1890.9" height="1193.3" data-slide="6" data-shapes="11" data-connectors="5"><title>Slide 6 drawing — 11 shapes, 5 connectors</title><defs><marker id="ah-00B0F0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00B0F0"/></marker></defs><rect x="212.4" y="-74.8" width="1890.9" height="1193.3" fill="#FFFFFF"/><path d="M 934.2 -19.4 L 1941.6 -19.4 L 1941.6 1102.5 L 934.2 1102.5 Z" fill="#323156"/><text x="229.2" y="104.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="86.7" fill="#F58235">Design</text><path d="M 1536.7 -58.8 L 2087.3 -58.8 L 2087.3 216.5 L 1536.7 216.5 L 1536.7 -58.8 Z" fill="none"/><text x="970.2" y="239.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">If more than one date parameter exists, then:</text><text x="970.2" y="271.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">Always calculate changes in pairs. For example, if there are</text><text x="970.2" y="303.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">two dates: date and date2, we’ll calculate the change between</text><text x="970.2" y="335.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">date2 and date. If there are three dates: date, date2, and</text><text x="970.2" y="367.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">date3, we will calculate the change between date2 and date, as</text><text x="970.2" y="399.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">well as the change between date3 and date2.</text><text x="1008" y="151.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#F58235">Details</text><rect x="228.4" y="137.7" width="288" height="914.2" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-08-slide-05-if-more-than-one-date-parameter-exists.png" x="228.4" y="137.7" width="288" height="914.2" preserveAspectRatio="none"/><text x="372.4" y="598.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><path d="M 616.6 411.8 L 472.6 411.8" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="628" y="371.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#00B0F0">date</text><path d="M 616.6 506.7 L 472.6 506.7" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="628" y="466.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#00B0F0">date2</text><path d="M 618.8 555.8 L 474.8 555.8" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="630.2" y="515.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="37.3" fill="#00B0F0">date3</text><path d="M 1374.3 823.7 L 1374.3 727.7" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="1278.3" y="845.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#00B0F0">2 date</text><text x="1278.3" y="877.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#00B0F0">parameters</text><path d="M 1742.3 817.6 L 1742.3 721.6" fill="none" stroke="#00B0F0" stroke-width="3" marker-end="url(#ah-00B0F0)"/><text x="1700.5" y="835.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#00B0F0">3 date</text><text x="1700.5" y="867.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#00B0F0">parameters</text><text x="987" y="917" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">No limit on the number of date parameters</text><text x="987" y="949" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">Provide only column total if configured. Do not provide row</text><text x="987" y="981" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="26.7" fill="#FFFFFF">total.</text></svg>