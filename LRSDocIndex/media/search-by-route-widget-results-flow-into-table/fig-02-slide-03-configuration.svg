<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1312 752" width="1312" height="752" data-slide="3" data-shapes="5" data-connectors="1"><title>Slide 3 drawing — 5 shapes, 1 connector</title><rect x="-16" y="-16" width="1312" height="752" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="665" fill="#E48312" data-prst="rect"/><path d="M 673.1 219 L 1171.7 219" fill="none" stroke="#808080" stroke-width="0.8"/><rect x="0" y="665" width="1280" height="7" fill="#E48312" data-prst="rect"/><rect x="0" y="672" width="1280" height="48" fill="#BD582C" data-prst="rect"/><rect x="673.1" y="198.6" width="572.3" height="32.3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" data-prst="rect"/><text x="387.8" y="172.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" fill="#404040">Add “Show results in table” option below Page size and give it a toggle</text><text x="387.8" y="196.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" fill="#404040">Default is off</text><text x="387.8" y="220.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" fill="#404040">Add a hover tooltip to this option “A table widget is required. Otherwise,</text><text x="387.8" y="244.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" fill="#404040">results will still be returned in widget pane.”</text><text x="387.8" y="268.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" fill="#404040">The configuration does not detect if a table widget exists or not</text><rect x="34.5" y="19.7" width="255.4" height="639.2" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-01-slide-03-configuration.png" x="34.5" y="19.7" width="255.4" height="639.2" preserveAspectRatio="none"/><text x="162.2" y="343.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text></svg>