x="472.9" y="236.6" font-size="10">CountyLog</text><rect class="wf-gk" x="662.1" y="230.7" width="8.2" height="4.5" rx="2.3"/><text class="wf-tx" x="15.8" y="257" font-size="8">Description:</text><text class="wf-tx" x="73.3" y="257" font-size="8">Description: This asset count contains roadway</text><text class="wf-tx" x="207.6" y="257.4" font-size="8.9">roadway data for Indiana county routes and</text><text class="wf-tx" x="73.3" y="269.3" font-size="8">includes information on: number of lanes; shoulder, roadway</text><text class="wf-tx" x="319.9" y="269.6" font-size="8.9">roadway and median</text><text class="wf-tx" x="484" y="266.9" font-size="9.5">Description</text><text class="wf-tx" x="73.3" y="281" font-size="8">widths;</text><text class="wf-tx" x="107" y="281.3" font-size="8.9">widths; pavement type; speed limits; and state route milepost locations</text><text class="wf-tx" x="472.9" y="284.8" font-size="8">This asset count contains roadway</text><text class="wf-tx" x="607.7" y="284.8" font-size="8">roadway data for</text><text class="wf-tx" x="73.3" y="291.8" font-size="8">for intersecting</text><text class="wf-tx" x="132.8" y="292.2" font-size="8.9">intersecting roads and bridges, county and city limits.</text><text class="wf-tx" x="472.9" y="298" font-size="8.9">Indiana county routes and includes</text><text class="wf-tx" x="472.9" y="308.8" font-size="8">information on: number of lanes; shoulder,</text><text class="wf-tx" x="472.9" y="320.4" font-size="8">roadway</text><text class="wf-tx" x="495.4" y="320.4" font-size="8">roadway and median widths;</text><text class="wf-tx" x="600.7" y="320.5" font-size="8.4">pavement type;</text><text class="wf-tx" x="472.9" y="332.5" font-size="8.9">speed limits; and state route milepost</text><text class="wf-tx" x="472.9" y="344.2" font-size="8.9">locations for intersecting roads and bridges,</text><text class="wf-tx" x="472.9" y="355.3" font-size="8.9">county and city limits.</text><text class="wf-tx" x="544.2" y="355" font-size="8">limits.</text><text class="wf-tx" x="627" y="393.4" font-size="8.4">293/300</text><text class="wf-tx" x="472.9" y="509.7" font-size="8.9">Learn more about creating an LRS data template.</text><text class="wf-tx" x="472.9" y="548.7" font-size="10">Page 2/5</text><rect class="wf-gk" x="490.1" y="564.7" width="15.2" height="4.5" rx="2.3"/><rect class="wf-gk" x="536.1" y="564.6" width="20.8" height="4.6" rx="2.3"/><text class="wf-tx" x="591.9" y="569.8" font-size="8">Finish</text><rect class="wf-gk" x="653.9" y="564.4" width="29.8" height="4.9" rx="2.5"/><rect class="wf-gk" x="472.9" y="594.5" width="74" height="4.5" rx="2.3"/><rect class="wf-gk" x="569.1" y="594.5" width="18.7" height="4.5" rx="2.3"/></g></svg>