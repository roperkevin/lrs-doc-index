" fill="#000000">Verify that the RouteID should be</text><text x="24.7" y="491.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">empty until the user fills</text><text x="24.7" y="513.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">Verify that the RouteID can be typed</text><text x="24.7" y="535.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18.7" font-weight="bold" fill="#000000">or picked.</text><rect x="374.4" y="403.6" width="15.9" height="21" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" data-prst="rect"/><text x="24.7" y="682.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">GC Factor</text><text x="24.7" y="701.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">Verify by using a nonzero GC factor and check</text><text x="24.7" y="721.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">whether the coordinates are adjusted accordingly</text><text x="24.7" y="740.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">Verify the tool runs successfully without</text><text x="24.7" y="759.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">providing a GC factor</text><text x="24.7" y="778.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">Use different GC factors to see what difference</text><text x="24.7" y="797.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">it will make on the map: The located coordinates</text><text x="24.7" y="817.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">are entered coordinates/GC</text><text x="24.7" y="836.3" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">Check other tools in Arcgis that use GC factor-</text><text x="24.7" y="855.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">how they use it – GC only used by Location</text><text x="24.7" y="874.7" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" font-weight="bold" fill="#548235">Referencing</text><text x="24.7" y="586" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">Verify that the route selector UI is</text><text x="24.7" y="606.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">shown when the user types in a</text><text x="24.7" y="627.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="17.3" fill="#000000">routeID/Name which has more than one time slice</text><rect x="452.6" y="17" width="267.4" height="753.3" fill="#F3F3F3" stroke="#9A9A9A" stroke-dasharray="4 3"/><image href="fig-02-slide-04-4.png" x="452.6" y="17" width="267.4" height="753.3" preserveAspectRatio="none"/><text x="586.3" y="397.6" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="11" fill="#9A9A9A">picture</text><ellipse cx="468.1" cy="94.3" rx="10.5" ry="8.3" fill="#70AD47" stroke="#385724" stroke-width="1" data-prst="ellipse"/><text x="468.1" y="98.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#FFFFFF">7</text><ellipse cx="468.1" cy="129.1" rx="10.5" ry="8.3" fill="#70AD47" stroke="#385724" stroke-width="1" data-prst="ellipse"/><te