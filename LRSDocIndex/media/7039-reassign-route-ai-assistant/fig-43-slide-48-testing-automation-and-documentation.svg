<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1952 1112" width="1952" height="1112" data-slide="48" data-shapes="18" data-connectors="0"><title>Slide 48 drawing — 18 shapes</title><rect x="-16" y="-16" width="1952" height="1112" fill="#FFFFFF"/><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" data-prst="rect"/><text x="76" y="97" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328">Testing, Automation &amp; Documentation</text><rect x="72" y="161.3" width="1771.2" height="1.7" fill="#D0D7DE" data-prst="rect"/><rect x="72" y="216" width="571.2" height="360" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" data-prst="rect"/><rect x="72" y="216" width="8.6" height="360" fill="#0969DA" data-prst="rect"/><text x="104.8" y="246.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0969DA">TESTING</text><text x="104.8" y="291.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• Variety of prompts and interactions for</text><text x="104.8" y="317.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">every step</text><text x="104.8" y="344.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• Multiple network types and routeID/name</text><text x="104.8" y="370.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">compositions</text><text x="104.8" y="397" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• All three methods (Merge / Form / Transfer)</text><text x="104.8" y="423.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• Split coverage: ≈ 90% action prompts, 10%</text><text x="104.8" y="449.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">documentation</text><text x="104.8" y="476.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• I18n / L10n</text><text x="104.8" y="502.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• Accessibility</text><rect x="672" y="216" width="571.2" height="360" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" data-prst="rect"/><rect x="672" y="216" width="8.6" height="360" fill="#8250DF" data-prst="rect"/><text x="704.8" y="246.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#8250DF">AUTOMATION</text><text x="704.8" y="291.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• Author CUIT and NVVM tests for the test</text><text x="704.8" y="317.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">cases</text><rect x="1272" y="216" width="571.2" height="360" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" data-prst="rect"/><rect x="1272" y="216" width="8.6" height="360" fill="#1A7F37" data-prst="rect"/><text x="1304.8" y="246.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A7F37">DOCUMENTATION</text><text x="1304.8" y="291.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• Document the skill consistently with other</text><text x="1304.8" y="317.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">Pro AI Assistant skills</text><text x="1304.8" y="344.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• Add a note in the Reassign Route topic</text><text x="1304.8" y="370.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">linking to the skill</text><text x="1304.8" y="397" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">• Provide prompt-terminology guidance so</text><text x="1304.8" y="423.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">users know what to say to trigger Reassign</text><text x="1304.8" y="449.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">Route</text><rect x="72" y="1015.2" width="1771.2" height="1.2" fill="#D0D7DE" data-prst="rect"/><text x="76" y="1051.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18" fill="#656D76">Reassign Route AI Assistant · User Story Summary</text><text x="1839.2" y="1051.2" text-anchor="end" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18" fill="#656D76">8 / 9</text></svg>