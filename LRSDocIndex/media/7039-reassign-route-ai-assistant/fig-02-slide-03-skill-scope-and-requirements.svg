<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-16 -16 1952 1112" width="1952" height="1112" data-slide="3" data-shapes="18" data-connectors="0"><title>Slide 3 drawing — 18 shapes</title><rect x="-16" y="-16" width="1952" height="1112" fill="#FFFFFF"/><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" data-prst="rect"/><text x="76" y="97" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328">Skill Scope &amp; Requirements</text><rect x="72" y="161.3" width="1771.2" height="1.7" fill="#D0D7DE" data-prst="rect"/><text x="104.8" y="238.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0969DA">Flexible prompt recognition</text><text x="104.8" y="284.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">Trigger from natural variants: “I want to reassign a route,” “split a road,” “merge pipelines in my LRS,” etc. Coverage must include the terms</text><text x="104.8" y="310.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">reassign, merge, and split.</text><text x="104.8" y="360.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0969DA">Confirm intent before proceeding</text><text x="104.8" y="406.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">Always verify the user actually wants to Reassign a route before walking them through the parameter sequence.</text><text x="104.8" y="483.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0969DA">Check Location Referencing licensing</text><text x="104.8" y="529" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">If LR licensing is not enabled, the assistant informs the user and links to the licensing documentation.</text><text x="104.8" y="605.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0969DA">Clear failure messaging</text><text x="104.8" y="651.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">If the skill can’t be completed for any other reason, the assistant explains why in a way the user can act on.</text><text x="104.8" y="728" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0969DA">Pro maps and local scenes</text><text x="104.8" y="773.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">The skill works in both ArcGIS Pro maps and local scenes.</text><text x="104.8" y="850.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0969DA">Feature services only (for now)</text><text x="104.8" y="896.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="22" fill="#1F2328">Initial release scope is limited to networks edited through feature services.</text><rect x="72" y="1015.2" width="1771.2" height="1.2" fill="#D0D7DE" data-prst="rect"/><text x="76" y="1051.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18" fill="#656D76">Reassign Route AI Assistant · User Story Summary</text><text x="1839.2" y="1051.2" text-anchor="end" font-family="Calibri, Carlito, Arial, sans-serif" font-size="18" fill="#656D76">3 / 9</text></svg>