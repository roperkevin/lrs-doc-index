xt-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">levels</text><rect x="1039.9" y="403.4" width="222.3" height="86.6" rx="12.5" fill="none" stroke="#934BC9" stroke-width="2.7" data-prst="wedgeRoundRectCallout"/><text x="1151.1" y="412.3" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">Length results do not</text><text x="1151.1" y="431.5" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">change. Because</text><text x="1151.1" y="450.7" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">technically, we just</text><text x="1151.1" y="469.9" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">calculate length within</text><text x="1151.1" y="489.1" text-anchor="middle" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" fill="#000000">valid intersections</text></svg>