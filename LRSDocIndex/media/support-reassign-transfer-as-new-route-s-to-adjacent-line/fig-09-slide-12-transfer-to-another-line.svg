ibrate Source Routes Downstream Option</text><text x="44.7" y="616" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">* Regardless of Rname/Lname being editable/edited or not, users can change target route’s</text><text x="44.7" y="644.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="24" fill="#000000">non-LRS attributes. Changes are made to target route's new time slice only.</text><text x="315.6" y="403" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Rname (so as Rid) are</text><text x="315.6" y="420.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">kept intact in most</text><text x="315.6" y="438.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">cases</text><text x="315.6" y="455.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Rname (so as Rid) can</text><text x="315.6" y="473.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">be changed when users</text><text x="315.6" y="491" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">choose to</text><text x="520.5" y="345.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Only end CPs are</text><text x="520.5" y="363.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">transferred</text><text x="519.2" y="389.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Rname (so as Rid) are</text><text x="519.2" y="407" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">kept intact in most</text><text x="519.2" y="424.6" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">cases</text><text x="519.2" y="442.2" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Rname (so as Rid) can</text><text x="519.2" y="459.8" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">be changed when users</text><text x="519.2" y="477.4" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">choose to</text><text x="316.6" y="342.9" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">Both intermediate and</text><text x="316.6" y="360.5" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">end CPs are</text><text x="316.6" y="378.1" text-anchor="start" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.7" fill="#000000">transferred</text></svg>