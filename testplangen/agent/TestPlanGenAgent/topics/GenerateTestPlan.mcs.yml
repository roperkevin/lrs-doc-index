# Topic: GenerateTestPlan — collect a story id, confirm, run the flow,
# report the draft location.
# TestPlanGenAgentVersion: v1.3
#
# Adaptive-dialog YAML (the format behind "Open code editor" in the
# topic canvas). This file ships WITHOUT an active flow node: the
# parser requires flowId to be a real GUID, which is environment-
# specific, so a placeholder fails paste validation (GuidParseError).
# Because the flow node is absent, the three initGen* SetVariable
# nodes below declare its output variables — without them the paste
# fails with "unrecognized identifier" on every Topic.Status /
# Topic.DraftUrl / Topic.GenSummary reference (v1.2 fix). At runtime
# the flow node's output bindings overwrite the empty strings.
# After pasting, add the flow node in the CANVAS (Agent_Setup.md §3):
# in the confirmed-Yes branch, between the initGen* nodes and the
# checkStatus condition, + → Call an action → TestPlanGenAgentFlow;
# map input StoryId = Topic.StoryId and save the outputs into the
# EXISTING variables Topic.Status / Topic.DraftUrl / Topic.GenSummary
# (pick them, don't create new ones — the downstream nodes reference
# those names). The commented block below shows the node's intended
# shape for comparison with what the canvas generates.
#
# v1.3: checkStatus now branches on the full Status contract —
# ok / guard / nodraft / error — instead of ok-vs-everything, with a
# final else that names the wiring fault when Status comes back empty
# or unrecognized (the first live transcript's failure mode: the agent
# flow's error respond firing on success hands the topic an unusable
# status; see Agent_Setup.md §1c run-after discipline). The draft link
# is now a markdown link so Teams renders one clickable link without
# relying on bare-URL auto-linking.

kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Generate a test plan draft
    triggerQueries:
      - draft a test plan
      - generate a test plan
      - create a test plan draft
      - test plan for a user story
      - make a test plan from a story
      - start a test plan draft
      - test plan draft for doc
  actions:
    - kind: Question
      id: askStoryId
      interruptionPolicy:
        allowInterruption: true
      variable: Topic.StoryId
      entity: NumberPrebuiltEntity
      prompt: |-
        Which user story? Give me its Doc Index item id — the number
        in the list's ID column. To find one: Doc Index list → filter
        DocKind = User Story. (Sidecars extracted at prompt_version
        v1.7+ carry the same number as their doc_id and filename
        docNN; older sidecars stamped a different id, so when in
        doubt trust the list's ID column, not the sidecar.)
      repromptCount: 2
      unrecognizedPrompt: |-
        I need the numeric item id (for example: 42). I can't look a
        story up by title yet — the Doc Index list, filtered to
        DocKind = User Story, shows the id.

    - kind: Question
      id: confirmRun
      variable: Topic.Confirmed
      entity: BooleanPrebuiltEntity
      prompt: |-
        Generate a test-plan draft from user story doc
        {Topic.StoryId}? The flow reads that story's sidecar, its
        related documents, and exemplar test plans, and writes a
        timestamped draft to Shared Documents/Test Plan Drafts. It
        only accepts Indexed rows with DocKind = User Story.

    - kind: ConditionGroup
      id: checkConfirmed
      conditions:
        - id: confirmedYes
          condition: =Topic.Confirmed = true
          actions:
            - kind: SendActivity
              id: ackRunning
              activity: |-
                Starting generation for doc {Topic.StoryId} — this
                usually takes a minute or two.

            # Declare the flow-node output variables so the paste
            # validates with the flow node absent (see file header).
            - kind: SetVariable
              id: initGenStatus
              variable: Topic.Status
              value: =""

            - kind: SetVariable
              id: initGenDraftUrl
              variable: Topic.DraftUrl
              value: =""

            - kind: SetVariable
              id: initGenSummary
              variable: Topic.GenSummary
              value: =""

            # Add the flow node HERE via the canvas after pasting —
            # Call an action → TestPlanGenAgentFlow (see file header).
            # Intended shape once added (binding key casing follows
            # whatever the canvas generates from the flow's respond
            # schema — lowercase status/drafturl/gensummary has been
            # observed live; the casing is fine, what matters is that
            # each output lands in the EXISTING Topic.* variable):
            #   - kind: InvokeFlowAction
            #     id: runTestPlanGen
            #     flowId: <your environment's TestPlanGenAgentFlow guid>
            #     input:
            #       binding:
            #         StoryId: =Topic.StoryId
            #     output:
            #       binding:
            #         Status: Topic.Status
            #         DraftUrl: Topic.DraftUrl
            #         GenSummary: Topic.GenSummary

            - kind: ConditionGroup
              id: checkStatus
              conditions:
                - id: statusOk
                  condition: =Topic.Status = "ok"
                  actions:
                    - kind: SendActivity
                      id: sendDraftReady
                      activity: |-
                        Draft ready: [test-plan draft for doc {Topic.StoryId}]({Topic.DraftUrl})

                        It is machine-generated and UNREVIEWED. Before
                        the plan is finalized: verify every test
                        case's Trace line against the story, resolve
                        every [VERIFY] item, then transfer the
                        reviewed content into the team test-plan
                        format and upload it to the LocationReferencing
                        Documents library (the nightly sweep indexes
                        it from there).

                        Run detail: {Topic.GenSummary}

                - id: statusGuard
                  condition: =Topic.Status = "guard"
                  actions:
                    - kind: SendActivity
                      id: sendGuardMessage
                      activity: |-
                        The flow declined doc {Topic.StoryId}:

                        {Topic.GenSummary}

                        To find a qualifying row: Doc Index list →
                        filter DocKind = User Story and IndexStatus =
                        Indexed → note the ID column value, then say
                        "draft a test plan" with that id.

                - id: statusNoDraft
                  condition: =Topic.Status = "nodraft"
                  actions:
                    - kind: SendActivity
                      id: sendNoDraftMessage
                      activity: |-
                        Generation ran on doc {Topic.StoryId} but no
                        draft was written:

                        {Topic.GenSummary}

                        Re-run once; if it repeats, a maker should
                        test the prompt in the AI Builder pane —
                        testplangen/TestPlanGen_Smoke.md failure
                        triage.

                - id: statusError
                  condition: =Topic.Status = "error"
                  actions:
                    - kind: SendActivity
                      id: sendErrorMessage
                      activity: |-
                        The flow hit an error and no draft was
                        written. Error detail:

                        {Topic.GenSummary}

                        Re-run once; if it repeats, a maker should
                        check the flow run history —
                        testplangen/TestPlanGen_Smoke.md failure
                        triage.

              elseActions:
                - kind: SendActivity
                  id: sendContractBroken
                  activity: |-
                    I got an unreadable status back from the flow
                    (status: "{Topic.Status}"). That's a wiring
                    fault, not a story problem — the flow node's
                    output mapping or the agent flow's respond
                    outputs have drifted from the
                    Status/DraftUrl/GenSummary contract. A maker
                    should re-check Agent_Setup.md §1c (the two
                    responds and their run-after settings) and §3
                    (the output bindings).
      elseActions:
        - kind: SendActivity
          id: sendCancelled
          activity: |-
            Okay, nothing was generated. Tell me a Doc Index item id
            whenever you want a draft.
