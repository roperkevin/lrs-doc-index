# Topic: Fallback — everything that isn't a generation request.
# TestPlanGenAgentVersion: v1.5
#
# This agent has no knowledge sources and general knowledge is off
# (settings.mcs.yml), so the fallback's job is the redirect: corpus
# questions belong to the LRS Doc Index Q&A agent — an OPTIONAL,
# independent component (agent/QA_Agent_Setup.md); the message
# tolerates it not being deployed. Overrides the
# system fallback topic on import; if the overlay doesn't take on your
# extension version, paste the message into the built-in Fallback
# topic's message node instead (Agent_Setup.md §2 check).

kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: fallback
  actions:
    - kind: SendActivity
      id: sendRedirect
      activity: |-
        I only start test-plan drafts from indexed user stories — say
        "draft a test plan" and have the story's Doc Index item id,
        its devtopia issue number, or its title ready.

        For questions about document content — what a story says,
        which test plans cover a feature, releases, PEs — use the
        LRS Doc Index Q&A agent if your team has deployed it;
        otherwise browse the Doc Index list and its sidecar files
        directly.
