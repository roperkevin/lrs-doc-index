[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrsdoc"
version = "1.0.0"
description = "The LRS Doc Index model layer: every Claude call the pipeline makes, from versioned prompt files, through the official Anthropic SDK."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.4",
]

[project.optional-dependencies]
# what tests/ needs on top (the gates read the generated Office files back)
test = ["python-pptx", "python-docx", "PyYAML"]

[project.scripts]
lrsdoc = "lrsdoc.cli:main"

[tool.setuptools.packages.find]
include = ["lrsdoc*"]
